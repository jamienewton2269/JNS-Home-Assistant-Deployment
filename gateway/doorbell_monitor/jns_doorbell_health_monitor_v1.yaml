# JNS HA-General Doorbell Health Monitor v1
# Native Home Assistant package. Monitors the repaired doorbell chain without changing it.

input_boolean:
  jns_doorbell_fault_latched:
    name: JNS Doorbell Fault Latched
    icon: mdi:bell-alert

input_datetime:
  jns_doorbell_last_press:
    name: JNS Doorbell Last Press
    has_date: true
    has_time: true
  jns_doorbell_last_sounder_response:
    name: JNS Doorbell Last Sounder Response
    has_date: true
    has_time: true
  jns_doorbell_last_lighting_response:
    name: JNS Doorbell Last Lighting Response
    has_date: true
    has_time: true
  jns_doorbell_last_success:
    name: JNS Doorbell Last Successful End-to-End Test
    has_date: true
    has_time: true

template:
  - binary_sensor:
      - name: JNS Doorbell Static Health
        unique_id: jns_doorbell_static_health_v1
        device_class: connectivity
        state: >-
          {{
            states('binary_sensor.alarmpanel_kc868_a16_x15') not in ['unknown','unavailable']
            and states('switch.alarmpanel_kc868_a16_y01') not in ['unknown','unavailable']
            and is_state('automation.doorbell_dingdong_7am_till_11pm','on')
            and is_state('automation.jns_security_publish_doorbell_press','on')
            and is_state('automation.jns_security_doorbell_sounder_safety_off','on')
            and is_state('automation.jns_doorbell_mqtt_night_security_lighting','on')
          }}
        attributes:
          trigger_entity: binary_sensor.alarmpanel_kc868_a16_x15
          sounder_entity: switch.alarmpanel_kc868_a16_y01
          mqtt_consumer: automation.jns_doorbell_mqtt_night_security_lighting

      - name: JNS Doorbell Health
        unique_id: jns_doorbell_health_v1
        device_class: connectivity
        state: >-
          {{
            is_state('binary_sensor.jns_doorbell_static_health','on')
            and is_state('input_boolean.jns_doorbell_fault_latched','off')
          }}
        attributes:
          last_press: "{{ states('input_datetime.jns_doorbell_last_press') }}"
          last_sounder_response: "{{ states('input_datetime.jns_doorbell_last_sounder_response') }}"
          last_lighting_response: "{{ states('input_datetime.jns_doorbell_last_lighting_response') }}"
          last_success: "{{ states('input_datetime.jns_doorbell_last_success') }}"

automation:
  - id: jns_doorbell_health_static_monitor_v1
    alias: JNS Doorbell Health - Static Monitor
    description: >-
      Monitors availability and enabled state of the complete HA-General doorbell chain.
      Does not actuate the sounder or lights.
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - binary_sensor.alarmpanel_kc868_a16_x15
          - switch.alarmpanel_kc868_a16_y01
          - automation.doorbell_dingdong_7am_till_11pm
          - automation.jns_security_publish_doorbell_press
          - automation.jns_security_doorbell_sounder_safety_off
          - automation.jns_doorbell_mqtt_night_security_lighting
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.jns_doorbell_static_health
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_doorbell_fault_latched
              - action: persistent_notification.create
                data:
                  notification_id: jns_doorbell_chain_fault
                  title: JNS Doorbell Fault
                  message: >-
                    Doorbell static health check failed.
                    X15={{ states('binary_sensor.alarmpanel_kc868_a16_x15') }},
                    Y01={{ states('switch.alarmpanel_kc868_a16_y01') }},
                    chime={{ states('automation.doorbell_dingdong_7am_till_11pm') }},
                    publish={{ states('automation.jns_security_publish_doorbell_press') }},
                    safety={{ states('automation.jns_security_doorbell_sounder_safety_off') }},
                    lights={{ states('automation.jns_doorbell_mqtt_night_security_lighting') }}.
        default: []

  - id: jns_doorbell_health_press_watchdog_v1
    alias: JNS Doorbell Health - Press Watchdog
    description: >-
      On every real Door Bell Push Button press, verifies the sounder response during
      07:00-23:00 and verifies the exterior-light consumer at night.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.alarmpanel_kc868_a16_x15
        from: "off"
        to: "on"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.jns_doorbell_last_press
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - variables:
          expect_sounder: "{{ today_at('07:00') <= now() < today_at('23:00') }}"
          expect_lighting: "{{ is_state('sun.sun','below_horizon') }}"

      - if:
          - condition: template
            value_template: "{{ expect_sounder }}"
        then:
          - wait_template: "{{ is_state('switch.alarmpanel_kc868_a16_y01','on') }}"
            timeout: "00:00:03"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.jns_doorbell_last_sounder_response
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            default:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_doorbell_fault_latched
              - action: persistent_notification.create
                data:
                  notification_id: jns_doorbell_chain_fault
                  title: JNS Doorbell Fault
                  message: >-
                    Door Bell Push Button was pressed but Y01 Doorbell Sounder
                    did not turn on within 3 seconds.

      - if:
          - condition: template
            value_template: "{{ expect_lighting }}"
        then:
          - wait_template: >-
              {{
                is_state('timer.jns_doorbell_security_lighting','active')
                or is_state('switch.0xa4c138bda6ec8ea0','on')
                or is_state('switch.0x84fd27fffe9ce438','on')
              }}
            timeout: "00:00:05"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.jns_doorbell_last_lighting_response
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            default:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_doorbell_fault_latched
              - action: persistent_notification.create
                data:
                  notification_id: jns_doorbell_chain_fault
                  title: JNS Doorbell Fault
                  message: >-
                    Door Bell Push Button was pressed after dark but the
                    doorbell security-light timer/outputs did not respond within 5 seconds.

      - delay: "00:00:01"
      - if:
          - condition: state
            entity_id: binary_sensor.jns_doorbell_static_health
            state: "on"
          - condition: template
            value_template: >-
              {{
                (not expect_sounder or
                 (as_timestamp(states('input_datetime.jns_doorbell_last_sounder_response'),0)
                  >= as_timestamp(states('input_datetime.jns_doorbell_last_press'),0)))
                and
                (not expect_lighting or
                 (as_timestamp(states('input_datetime.jns_doorbell_last_lighting_response'),0)
                  >= as_timestamp(states('input_datetime.jns_doorbell_last_press'),0)))
              }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.jns_doorbell_last_success
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.jns_doorbell_fault_latched
          - action: persistent_notification.dismiss
            data:
              notification_id: jns_doorbell_chain_fault

  - id: jns_doorbell_health_recovery_clear_v1
    alias: JNS Doorbell Health - Recovery Clear
    description: >-
      Clears a latched configuration/availability fault after the static chain has
      remained healthy for one minute. Functional press failures clear on the next
      successful real doorbell press.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.jns_doorbell_static_health
        to: "on"
        for: "00:01:00"
    conditions:
      - condition: template
        value_template: >-
          {{
            as_timestamp(states('input_datetime.jns_doorbell_last_press'),0) == 0
            or as_timestamp(states('input_datetime.jns_doorbell_last_success'),0)
               >= as_timestamp(states('input_datetime.jns_doorbell_last_press'),0)
          }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jns_doorbell_fault_latched
      - action: persistent_notification.dismiss
        data:
          notification_id: jns_doorbell_chain_fault
