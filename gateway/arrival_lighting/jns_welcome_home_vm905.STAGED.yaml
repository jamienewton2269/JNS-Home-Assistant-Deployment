# JNS Welcome Home lighting (HA-General VM905 only)
# STAGED / NOT DEPLOYED. Requires verified HA-Primary MQTT Statestream,
# Wi-Fi entity mappings and demand arbitration patches before enabling.
input_boolean:
  jns_welcome_home_enabled:
    name: Welcome Home lighting enabled
    icon: mdi:home-lightbulb
    initial: false
  jns_welcome_a_away:
    name: Welcome Home phone A away
  jns_welcome_b_away:
    name: Welcome Home phone B away
  jns_welcome_porch_preexisting:
    name: Welcome Home porch was already on
  jns_welcome_dogs_preexisting:
    name: Welcome Home Dogs Run was already on

input_text:
  jns_welcome_wifi_a_entity:
    name: Welcome Home phone A Wi-Fi entity
    max: 150
  jns_welcome_wifi_b_entity:
    name: Welcome Home phone B Wi-Fi entity
    max: 150
  jns_welcome_home_ssid:
    name: Welcome Home trusted home Wi-Fi SSID
    max: 128

input_datetime:
  jns_welcome_a_away_since:
    name: Welcome Home phone A away since
    has_date: true
    has_time: true
  jns_welcome_b_away_since:
    name: Welcome Home phone B away since
    has_date: true
    has_time: true

input_number:
  jns_welcome_duration_minutes:
    name: Welcome Home lighting minutes
    min: 1
    max: 30
    step: 1
    initial: 10
    mode: box
  jns_welcome_minimum_away_seconds:
    name: Welcome Home minimum away seconds
    min: 60
    max: 900
    step: 30
    initial: 180
    mode: box

timer:
  jns_welcome_home:
    name: Welcome Home exterior lighting
    duration: "00:10:00"
    restore: true

automation:
  - id: jns_welcome_home_wifi_state_vm905_v1
    alias: JNS Welcome Home - Process remote Wi-Fi state
    mode: queued
    max: 20
    triggers:
      - trigger: mqtt
        topic: "jns/ha-primary/sensor/+/state"
    conditions:
      - condition: state
        entity_id: input_boolean.jns_welcome_home_enabled
        state: "on"
    actions:
      - variables:
          remote_entity: "{{ 'sensor.' ~ trigger.topic.split('/')[-2] }}"
          incoming: "{{ trigger.payload | from_json('') }}"
          slot: >-
            {% if remote_entity == states('input_text.jns_welcome_wifi_a_entity') %}a
            {% elif remote_entity == states('input_text.jns_welcome_wifi_b_entity') %}b
            {% else %}none{% endif %}
          home_ssid: "{{ states('input_text.jns_welcome_home_ssid') }}"
      - condition: template
        value_template: >-
          {{ slot | trim in ['a','b'] and home_ssid not in
             ['', 'unknown','unavailable'] and incoming not in
             ['unknown', 'unavailable', ''] }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ incoming != home_ssid and slot | trim == 'a' }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.jns_welcome_a_away_since
                data:
                  timestamp: "{{ as_timestamp(now()) }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_welcome_a_away
          - conditions:
              - condition: template
                value_template: "{{ incoming != home_ssid and slot | trim == 'b' }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.jns_welcome_b_away_since
                data:
                  timestamp: "{{ as_timestamp(now()) }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_welcome_b_away
          - conditions:
              - condition: template
                value_template: "{{ incoming == home_ssid and slot | trim == 'a' }}"
            sequence:
              - variables:
                  eligible: >-
                    {{ is_state('input_boolean.jns_welcome_a_away','on')
                       and as_timestamp(now()) -
                          as_timestamp(states('input_datetime.jns_welcome_a_away_since'),as_timestamp(now()))
                         >= states('input_number.jns_welcome_minimum_away_seconds') | int(180) }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_welcome_a_away
              - if:
                  - condition: template
                    value_template: "{{ eligible }}"
                  - condition: state
                    entity_id: sun.sun
                    state: below_horizon
                then:
                  - action: script.jns_welcome_home_activate
          - conditions:
              - condition: template
                value_template: "{{ incoming == home_ssid and slot | trim == 'b' }}"
            sequence:
              - variables:
                  eligible: >-
                    {{ is_state('input_boolean.jns_welcome_b_away','on')
                       and as_timestamp(now()) -
                          as_timestamp(states('input_datetime.jns_welcome_b_away_since'),as_timestamp(now()))
                         >= states('input_number.jns_welcome_minimum_away_seconds') | int(180) }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_welcome_b_away
              - if:
                  - condition: template
                    value_template: "{{ eligible }}"
                  - condition: state
                    entity_id: sun.sun
                    state: below_horizon
                then:
                  - action: script.jns_welcome_home_activate

  - id: jns_welcome_home_release_vm905_v1
    alias: JNS Welcome Home - Release exterior lighting
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.jns_welcome_home
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.jns_welcome_dogs_preexisting
            state: "off"
          - condition: state
            entity_id: timer.jns_doorbell_security_lighting
            state: idle
          - condition: state
            entity_id: binary_sensor.0xa4c138b3446c34e1_occupancy
            state: "off"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.0x84fd27fffe9ce438
      - if:
          - condition: state
            entity_id: input_boolean.jns_welcome_porch_preexisting
            state: "off"
          - condition: state
            entity_id: timer.jns_doorbell_security_lighting
            state: idle
          - condition: state
            entity_id: binary_sensor.0xa4c138b3446c34e1_occupancy
            state: "off"
          - condition: template
            value_template: >-
              {{ not (is_state('sun.sun','below_horizon') and
                  now() < today_at('23:00') and
                  as_timestamp(now()) >=
                  as_timestamp(state_attr('sun.sun','next_setting'),0) - 86400 + 1800) }}
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.0xa4c138bda6ec8ea0

script:
  jns_welcome_home_activate:
    alias: Welcome Home - Request exterior lights
    mode: queued
    sequence:
      - if:
          - condition: state
            entity_id: timer.jns_welcome_home
            state: idle
        then:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: switch.0xa4c138bda6ec8ea0
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.jns_welcome_porch_preexisting
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_welcome_porch_preexisting
          - choose:
              - conditions:
                  - condition: state
                    entity_id: switch.0x84fd27fffe9ce438
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.jns_welcome_dogs_preexisting
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_welcome_dogs_preexisting
      - action: homeassistant.turn_on
        target:
          entity_id:
            - switch.0xa4c138bda6ec8ea0
            - switch.0x84fd27fffe9ce438
      - action: timer.start
        target:
          entity_id: timer.jns_welcome_home
        data:
          duration: "{{ states('input_number.jns_welcome_duration_minutes') | int(10) * 60 }}"
