# JNS Welcome Home lighting (HA-General VM905 only)
# STAGED, NOT LIVE. One confirmed presence source can operate independently.
# Slot 1 is the current phone tracker. Slot 2 reserves its Wi-Fi SSID backup
# (home_value remains blank until the actual SSID has been confirmed).
# Slots 3-4 remain available for another mobile device or a validated BMW
# home/away source. All automation execution remains on VM905.
input_boolean:
  jns_welcome_home_enabled:
    name: Welcome Home lighting enabled
    icon: mdi:home-lightbulb
    initial: false
  jns_welcome_device_1_away:
    name: Welcome Home source 1 confirmed away
    initial: false
  jns_welcome_device_2_away:
    name: Welcome Home source 2 confirmed away
    initial: false
  jns_welcome_device_3_away:
    name: Welcome Home source 3 confirmed away
    initial: false
  jns_welcome_device_4_away:
    name: Welcome Home source 4 confirmed away
    initial: false
  jns_welcome_porch_preexisting:
    name: Welcome Home porch was already on
  jns_welcome_dogs_preexisting:
    name: Welcome Home Dogs Run was already on

input_text:
  jns_welcome_device_1_entity:
    name: Welcome Home source 1 entity
    max: 150
    initial: device_tracker.sm_s721b
  jns_welcome_device_1_home_value:
    name: Welcome Home source 1 home value
    max: 128
    initial: home
  jns_welcome_device_2_entity:
    name: Welcome Home source 2 entity
    max: 150
    initial: sensor.sm_s721b_wi_fi_connection
  jns_welcome_device_2_home_value:
    name: Welcome Home source 2 home value
    max: 128
  jns_welcome_device_3_entity:
    name: Welcome Home source 3 entity
    max: 150
  jns_welcome_device_3_home_value:
    name: Welcome Home source 3 home value
    max: 128
  jns_welcome_device_4_entity:
    name: Welcome Home source 4 entity
    max: 150
  jns_welcome_device_4_home_value:
    name: Welcome Home source 4 home value
    max: 128

input_datetime:
  jns_welcome_device_1_away_since:
    name: Welcome Home source 1 away since
    has_date: true
    has_time: true
  jns_welcome_device_2_away_since:
    name: Welcome Home source 2 away since
    has_date: true
    has_time: true
  jns_welcome_device_3_away_since:
    name: Welcome Home source 3 away since
    has_date: true
    has_time: true
  jns_welcome_device_4_away_since:
    name: Welcome Home source 4 away since
    has_date: true
    has_time: true
input_number:
  jns_welcome_duration_minutes:
    name: Welcome Home lighting minutes
    min: 1
    max: 30
    step: 1
    initial: 10
    mode: box
  jns_welcome_minimum_away_seconds:
    name: Welcome Home minimum away seconds
    min: 60
    max: 900
    step: 30
    initial: 180
    mode: box

timer:
  jns_welcome_home:
    name: Welcome Home exterior lighting
    duration: "00:10:00"
    restore: true

automation:
  - id: jns_welcome_home_remote_presence_vm905_v2
    alias: JNS Welcome Home - Process remote presence
    mode: queued
    max: 20
    triggers:
      - trigger: mqtt
        topic: "jns/ha-primary/+/+/state"
    conditions:
      - condition: state
        entity_id: input_boolean.jns_welcome_home_enabled
        state: "on"
    actions:
      - variables:
          remote_entity: "{{ trigger.topic.split('/')[-3] ~ '.' ~ trigger.topic.split('/')[-2] }}"
          incoming: "{{ trigger.payload | from_json(trigger.payload) | string | trim }}"
          slot: >-
            {% set ns = namespace(found='') %}
            {% for n in range(1, 5) %}
              {% if remote_entity == states('input_text.jns_welcome_device_' ~ n ~ '_entity')
                    and remote_entity not in ['', 'unknown', 'unavailable'] %}
                {% set ns.found = n | string %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
      - condition: template
        value_template: "{{ slot | int(0) in [1,2,3,4] and incoming not in ['', 'unknown', 'unavailable'] }}"
      - variables:
          away_entity: "{{ 'input_boolean.jns_welcome_device_' ~ (slot | trim) ~ '_away' }}"
          since_entity: "{{ 'input_datetime.jns_welcome_device_' ~ (slot | trim) ~ '_away_since' }}"
          home_value: "{{ states('input_text.jns_welcome_device_' ~ (slot | trim) ~ '_home_value') }}"
      - condition: template
        value_template: "{{ home_value not in ['', 'unknown', 'unavailable'] }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ incoming == home_value }}"
            sequence:
              - variables:
                  eligible: >-
                    {{ is_state(away_entity, 'on') and
                       as_timestamp(now()) -
                       as_timestamp(states(since_entity), as_timestamp(now()))
                       >= states('input_number.jns_welcome_minimum_away_seconds') | int(180) }}
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ away_entity }}"
              - if:
                  - condition: template
                    value_template: "{{ eligible }}"
                  - condition: state
                    entity_id: sun.sun
                    state: below_horizon
                then:
                  - action: script.jns_welcome_home_activate
        default:
          - if:
              - condition: template
                value_template: "{{ is_state(away_entity, 'off') }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ since_entity }}"
                data:
                  timestamp: "{{ as_timestamp(now()) }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ away_entity }}"

  - id: jns_welcome_home_release_vm905_v1
    alias: JNS Welcome Home - Release exterior lighting
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.jns_welcome_home
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.jns_welcome_dogs_preexisting
            state: "off"
          - condition: state
            entity_id: timer.jns_doorbell_security_lighting
            state: idle
          - condition: template
            value_template: "{{ not is_state('timer.jns_backdoor_dogs_run', 'active') }}"
          - condition: state
            entity_id: binary_sensor.0xa4c138b3446c34e1_occupancy
            state: "off"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.0x84fd27fffe9ce438
      - if:
          - condition: state
            entity_id: input_boolean.jns_welcome_porch_preexisting
            state: "off"
          - condition: state
            entity_id: timer.jns_doorbell_security_lighting
            state: idle
          - condition: state
            entity_id: binary_sensor.0xa4c138b3446c34e1_occupancy
            state: "off"
          - condition: template
            value_template: >-
              {{ not (is_state('sun.sun','below_horizon') and
                  now() < today_at('23:00') and
                  as_timestamp(now()) >=
                  as_timestamp(state_attr('sun.sun','next_setting'),0) - 86400 + 1800) }}
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.0xa4c138bda6ec8ea0

script:
  jns_welcome_home_activate:
    alias: Welcome Home - Request exterior lights
    mode: queued
    sequence:
      - if:
          - condition: state
            entity_id: timer.jns_welcome_home
            state: idle
        then:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: switch.0xa4c138bda6ec8ea0
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.jns_welcome_porch_preexisting
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_welcome_porch_preexisting
          - choose:
              - conditions:
                  - condition: state
                    entity_id: switch.0x84fd27fffe9ce438
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.jns_welcome_dogs_preexisting
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_welcome_dogs_preexisting
      - action: homeassistant.turn_on
        target:
          entity_id:
            - switch.0xa4c138bda6ec8ea0
            - switch.0x84fd27fffe9ce438
      - action: timer.start
        target:
          entity_id: timer.jns_welcome_home
        data:
          duration: "{{ states('input_number.jns_welcome_duration_minutes') | int(10) * 60 }}"
