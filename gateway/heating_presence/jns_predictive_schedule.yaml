# JNS Predictive Home Heating v1.0 — HA-General only
# Alarm-dependent control fails closed if neither verified alarm entity is available.
# Reuse learned thermal coefficients from jns_heating_zones; no second thermal learner.
input_boolean:
  jns_heating_automatic_override:
    name: Heating Automatic Override
    icon: mdi:hand-back-right
  jns_heating_manual_setpoint_hold:
    name: Preserve User-Selected Honeywell Setpoint
    icon: mdi:thermostat-lock
  jns_heating_bedtime_learning_paused:
    name: Pause Bedtime Learning
    icon: mdi:brain

  jns_heating_warmup_tracking:
    name: JNS Morning Warm-up Measurement Active
  jns_heating_warmup_heat_seen:
    name: JNS Morning Warm-up Heat Observed

input_number:
  jns_heating_manual_target:
    name: Honeywell User-Selected Setpoint
    min: 5
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
  jns_heating_last_automatic_target:
    name: JNS Last Automatic Setpoint
    min: 5
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
  jns_heating_warmup_minutes_per_degree:
    name: Observed Morning Warm-up Minutes per Degree
    min: 5
    max: 180
    step: 0.1
    mode: box
  jns_heating_warmup_observations:
    name: Valid Morning Warm-up Observations
    min: 0
    max: 90
    step: 1
    mode: box
  jns_heating_warmup_start_temperature:
    name: Morning Warm-up Start Temperature
    min: 15
    max: 22
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
  jns_heating_away_minimum_temp:
    name: House Minimum Away Temperature
    icon: mdi:home-thermometer-outline
    min: 15
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
  jns_heating_bedtime_mean_offset:
    name: Learned Bedtime Minutes After Noon
    min: 420
    max: 900
    step: 1
    mode: box
  jns_heating_bedtime_samples:
    name: Learned Bedtime Samples
    min: 0
    max: 90
    step: 1
    mode: box

input_datetime:
  jns_heating_last_auto_command_time:
    name: JNS Last Automatic Target Command Time
    has_date: true
    has_time: true
  jns_heating_warmup_started:
    name: Morning Warm-up Measurement Start
    has_date: true
    has_time: true
  jns_heating_last_bedtime_sample:
    name: Last Learned Bedtime
    has_date: true
    has_time: true

template:
  - sensor:
      - name: JNS Heating Active Requested Target
        unique_id: jns_heating_active_requested_target
        icon: mdi:thermostat
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: >-
          {% set away = states('input_number.jns_heating_away_minimum_temp') | float(15) %}
          {% set alarm = states('sensor.jns_heating_verified_alarm_state') %}
          {% if is_state('input_boolean.jns_heating_manual_setpoint_hold','on') and
                is_number(states('input_number.jns_heating_manual_target')) %}
            {% set target = state_attr('climate.thermostat_thermostat','temperature') | float(states('input_number.jns_heating_manual_target') | float(21)) %}
            {{ [target, away] | max if alarm == 'armed_away' else target }}
          {% elif alarm == 'armed_away' %}
            {{ away }}
          {% elif states('input_datetime.jns_heating_last_auto_command_time') in ['unknown','unavailable','']
                and is_number(state_attr('climate.thermostat_thermostat','temperature'))
                and state_attr('climate.thermostat_thermostat','temperature') | float not in [18,21] %}
            {# Preserve pre-existing wall/UI target on first installation. #}
            {{ state_attr('climate.thermostat_thermostat','temperature') | float }}
          {% else %}
            21
          {% endif %}
        attributes:
          manual_hold: "{{ is_state('input_boolean.jns_heating_manual_setpoint_hold','on') }}"
          source: >-
            {{ 'Honeywell manual target' if is_state('input_boolean.jns_heating_manual_setpoint_hold','on') else 'Scheduled default' }}
      - name: JNS Heating Learned Bedtime
        unique_id: jns_heating_learned_bedtime
        icon: mdi:bed-clock
        state: >-
          {% set samples = states('input_number.jns_heating_bedtime_samples') | int(0) %}
          {% if samples == 0 %}
            Learning
          {% else %}
            {% set minute = (720 + states('input_number.jns_heating_bedtime_mean_offset') | int(420)) % 1440 %}
            {{ '%02d:%02d' | format(minute // 60, minute % 60) }}
          {% endif %}
        attributes:
          observations: "{{ states('input_number.jns_heating_bedtime_samples') | int(0) }}"
          ready: "{{ states('input_number.jns_heating_bedtime_samples') | int(0) >= 7 }}"
      - name: JNS Heating Predictive Preheat Minutes
        unique_id: jns_heating_predictive_preheat_minutes
        icon: mdi:fire-clock
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {% set indoor = states('sensor.jns_hallway_house_temperature') | float(none) %}
          {% set target = states('sensor.jns_heating_active_requested_target') | float(21) %}
          {% set outdoor = states('sensor.thermostat_thermostat_outdoor_temperature') | float(none) %}
          {% set model = 'sensor.jns_hallway_thermal_learning' %}
          {% set ready = state_attr(model, 'ready') %}
          {% set k = state_attr(model, 'loss_per_hour') | float(0) %}
          {% set h = state_attr(model, 'heat_gain_c_per_hour') | float(0) %}
          {% set b = state_attr(model, 'drift_c_per_hour') | float(0) %}
          {% if indoor is not none and indoor >= (target - 0.2) %}
            0
          {% elif indoor is not none and outdoor is not none and ready in [true, 'True'] and state_attr(model, 'source_epoch') == 'hallway-precision-v1' and k > 0 and h > 0 %}
            {% set n = namespace(temp=indoor, eta=360) %}
            {% for step in range(1, 73) %}
              {% if n.temp < (target - 0.2) %}
                {% set n.temp = n.temp + (k * (outdoor - n.temp) + h + b) / 12 %}
                {% if n.temp >= (target - 0.2) %}{% set n.eta = step * 5 %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ n.eta }}
          {% elif indoor is not none and indoor < (target - 0.2) and
                  states('input_number.jns_heating_warmup_observations') | int(0) >= 3 and
                  5 <= states('input_number.jns_heating_warmup_minutes_per_degree') | float(0) <= 180 %}
            {{ [360, [5, ((target - indoor) * (states('input_number.jns_heating_warmup_minutes_per_degree') | float(0))) | round(0) | int] | max] | min }}
          {% else %}
            120
          {% endif %}
        attributes:
          prediction_model: >-
            {% if state_attr('sensor.jns_hallway_thermal_learning', 'ready') in [true, 'True'] and state_attr('sensor.jns_hallway_thermal_learning', 'source_epoch') == 'hallway-precision-v1' %}
              Validated JNS thermal learner
            {% elif states('input_number.jns_heating_warmup_observations') | int(0) >= 3 %}
              Observed morning warm-up ({{ states('input_number.jns_heating_warmup_observations') | int(0) }} accepted cycles)
            {% else %}
              Conservative 120-minute fallback; {{ states('input_number.jns_heating_warmup_observations') | int(0) }}/3 measured cycles
            {% endif %}
          target_time: "10:00"
      - name: JNS Heating Predictive Cooling Minutes
        unique_id: jns_heating_predictive_cooling_minutes
        icon: mdi:weather-night
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {% set indoor = states('sensor.jns_hallway_house_temperature') | float(none) %}
          {% set outdoor = states('sensor.thermostat_thermostat_outdoor_temperature') | float(none) %}
          {% set model = 'sensor.jns_hallway_thermal_learning' %}
          {% set ready = state_attr(model, 'ready') %}
          {% set k = state_attr(model, 'loss_per_hour') | float(0) %}
          {% set b = state_attr(model, 'drift_c_per_hour') | float(0) %}
          {% if indoor is not none and indoor <= 18.2 %}
            0
          {% elif indoor is not none and outdoor is not none and ready in [true, 'True'] and state_attr(model, 'source_epoch') == 'hallway-precision-v1' and k > 0 %}
            {% set n = namespace(temp=indoor, eta=180) %}
            {% for step in range(1, 37) %}
              {% if n.temp > 18.2 %}
                {% set n.temp = n.temp + (k * (outdoor - n.temp) + b) / 12 %}
                {% if n.temp <= 18.2 %}{% set n.eta = step * 5 %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ n.eta }}
          {% else %}
            60
          {% endif %}
        attributes:
          predictive: "{{ state_attr('sensor.jns_hallway_thermal_learning', 'ready') in [true, 'True'] and state_attr('sensor.jns_hallway_thermal_learning', 'source_epoch') == 'hallway-precision-v1' }}"
      - name: JNS Heating Verified Alarm State
        unique_id: jns_heating_verified_alarm_state
        icon: mdi:shield-home
        state: >-
          {% set a = states('alarm_control_panel.home_alarm') %}
          {% set b = states('alarm_control_panel.house_alarm') %}
          {% if a in ['armed_home', 'armed_away', 'disarmed'] %}{{ a }}
          {% elif b in ['armed_home', 'armed_away', 'disarmed'] %}{{ b }}
          {% else %}unavailable{% endif %}
      - name: JNS Heating Schedule Decision
        unique_id: jns_heating_schedule_decision
        icon: mdi:calendar-clock
        state: >-
          {% if is_state('input_boolean.jns_heating_automatic_override', 'on') %}
            Manual override
          {% elif is_state('sensor.jns_heating_verified_alarm_state', 'unavailable') %}
            Waiting for alarm state
          {% elif is_state('sensor.jns_heating_verified_alarm_state', 'armed_away') %}
            Away minimum
          {% elif is_state('input_boolean.general_bedtime_mode', 'on') and now().hour < 4 %}
            Bedtime comfort
          {% else %}
            Predictive schedule
          {% endif %}

automation:
  - id: jns_heating_learn_bedtime_v1
    alias: JNS Heating - Learn normal bedtime from actual activation
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.general_bedtime_mode
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.jns_heating_bedtime_learning_paused
        state: "off"
      - condition: template
        value_template: >-
          {{ now().hour >= 19 or now().hour < 3 }}
      - condition: template
        value_template: >-
          {{ as_timestamp(now()) - as_timestamp(states('input_datetime.jns_heating_last_bedtime_sample'), 0) > 43200 }}
      - condition: template
        value_template: >-
          {% set n = states('input_number.jns_heating_bedtime_samples') | int(0) %}
          {% set m = states('input_number.jns_heating_bedtime_mean_offset') | float(600) %}
          {% set t = (now().hour * 60 + now().minute - 720 + 1440) % 1440 %}
          {{ n < 7 or (t - m) | abs < 180 }}
    actions:
      - variables:
          current_offset: "{{ (now().hour * 60 + now().minute - 720 + 1440) % 1440 }}"
          old_count: "{{ states('input_number.jns_heating_bedtime_samples') | int(0) }}"
          old_mean: "{{ states('input_number.jns_heating_bedtime_mean_offset') | float(600) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.jns_heating_bedtime_mean_offset
        data:
          value: >-
            {% if old_count | int(0) == 0 %}
              {{ current_offset | float }}
            {% else %}
              {{ (old_mean | float + ((current_offset | float) - (old_mean | float)) / ([old_count | int(0) + 1, 14] | min)) | round(0) }}
            {% endif %}
      - action: input_number.set_value
        target:
          entity_id: input_number.jns_heating_bedtime_samples
        data:
          value: "{{ [old_count | int(0) + 1, 90] | min }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.jns_heating_last_bedtime_sample
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: jns_heating_alarm_predictive_target_v1
    alias: JNS Heating - Predictive home 10am and learned bedtime setback
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - alarm_control_panel.home_alarm
          - alarm_control_panel.house_alarm
          - input_boolean.general_bedtime_mode
          - input_boolean.jns_heating_automatic_override
          - input_boolean.jns_heating_manual_setpoint_hold
          - input_number.jns_heating_away_minimum_temp
          - input_number.jns_heating_bedtime_samples
    actions:
      - variables:
          alarm: "{{ states('sensor.jns_heating_verified_alarm_state') }}"
          minutes_now: "{{ now().hour * 60 + now().minute }}"
          preheat: "{{ states('sensor.jns_heating_predictive_preheat_minutes') | int(120) }}"
          user_target: "{{ states('sensor.jns_heating_active_requested_target') | float(21) }}"
          manual_target: "{{ state_attr('climate.thermostat_thermostat','temperature') | float(states('input_number.jns_heating_manual_target') | float(21)) }}"
          away_min: "{{ states('input_number.jns_heating_away_minimum_temp') | float(15) }}"
          cooling: "{{ [states('sensor.jns_heating_predictive_cooling_minutes') | int(60), 150] | min }}"
          bedtime_offset: "{{ states('input_number.jns_heating_bedtime_mean_offset') | int(600) }}"
          bed_samples: "{{ states('input_number.jns_heating_bedtime_samples') | int(0) }}"
          house_offset: "{{ (now().hour * 60 + now().minute - 720 + 1440) % 1440 }}"
      - variables:
          desired: >-
            {% if is_state('input_boolean.jns_heating_automatic_override', 'on') %}
              none
            {% elif alarm == 'armed_away' %}
              {% if is_state('input_boolean.jns_heating_manual_setpoint_hold','on')
                    and manual_target | float > away_min | float %}
                none
              {% else %}
                {{ away_min }}
              {% endif %}
            {% elif alarm not in ['disarmed', 'armed_home'] %}
              none
            {% elif is_state('input_boolean.jns_heating_manual_setpoint_hold','on') %}
              none
            {% elif states('input_datetime.jns_heating_last_auto_command_time') in ['unknown','unavailable','']
                  and is_number(state_attr('climate.thermostat_thermostat','temperature'))
                  and (state_attr('climate.thermostat_thermostat','temperature') | float) not in [18,21] %}
              {# First installation: do not reset an existing user target. #}
              none
            {% elif is_state('input_boolean.general_bedtime_mode','on') %}
              18
            {% elif is_state('binary_sensor.jns_fireplace_override_safe','on') %}
              18
            {% elif 240 <= minutes_now | int < 600 and (600 - minutes_now | int) <= (preheat | int + 10) %}
              {{ user_target }}
            {% elif minutes_now | int >= 600 and minutes_now | int < 1140 %}
              {{ user_target }}
            {% elif minutes_now | int >= 1140 and bed_samples | int >= 7 and bedtime_offset | int - house_offset | int <= cooling | int and bedtime_offset | int - house_offset | int >= 0 %}
              18
            {% elif minutes_now | int >= 1140 and bed_samples | int >= 7 and house_offset | int >= bedtime_offset | int %}
              18
            {% elif is_state('input_boolean.general_bedtime_mode', 'on') %}
              18
            {% elif minutes_now | int >= 1140 %}
              21
            {% else %}
              18
            {% endif %}
      - condition: template
        value_template: >-
          {{ desired | trim not in ['none', 'unavailable', 'unknown', ''] and
             is_number(state_attr('climate.thermostat_thermostat', 'temperature')) and
             (state_attr('climate.thermostat_thermostat', 'temperature') | float - desired | float) | abs >= 0.4 }}
      # Observe Hallway 18-21C response, ignoring fireplace periods.
      # Honeywell remains the only heating actuator; the hallway is the
      # authoritative JNS prediction input, not a Honeywell sensor replacement.
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ desired | float(0) == 21 and 240 <= minutes_now | int(0) < 600
                     and alarm in ['disarmed', 'armed_home']
                     and is_state('input_boolean.jns_heating_warmup_tracking', 'off')
                     and is_state('binary_sensor.jns_fireplace_heat_detected', 'off')
                     and is_number(states('sensor.jns_hallway_house_temperature'))
                     and 15 <= states('sensor.jns_hallway_house_temperature') | float(0) < 20.8
                     and state_attr('climate.thermostat_thermostat', 'temperature') | float(0) < 20.5 }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.jns_heating_warmup_start_temperature
                data:
                  value: "{{ states('sensor.jns_hallway_house_temperature') | float }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.jns_heating_warmup_started
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_heating_warmup_heat_seen
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_heating_warmup_tracking
      # JNS_MANUAL_HIGH_HEAT_PRESERVED_V1: tag outbound setpoint writes.
      - action: input_number.set_value
        target:
          entity_id: input_number.jns_heating_last_automatic_target
        data:
          value: "{{ desired | float }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.jns_heating_last_auto_command_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat_thermostat
        data:
          temperature: "{{ desired | float }}"
        continue_on_error: true

  # Separate timing calibration, NOT a second thermal-physics learner.
  # Only use completed morning heating cycles; no thermostat commands here.
  - id: jns_heating_observe_morning_warmup_v1
    alias: JNS Heating - Learn measured morning warm-up lead time
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - sensor.jns_hallway_house_temperature
          - binary_sensor.lyric_home_heating_heating_call
          - climate.thermostat_thermostat
    conditions:
      - condition: state
        entity_id: input_boolean.jns_heating_warmup_tracking
        state: "on"
    actions:
      - variables:
          indoor: "{{ states('sensor.jns_hallway_house_temperature') | float(-99) }}"
          start_c: "{{ states('input_number.jns_heating_warmup_start_temperature') | float(-99) }}"
          elapsed_min: "{{ (as_timestamp(now()) - as_timestamp(states('input_datetime.jns_heating_warmup_started'), as_timestamp(now()))) / 60 }}"
          alarm: "{{ states('sensor.jns_heating_verified_alarm_state') }}"
          target_c: "{{ state_attr('climate.thermostat_thermostat', 'temperature') | float(-99) }}"
      - choose:
          # Discard interrupted/manual/away/unavailable/multi-day or implausible runs.
          - conditions:
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.jns_heating_automatic_override', 'on')
                     or alarm not in ['disarmed', 'armed_home']
                     or is_state('binary_sensor.jns_fireplace_heat_detected','on')
                     or is_state('binary_sensor.jns_fireplace_override_safe','on')
                     or target_c | float(-99) != 21
                     or indoor | float(-99) < 15
                     or start_c | float(-99) < 15
                     or start_c | float(-99) >= 20.8
                     or elapsed_min | float(0) < 0
                     or elapsed_min | float(0) > 360
                     or now().hour >= 16 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_heating_warmup_tracking
          - conditions:
              - condition: state
                entity_id: binary_sensor.lyric_home_heating_heating_call
                state: "on"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.jns_heating_warmup_heat_seen
          - conditions:
              - condition: template
                value_template: "{{ indoor | float(-99) >= 20.8 }}"
            sequence:
              - variables:
                  minutes_per_degree: >-
                    {{ (elapsed_min | float(0)) / (21 - start_c | float(0)) }}
                  prior_n: "{{ states('input_number.jns_heating_warmup_observations') | int(0) }}"
                  prior_rate: "{{ states('input_number.jns_heating_warmup_minutes_per_degree') | float(0) }}"
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.jns_heating_warmup_heat_seen
                        state: "on"
                      - condition: template
                        value_template: >-
                          {{ 10 <= elapsed_min | float(0) <= 360
                             and 5 <= minutes_per_degree | float(0) <= 180 }}
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.jns_heating_warmup_minutes_per_degree
                        data:
                          value: >-
                            {% if prior_n | int(0) == 0 %}
                              {{ minutes_per_degree | float | round(1) }}
                            {% else %}
                              {{ (prior_rate | float + (minutes_per_degree | float - prior_rate | float) /
                                 ([prior_n | int(0), 6] | min + 1)) | round(1) }}
                            {% endif %}
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.jns_heating_warmup_observations
                        data:
                          value: "{{ [prior_n | int(0) + 1, 90] | min }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.jns_heating_warmup_tracking

  - id: jns_heating_capture_honeywell_manual_target_v1
    alias: JNS Heating - Follow Honeywell thermostat and dashboard setpoint
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: climate.thermostat_thermostat
        attribute: temperature
    conditions:
      - condition: template
        value_template: >-
          {% set old = trigger.from_state.attributes.get('temperature') if trigger.from_state is not none else none %}
          {% set new = trigger.to_state.attributes.get('temperature') if trigger.to_state is not none else none %}
          {{ is_number(new) and 5 <= new | float <= 35
             and ((is_number(old) and (new | float - old | float) | abs >= 0.4)
                  or (not is_number(old) and (new | float not in [18,21]))) }}
    actions:
      - variables:
          received: "{{ trigger.to_state.attributes.temperature | float }}"
          auto_target: "{{ states('input_number.jns_heating_last_automatic_target') | float(-99) }}"
          auto_timestamp: "{{ as_timestamp(states('input_datetime.jns_heating_last_auto_command_time'), 0) }}"
          seconds_since_auto: "{{ as_timestamp(now()) - auto_timestamp | float(0) }}"
          alarm: "{{ states('sensor.jns_heating_verified_alarm_state') }}"
          away_min: "{{ states('input_number.jns_heating_away_minimum_temp') | float(15) }}"
      - condition: template
        value_template: >-
          {{ not (0 <= seconds_since_auto | float(9999) <= 90
                  and (received | float - auto_target | float) | abs < 0.1) }}
      - condition: template
        value_template: >-
          {{ (alarm != 'armed_away' or received | float > away_min | float)
              and not (is_state('input_boolean.general_bedtime_mode','on')
                       and received | float == 18) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.jns_heating_manual_target
        data:
          value: "{{ received | float }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jns_heating_manual_setpoint_hold

  - id: jns_heating_clear_old_manual_hold_on_away_v1
    alias: JNS Heating - Restore minimum on leaving home
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.jns_heating_verified_alarm_state
        to: armed_away
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jns_heating_manual_setpoint_hold

  - id: jns_heating_clear_manual_hold_on_bedtime_v1
    alias: JNS Heating - Explicit bedtime activation ends earlier manual hold
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.general_bedtime_mode
        from: "off"
        to: "on"
    actions:
      - action: input_boolean.turn_off
        target:
