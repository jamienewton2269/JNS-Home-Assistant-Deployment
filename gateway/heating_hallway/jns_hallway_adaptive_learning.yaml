# JNS Hallway Adaptive Warmup: observational learning only, VM905
# Uses fireplace-protected real heating cycles; never calls climate.*.
input_boolean:
  jns_hallway_warmup_tracking:
    name: Hallway thermal observation in progress
    icon: mdi:chart-line
input_number:
  jns_hallway_warmup_start_temperature:
    name: Hallway warmup start temperature
    min: 0
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
  jns_hallway_warmup_start_setpoint:
    name: Hallway warmup start requested target
    min: 5
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
  jns_hallway_warmup_minutes_per_c:
    name: Hallway measured warmup minutes per degree
    min: 5
    max: 180
    step: 0.1
    unit_of_measurement: "min/°C"
  jns_hallway_warmup_observations:
    name: Hallway accepted warmup observations
    min: 0
    max: 90
    step: 1
input_datetime:
  jns_hallway_warmup_started:
    name: Hallway current observation started
    has_date: true
    has_time: true

template:
  - sensor:
      - name: JNS Hallway Adaptive Warmup Minutes
        unique_id: jns_hallway_adaptive_warmup_minutes_v1
        icon: mdi:fire-clock
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {% set hall = states('sensor.jns_hallway_house_temperature') | float(none) %}
          {% set target = state_attr('climate.thermostat_thermostat','temperature') | float(21) %}
          {% set n = states('input_number.jns_hallway_warmup_observations') | int(0) %}
          {% set rate = states('input_number.jns_hallway_warmup_minutes_per_c') | float(0) %}
          {% set weather_ok = is_state('sensor.jns_hallway_weather_input_status','Ready') %}
          {% set outside = states('sensor.thermostat_thermostat_outdoor_temperature') | float(none) %}
          {% set future = state_attr('sensor.jns_hallway_hourly_open_meteo','forecast_near_future_c') | float(none) %}
          {% if hall is not none and hall >= target - 0.2 %}
            0
          {% elif hall is not none and weather_ok and outside is not none and future is not none and
                  n >= 3 and 5 <= rate <= 180 and hall < target %}
            {% set base = (target - hall) * rate %}
            {% set cooling_penalty = [0, [(outside - future) * 4, 30] | min] | max %}
            {{ [360, [5, (base + cooling_penalty) | round(0)] | max] | min }}
          {% else %}
            120
          {% endif %}
        attributes:
          source_epoch: hallway-precision-v1
          model_source: accepted-heating-cycles
          target_time: "10:00"
          accepted_observations: "{{ states('input_number.jns_hallway_warmup_observations') | int(0) }}"
          ready: >-
            {{ states('input_number.jns_hallway_warmup_observations') | int(0) >= 3
               and is_state('sensor.jns_hallway_weather_input_status','Ready')
               and is_number(states('sensor.jns_hallway_house_temperature')) }}
          model_status: >-
            {% if states('input_number.jns_hallway_warmup_observations') | int(0) < 3 %}
              Learning {{ states('input_number.jns_hallway_warmup_observations') | int(0) }}/3 verified cycles
            {% elif not is_state('sensor.jns_hallway_weather_input_status','Ready') %}
              Forecast unavailable; conservative fallback
            {% else %}
              Observed hallway warmup and hourly Open-Meteo
            {% endif %}
      - name: JNS Hallway Predicted 60m While Heating
        unique_id: jns_hallway_predicted_60m_while_heating_v1
        icon: mdi:thermometer-lines
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        availability: >-
          {{ state_attr('sensor.jns_hallway_adaptive_warmup_minutes','ready') == true
             and is_state('binary_sensor.lyric_home_heating_heating_call','on')
             and is_number(states('sensor.jns_hallway_house_temperature')) }}
        state: >-
          {% set current = states('sensor.jns_hallway_house_temperature') | float %}
          {% set rate = states('input_number.jns_hallway_warmup_minutes_per_c') | float(0) %}
          {% set current_outside = states('sensor.thermostat_thermostat_outdoor_temperature') | float(0) %}
          {% set future_outside = state_attr('sensor.jns_hallway_hourly_open_meteo','forecast_near_future_c') | float(current_outside) %}
          {{ [40, current + (60 / rate if rate > 0 else 0) + (future_outside - current_outside) * 0.05] | min | round(1) }}
        attributes:
          source_epoch: hallway-precision-v1
          validated: >-
            {{ state_attr('sensor.jns_hallway_adaptive_warmup_minutes','ready') == true
               and is_state('binary_sensor.lyric_home_heating_heating_call','on') }}
          forecast_scope: heating-only
          fireplace_control_permitted: "false"

automation:
  - id: jns_hallway_observe_warmup_start_v1
    alias: JNS Hallway - Begin measured warmup after actual heating call
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.lyric_home_heating_heating_call
        to: "on"
      - trigger: state
        entity_id: climate.thermostat_thermostat
        attribute: temperature
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: binary_sensor.lyric_home_heating_heating_call
        state: "on"
      - condition: state
        entity_id: input_boolean.jns_hallway_warmup_tracking
        state: "off"
      - condition: state
        entity_id: binary_sensor.jns_fireplace_heat_detected
        state: "off"
      - condition: template
        value_template: >-
          {{ states('sensor.jns_heating_verified_alarm_state') in ['disarmed','armed_home']
             and is_number(states('sensor.jns_hallway_house_temperature'))
             and is_number(state_attr('climate.thermostat_thermostat','temperature'))
             and 15 <= states('sensor.jns_hallway_house_temperature') | float <= 27
             and state_attr('climate.thermostat_thermostat','temperature') | float -
                 states('sensor.jns_hallway_house_temperature') | float >= 0.5 }}
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.jns_hallway_warmup_start_temperature}
        data:
          value: "{{ states('sensor.jns_hallway_house_temperature') | float }}"
      - action: input_number.set_value
        target: {entity_id: input_number.jns_hallway_warmup_start_setpoint}
        data:
          value: "{{ state_attr('climate.thermostat_thermostat','temperature') | float }}"
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.jns_hallway_warmup_started}
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.jns_hallway_warmup_tracking}

  - id: jns_hallway_observe_warmup_end_v1
    alias: JNS Hallway - Learn successful real warmup without fire or shower
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: sensor.jns_hallway_house_temperature
      - trigger: state
        entity_id: binary_sensor.lyric_home_heating_heating_call
        to: "off"
      - trigger: state
        entity_id: climate.thermostat_thermostat
        attribute: temperature
    conditions:
      - condition: state
        entity_id: input_boolean.jns_hallway_warmup_tracking
        state: "on"
    actions:
      - variables:
          current: "{{ states('sensor.jns_hallway_house_temperature') | float(-99) }}"
          start: "{{ states('input_number.jns_hallway_warmup_start_temperature') | float(-99) }}"
          target: "{{ states('input_number.jns_hallway_warmup_start_setpoint') | float(-99) }}"
          now_target: "{{ state_attr('climate.thermostat_thermostat','temperature') | float(-99) }}"
          elapsed: "{{ (as_timestamp(now()) - as_timestamp(states('input_datetime.jns_hallway_warmup_started'), as_timestamp(now()))) / 60 }}"
          alarm: "{{ states('sensor.jns_heating_verified_alarm_state') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ current | float(-99) < 0 or start | float(-99) < 0 or
                     elapsed | float(0) > 360 or
                     now_target | float(-99) != target | float(-99) or
                     alarm not in ['disarmed','armed_home'] or
                     not is_state('binary_sensor.jns_fireplace_heat_detected','off') }}
            sequence:
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.jns_hallway_warmup_tracking}
          - conditions:
              - condition: template
                value_template: >-
                  {{ current | float(-99) >= target | float(99) - 0.2 or
                     is_state('binary_sensor.lyric_home_heating_heating_call','off') }}
            sequence:
              - variables:
                  gain: "{{ current | float(-99) - start | float(-99) }}"
                  minutes_per_degree: "{{ elapsed | float(0) / (current | float(-99) - start | float(-99)) if (current | float(-99) - start | float(-99)) >= 0.3 else 0 }}"
                  old_count: "{{ states('input_number.jns_hallway_warmup_observations') | int(0) }}"
                  old_rate: "{{ states('input_number.jns_hallway_warmup_minutes_per_c') | float(0) }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ 10 <= elapsed | float(0) <= 360 and
                             0.3 <= gain | float(0) <= 8 and
                             5 <= minutes_per_degree | float(0) <= 180 and
                             current | float(-99) >= target | float(99) - 0.2 }}
                    sequence:
                      - action: input_number.set_value
                        target: {entity_id: input_number.jns_hallway_warmup_minutes_per_c}
                        data:
                          value: >-
                            {% if old_count | int(0) == 0 %}
                              {{ minutes_per_degree | float | round(1) }}
                            {% else %}
                              {{ (old_rate | float + (minutes_per_degree | float - old_rate | float) /
                                 ([old_count | int(0),6] | min + 1)) | round(1) }}
                            {% endif %}
                      - action: input_number.set_value
                        target: {entity_id: input_number.jns_hallway_warmup_observations}
                        data:
                          value: "{{ [old_count | int(0) + 1,90] | min }}"
              - action: input_boolean.turn_off
                target: {entity_id: input_boolean.jns_hallway_warmup_tracking}
