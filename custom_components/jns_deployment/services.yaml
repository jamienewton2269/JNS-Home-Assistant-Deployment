status:
  name: JNS production status
  description: Return version, trust-store state, audit integrity, paths and recovery status.

list_trusted_publishers:
  name: List trusted JNS publishers
  description: Return enabled publisher ids, key fingerprints and allowed scopes.

verify_audit_log:
  name: Verify JNS audit log
  description: Verify the complete hash-chained audit log.

list_inbox_packages:
  name: List signed JNS inbox packages
  description: Return ZIP packages in /config/jns/sftp/incoming and their signature/validation state.

plan_package:
  name: Plan signed JNS deployment
  description: Verify the package and report create/replace/unchanged targets.
  fields:
    package:
      name: Package
      required: true
      selector:
        text:

validate_package:
  name: Validate signed JNS deployment package
  description: Verify publisher signature, package policy and all file hashes without changing Home Assistant.
  fields:
    package:
      name: Package
      required: true
      selector:
        text:

install_package:
  name: Install signed JNS deployment package
  description: Transactionally install a trusted signed package. Home Assistant configuration validation runs by default and triggers automatic rollback on failure.
  fields:
    package:
      name: Package
      required: true
      selector:
        text:
    dry_run:
      name: Dry run
      default: false
      selector:
        boolean:
    check_config:
      name: Check Home Assistant configuration
      default: true
      selector:
        boolean:

quarantine_package:
  name: Quarantine JNS package
  description: Move a suspicious ZIP out of the deployment inbox and record its hash/reason.
  fields:
    package:
      name: Package
      required: true
      selector:
        text:
    reason:
      name: Reason
      required: true
      selector:
        text:

rollback_transaction:
  name: Roll back JNS transaction
  description: Restore the pre-deployment state of a committed transaction.
  fields:
    transaction_id:
      name: Transaction ID
      required: true
      selector:
        text:
    force:
      name: Force rollback
      description: Bypass post-deployment drift protection only after reviewing changed files.
      default: false
      selector:
        boolean:
    check_config:
      name: Check Home Assistant configuration
      default: true
      selector:
        boolean:

recover_interrupted_transaction:
  name: Recover interrupted JNS transaction
  description: Restore the recorded pre-transaction state after an interrupted deployment.
  fields:
    transaction_id:
      name: Transaction ID
      required: true
      selector:
        text:

list_transactions:
  name: List JNS transactions
  description: Return recent signed deployment/platform transaction summaries.
  fields:
    limit:
      name: Limit
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box

get_transaction:
  name: Get JNS transaction
  description: Return the complete transaction record.
  fields:
    transaction_id:
      name: Transaction ID
      required: true
      selector:
        text:

list_installed_packages:
  name: List installed JNS packages
  description: Return the latest active committed signed package per package id.

validate_platform_update:
  name: Validate signed JNS platform update
  description: Verify a publisher-signed JNS platform update in /config/jns/platform_updates.
  fields:
    package:
      name: Package
      required: true
      selector:
        text:
    dry_run:
      name: Dry run
      default: true
      selector:
        boolean:

install_platform_update:
  name: Install signed JNS platform update
  description: Replace the complete JNS integration tree with a publisher trusted for platform scope. Restart is required.
  fields:
    package:
      name: Package
      required: true
      selector:
        text:
    dry_run:
      name: Dry run
      default: false
      selector:
        boolean:

rollback_platform_update:
  name: Roll back JNS platform update
  description: Restore the complete prior integration tree. Restart is required.
  fields:
    transaction_id:
      name: Transaction ID
      required: true
      selector:
        text:

uninstall_package:
  name: Uninstall managed package
  description: Transactionally uninstall a JNS-managed package with drift protection.
  fields:
    package_id:
      required: true
      selector:
        text:
    force:
      required: false
      default: false
      selector:
        boolean:
    check_config:
      required: false
      default: true
      selector:
        boolean:


sftp_status:
  name: JNS Secure SFTP status
  description: Return companion SFTP app status without exposing credentials.

repair_sftp:
  name: Repair JNS Secure SFTP
  description: Reinstall/reconfigure/start the JNS SFTP app using the stored transport password.

update_sftp:
  name: Update JNS Secure SFTP
  description: Explicitly update the JNS SFTP app and re-apply the safe transport configuration.

begin_management_pc_enrollment:
  name: Begin management-PC enrollment
  description: Create a single-use, short-lived enrollment code. Administrator only.

list_management_pcs:
  name: List JNS management PCs
  description: Return enrolled management-PC identities, commissioning state and legacy credential status.

commission_management_pc:
  name: Mark management PC commissioned
  description: Mark the calling enrolled PC commissioned after it has successfully completed the deployment/rollback test.

revoke_management_pc:
  name: Revoke management PC
  description: Revoke one enrolled PC's HA identity, SFTP key and config signing publisher. Administrator only.
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        text:

revoke_legacy_pc_credentials:
  name: Revoke legacy management-PC credentials
  description: Remove pre-v5.5 SFTP authorized keys and the legacy jns-config-production publisher only after a new enrolled PC is commissioned. Administrator only.
