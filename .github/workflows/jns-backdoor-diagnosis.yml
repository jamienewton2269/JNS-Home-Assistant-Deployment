name: JNS Back Door Lighting Read-only Diagnosis
on:
  push:
    branches: [main]
    paths: ['gateway/garden_features/door-diagnose.request']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/garden_features/door_diagnose.py
