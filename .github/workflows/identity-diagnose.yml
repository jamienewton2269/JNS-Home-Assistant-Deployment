name: Identity web diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identity-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Read redacted errors and upstream form handling
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 251 -- python3 -c '"'"'import pathlib,json,subprocess
          p=pathlib.Path("/var/lib/ldap-account-manager/config/lam.conf");d=json.loads(p.read_text())
          print("LAM TYPES",json.dumps(d["typeSettings"]));print("LAM ACTIVE",d["activeTypes"])
          print("SMARTY LOCATIONS",subprocess.check_output(["dpkg","-L","smarty4"]).decode())
          for line in pathlib.Path("/etc/self-service-password/config.inc.php").read_text().splitlines():
           if "SMARTY" in line:print("SSP SMARTY",line)
          '"'"''
