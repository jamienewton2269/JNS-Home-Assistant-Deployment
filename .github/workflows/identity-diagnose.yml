name: Identity web diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identity-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Read redacted errors and upstream form handling
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 251 -- python3 -c '"'"'import pathlib,json,subprocess
          D=json.loads(pathlib.Path("/root/identity/bootstrap.json").read_text())
          def clean(s):
           for v in D.values():
            if isinstance(v,str) and len(v)>5:s=s.replace(v,"[REDACTED]")
           return s
          r=subprocess.run(["runuser","-u","www-data","--","php","-d","display_errors=1","-d","log_errors=0","-r",'"'"'"'"'"'"'"'"'chdir("/usr/share/self-service-password/htdocs");$_SERVER["SCRIPT_NAME"]="/password/index.php";$_SERVER["HTTP_HOST"]="auth-a.home.arpa";$_GET["action"]="change";include "index.php";'"'"'"'"'"'"'"'"'],capture_output=True,text=True);print("PHP",r.returncode,clean(r.stdout+r.stderr)[-5000:])
          print("SYSLOG",clean("\n".join(pathlib.Path("/var/log/syslog").read_text(errors="replace").splitlines()[-45:])))
          p=pathlib.Path("/var/lib/ldap-account-manager/config/lam.conf")
          for line in p.read_text().splitlines():
           if line.startswith(("Server","Admins","types:","modules:","login","treesuffix")):print("LAMSETTING",line)
          for p in pathlib.Path("/run/systemd/network").glob("*"):print("NETWORK",str(p),p.read_text()[:3000])
          for p in pathlib.Path("/var/lib/dhcp").glob("*leases*"):
           print("DUIDFILE",p.name)
           for line in p.read_text().splitlines():
            if "default-duid" in line:print(line)
          '"'"''
