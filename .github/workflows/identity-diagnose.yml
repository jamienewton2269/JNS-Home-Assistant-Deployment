name: Identity web diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identity-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Read redacted errors and upstream form handling
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 251 -- python3 -c '"'"'import urllib.request,urllib.error,ssl,pathlib,json,subprocess,re
          D=json.loads(pathlib.Path("/root/identity/bootstrap.json").read_text())
          def redact(s):
           for v in D.values():
            if isinstance(v,str) and len(v)>5:s=s.replace(v,"[REDACTED]")
           return s
          ctx=ssl.create_default_context(cafile="/etc/ldap/identity/ca.crt")
          for path in ["/password/?action=change","/admin/templates/login.php"]:
           try:r=urllib.request.urlopen("https://auth-a.home.arpa"+path,context=ctx);body=r.read().decode()
           except urllib.error.HTTPError as e:body=e.read().decode()
           print("HTTPBODY",path,redact(re.sub("<[^>]+>"," ",body))[-6000:])
          r=subprocess.run(["php","-l","/etc/self-service-password/config.inc.local.php"],capture_output=True,text=True);print(redact(r.stdout+r.stderr))
          r=subprocess.run(["journalctl","-n","30","--no-pager"],capture_output=True,text=True);print(redact(r.stdout))
          '"'"''
