name: Identity web diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identity-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Read redacted errors and upstream form handling
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 251 -- python3 -c '"'"'import pathlib,subprocess,json
          D=json.loads(pathlib.Path("/root/identity/bootstrap.json").read_text())
          def clean(s):
           for v in D.values():
            if isinstance(v,str) and len(v)>5:s=s.replace(v,"[REDACTED]")
           return s
          for p in ["/usr/share/ldap-account-manager/config","/var/lib/ldap-account-manager/config","/etc/ldap-account-manager/lam.conf","/usr/share/self-service-password/htdocs/index.php"]:
           f=pathlib.Path(p);print("PATH",p,"RESOLVES",str(f.resolve()),"DIR",f.is_dir())
           if f.is_dir():print("FILES",[p.name for p in f.iterdir()])
           if p.endswith("index.php"):print(f.read_text()[:14000])
          r=subprocess.run(["runuser","-u","www-data","--","php","-d","display_errors=1","-d","log_errors=0","-r",'"'"'"'"'"'"'"'"'$_SERVER["SCRIPT_NAME"]="/password/index.php"; $_SERVER["HTTP_HOST"]="auth-a.home.arpa"; $_GET["action"]="change"; include "/usr/share/self-service-password/htdocs/index.php";'"'"'"'"'"'"'"'"'],capture_output=True,text=True);print("PHP_CLI",r.returncode,clean(r.stdout+r.stderr)[-6000:])
          print("LOGFILES",subprocess.check_output(["find","/var/log","-maxdepth","2","-type","f"]).decode())
          '"'"''
