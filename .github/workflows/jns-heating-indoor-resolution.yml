name: JNS Heating Indoor Sensor Resolution Read-only
on:
  push:
    branches:
      - 'dev/heating-thermal-learning-v035-20261024'
    paths:
      - 'gateway/heating/v0.3.5/indoor-resolution.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Identify temperature sensor resolution without modifying Home Assistant
        run: python3 gateway/heating/v0.3.5/indoor_sensor_resolution.py
