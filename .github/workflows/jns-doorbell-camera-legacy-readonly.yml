name: JNS Doorbell Legacy Camera Read-only Discovery
on:
  push:
    branches: [main]
    paths:
      - 'gateway/doorbell/doorbell-camera-legacy.request'
permissions:
  contents: read
jobs:
  discover:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only discovery code
        run: python3 -m py_compile gateway/doorbell/doorbell-camera-legacy-discovery-v1.py
      - name: Read legacy and security camera registries without mutation
        run: python3 gateway/doorbell/doorbell-camera-legacy-discovery-v1.py
