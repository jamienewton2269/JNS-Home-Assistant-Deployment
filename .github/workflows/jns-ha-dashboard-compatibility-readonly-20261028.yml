name: JNS HA Dashboard Private Compatibility Readonly 2026-10-28
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-dashboard-compatibility-readonly-20261028.yml'
      - 'gateway/solar/ha_dashboard_compatibility_readonly_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-dashboard-private-compatibility
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check private dashboard audit
        run: python3 -m py_compile gateway/solar/ha_dashboard_compatibility_readonly_20261028.py
      - name: Count missing VM905 entity registry references without disclosing IDs
        run: python3 gateway/solar/ha_dashboard_compatibility_readonly_20261028.py
