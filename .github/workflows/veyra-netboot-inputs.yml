name: Inspect Veyra Netboot Inputs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-netboot-inputs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Inspect current preseed and local installer files
        shell: bash
        run: |
          set -u
          echo "=== PRESEED ==="
          sed -n '1,220p' /srv/veyra-pxe/http/veyra/v0.9.2/preseed.cfg 2>/dev/null || true
          echo "=== INSTALLER FILES ==="
          ls -lh /srv/veyra-pxe/http/veyra/v0.9.2/vmlinuz /srv/veyra-pxe/http/veyra/v0.9.2/initrd.gz 2>/dev/null || true
          file /srv/veyra-pxe/http/veyra/v0.9.2/vmlinuz /srv/veyra-pxe/http/veyra/v0.9.2/initrd.gz 2>/dev/null || true
          echo "=== LOCAL NETBOOT FILES ==="
          find /srv /var/lib/tftpboot /usr/lib -type f -name 'netboot.tar.gz' 2>/dev/null | head -50 || true
          echo VEYRA_NETBOOT_INPUTS_COMPLETE
