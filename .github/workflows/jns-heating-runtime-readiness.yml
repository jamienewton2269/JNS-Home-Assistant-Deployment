name: JNS Heating Release Runtime Readiness
on:
  push:
    branches:
      - 'dev/heating-thermal-learning-v035-20261024'
    paths:
      - 'gateway/heating/v0.3.5/runtime_readiness.request'
permissions:
  contents: read
jobs:
  read-only:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read-only VM905 runtime and heating response
        run: python3 gateway/heating/v0.3.5/runtime_readiness.py
