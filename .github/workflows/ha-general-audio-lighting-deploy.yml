name: Deploy HA-General Audio Clock and Lux Status

on:
  push:
    branches: [main]
    paths:
      - 'ha_testing_dashboard/audio-lighting-deploy.request'

permissions:
  contents: read

concurrency:
  group: jns-ha-general-audio-lighting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply live HA-General dashboard and clock update
        shell: bash
        run: python3 ha_testing_dashboard/apply-audio-lighting-live.py
