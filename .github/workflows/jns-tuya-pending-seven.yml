name: JNS Tuya Seven Device Discovery
on:
  push:
    branches: [main]
    paths: ['gateway/tuya_freedom/pending_seven_lan_scan.py', '.github/workflows/jns-tuya-pending-seven.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Read only Tuya Local discovery
        run: |
          set -euo pipefail
          python3 gateway/tuya_freedom/pending_seven_lan_scan.py
