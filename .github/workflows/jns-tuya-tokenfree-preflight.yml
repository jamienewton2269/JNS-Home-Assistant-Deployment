name: JNS Tuya Freedom Tokenless Preflight
on:
  push:
    branches: [main]
    paths:
      - 'gateway/tuya_freedom/tokenfree_probe.py'
      - '.github/workflows/jns-tuya-tokenfree-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-tuya-tokenfree-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Read-only HA-General native execution capability
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/tuya_freedom/tokenfree_probe.py
          python3 gateway/tuya_freedom/tokenfree_probe.py
