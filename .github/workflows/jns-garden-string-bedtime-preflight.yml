name: JNS Garden String Bedtime Preflight
on:
  push:
    branches: [main]
    paths: ['gateway/bedtime/preflight.request']
permissions:
  contents: read
concurrency:
  group: jns-ha905-bedtime-string-change
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/bedtime/preflight.py
