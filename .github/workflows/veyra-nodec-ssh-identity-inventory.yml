name: VEYRA Node C secure SSH identity inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-nodec-ssh-identity-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - name: Read only SSH identity inspection
        shell: bash
        run: |
          set -Eeo pipefail
          echo "VEYRA_NODEC_IDENTITY_INVENTORY"
          echo "Read-only: no known_hosts updates, no new keys, no SSH connection and no sudo."
          for host in veyra.home.arpa veyra; do
            echo "=== DNS label $host ==="
            address=$(getent ahostsv4 "$host" 2>/dev/null | awk '$2=="STREAM"{print $1;exit}')
            if [[ -z "$address" ]]; then echo "DNS_MISSING"; continue; fi
            echo "DNS_RESOLVED"
            for label in "$host" "$address"; do
              if ssh-keygen -F "$label" >/dev/null 2>&1; then
                echo "PINNED_KNOWN_HOST_PRESENT: $label"
              else
                echo "NO_KNOWN_HOST_PIN: $label"
              fi
            done
            candidate=$(mktemp)
            if timeout -k 2s 12s ssh-keyscan -T 5 -t ed25519 "$host" 2>/dev/null |
                 awk '$2=="ssh-ed25519" {print;exit}' > "$candidate"; then
              if [[ -s "$candidate" ]]; then
                echo "UNTRUSTED_NETWORK_KEY_FINGERPRINT_DO_NOT_ENROLL_BLINDLY:"
                ssh-keygen -lf "$candidate" || true
              else
                echo "NO_SSH_HOST_KEY_RETURNED"
              fi
            fi
            rm -f "$candidate"
          done
          echo "=== NODE C RUNNER PUBLIC LOGIN KEYS (PUBLIC KEYS ONLY) ==="
          find "$HOME/.ssh" -maxdepth 1 -type f -name '*.pub' -print 2>/dev/null |
          while read -r keyfile; do
            ssh-keygen -lf "$keyfile" || true
            cat "$keyfile"
          done
          if [[ -n "$SSH_AUTH_SOCK" ]] && command -v ssh-add >/dev/null; then
            echo "=== AGENT PUBLIC KEY FINGERPRINTS ==="
            ssh-add -l || true
          fi
          echo "VEYRA_IDENTITY_READONLY_COMPLETE"
