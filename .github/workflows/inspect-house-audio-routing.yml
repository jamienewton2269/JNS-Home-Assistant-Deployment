name: Inspect House Audio B routing
on:
  push:
    branches: [main]
    paths: ['house_audio_b/audio-routing-inspect.request']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Inspect Bluetooth MPD streaming and chime resources
        shell: bash
        run: |
          ssh -o BatchMode=yes root@nodeb.home.arpa 'bash -s' <<'REMOTE'
          set -u
          echo "=== HOST BLUETOOTH ==="
          systemctl is-active bluetooth bluealsa bluealsa-aplay 2>&1 || true
          bluetoothctl info 91:56:5F:5E:55:47 || true
          systemctl cat bluealsa.service 2>&1 || true
          echo "=== HOST AUDIO ==="
          command -v ogg123 || true
          command -v ffmpeg || true
          command -v aplay || true
          aplay -L 2>/dev/null | grep -i -A3 bluealsa || true
          echo "=== HOST NETWORK ==="
          getent hosts house-audio-b.home.arpa || true
          echo "=== CT221 ==="
          pct status 221
          pct exec 221 -- sh -c 'systemctl is-active mpd; mpc -h 127.0.0.1 -p 6600 outputs; find /var/lib/mpd/music -maxdepth 3 -type f | head -30; grep -A13 -B2 audio_output /etc/mpd.conf' || true
          echo "=== HA GENERAL ==="
          qm status 905 || true
          REMOTE
