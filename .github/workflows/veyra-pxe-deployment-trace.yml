name: Veyra PXE Deployment Trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-pxe-deployment-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Inspect Veyra ISO layouts
        shell: bash
        run: |
          set -u
          for ISO in /root/veyra-v0.9/Veyra-AutoInstall-v0.9.1.iso /root/veyra-v0.9/Veyra-AutoInstall-v0.9.2.iso; do
            echo "=== ISO $ISO ==="
            xorriso -indev "$ISO" -ls / 2>/dev/null || true
            echo "--- files depth 3 ---"
            xorriso -indev "$ISO" -find / -maxdepth 3 -type f -print 2>/dev/null | head -800 || true
            echo "--- view.py locations ---"
            xorriso -indev "$ISO" -find / -name view.py -print 2>/dev/null || true
            echo "--- installer locations ---"
            xorriso -indev "$ISO" -find / -name install_orchestrator.py -print 2>/dev/null || true
            echo "--- preseed locations ---"
            xorriso -indev "$ISO" -find / -name preseed.cfg -print 2>/dev/null || true
          done
          echo "VEYRA_ISO_LAYOUT_AUDIT_COMPLETE"
