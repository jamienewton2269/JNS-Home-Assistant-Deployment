name: JNS Predictive Heating and Bedtime Learning Dryrun
on:
  push:
    branches: [main]
    paths: ['gateway/heating_presence/plan.request']
permissions:
  contents: read
jobs:
  plan:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate predictive schedule and dashboard without applying
        run: |
          set -euo pipefail
          python3 -m py_compile gateway/heating_presence/patch_vm905.py gateway/heating_presence/plan.py
          python3 gateway/heating_presence/plan.py
