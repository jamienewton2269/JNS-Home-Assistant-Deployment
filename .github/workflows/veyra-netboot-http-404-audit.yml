name: Diagnose Veyra Netboot HTTP 404
on:
  push:
    branches: [main]
    paths: ['.github/workflows/veyra-netboot-http-404-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          D=/srv/veyra-pxe/http/veyra/v0.9.2-netboot
          echo '=== PUBLISHED DIR ==='
          stat -c '%A %U:%G %n' /srv/veyra-pxe/http /srv/veyra-pxe/http/veyra "$D" 2>&1 || true
          ls -la "$D" 2>&1 || true
          echo '=== HTTP RESULTS ==='
          for file in vmlinuz initrd.gz preseed.cfg boot.ipxe; do
            printf '%s: ' "$file"
            curl -sS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:8098/veyra/v0.9.2-netboot/$file"
          done
          echo '=== SERVER ROOT ==='
          systemctl show -p ExecStart -p User -p Group veyra-pxe-http.service
          echo '=== PXE BASELINE ==='
          sha256sum /srv/veyra-pxe/http/autoexec.ipxe /srv/veyra-pxe/http/veyra/v0.9.2/{vmlinuz,initrd.gz}
