name: JNS VM905 Manual Setpoint Read-only Audit
on:
  push:
    branches: [main]
    paths:
      - 'gateway/heating_manual_boost/preflight.request'
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile gateway/heating_manual_boost/inspect_vm905.py
          python3 gateway/heating_manual_boost/inspect_vm905.py
