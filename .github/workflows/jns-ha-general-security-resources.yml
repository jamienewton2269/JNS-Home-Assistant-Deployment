name: JNS HA General Versus Security Resource Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-general-security-resources.yml'
      - 'gateway/solar/ha_vm905_vs_vm906_readonly_20261026.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read Node B HA-General and Node A HA-Security RAM and Core state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_vm905_vs_vm906_readonly_20261026.py
          python3 gateway/solar/ha_vm905_vs_vm906_readonly_20261026.py
