name: JNS Lux Manual Override Audit
on:
  push:
    branches: [main]
    paths: ['gateway/lux_manual_override/audit.request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/lux_manual_override/audit.py
