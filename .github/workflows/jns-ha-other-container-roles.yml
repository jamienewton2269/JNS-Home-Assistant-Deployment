name: JNS HA Other Container Roles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-other-container-roles.yml'
      - 'gateway/solar/ha_extra_container_role_check_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read-only classify additional add-ons without leaking names
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_extra_container_role_check_v1.py
          python3 gateway/solar/ha_extra_container_role_check_v1.py
