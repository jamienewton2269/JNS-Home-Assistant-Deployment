name: Verify Veyra N Menu Handoff Fix
on:
  push:
    branches: [main]
    paths:
      - 'gateway/trusted/veyra-repair-netboot-menu-v092.sh'
      - '.github/workflows/veyra-netboot-menu-repair-check.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -Eeuo pipefail
          S=gateway/trusted/veyra-repair-netboot-menu-v092.sh
          bash -n "$S"
          grep -Fq 'assert fixed.split' "$S"
          grep -Fq 'boot || goto bootfail' "$S"
          grep -Fq 'ROLLBACK=$B' "$S"
          test -s /srv/veyra-pxe/http/veyra/v0.9.2-netboot/vmlinuz
          test -s /srv/veyra-pxe/http/veyra/v0.9.2-netboot/initrd.gz
          sha256sum /srv/veyra-pxe/http/autoexec.ipxe /srv/veyra-pxe/http/veyra/v0.9.2/{vmlinuz,initrd.gz}
          echo VEYRA_N_MENU_HANDOFF_REPAIR_STATIC_PASS
