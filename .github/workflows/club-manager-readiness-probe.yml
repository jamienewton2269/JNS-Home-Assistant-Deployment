name: Club Manager - infrastructure and release readiness probe
on:
  push:
    paths:
      - .github/workflows/club-manager-readiness-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: [self-hosted, nodec]
    timeout-minutes: 5
    steps:
      - name: Read-only deployment readiness
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test "$(hostname -s)" = nodec
          echo '=== Cloudflare deployment secret presence (no values) ==='
          for name in CF_PAGES_TOKEN CF_ACCOUNT CF_PAGES_PROJECT; do
            if [[ -n "${!name:-}" ]]; then echo "$name: configured"; else echo "$name: unavailable"; fi
          done
          echo '=== Trusted Node A gateway ==='
          if ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes root@nodea.home.arpa 'test "$(hostname -s)" = nodea' </dev/null; then
            echo 'PASS: Node A SSH trust and authentication'
            echo '=== CT101 development application ==='
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes root@nodea.home.arpa 'set -eu; test "$(pct config 101 | sed -n "s/^hostname: //p")" = club-manager-dev; pct status 101; pct exec 101 -- systemctl is-active jns-club-manager-dev; pct exec 101 -- curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8765/healthz'
          else
            echo 'BLOCKED: trusted Node A SSH connection unavailable; no trust configuration changed'
          fi
          echo
          echo 'No Cloudflare upload, DNS changes, DB writes, secret disclosure or production changes performed.'
