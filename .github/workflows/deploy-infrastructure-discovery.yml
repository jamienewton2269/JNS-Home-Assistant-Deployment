name: Deploy Infrastructure Discovery Service

on:
  push:
    branches: [main]
    paths:
      - 'ha_infrastructure_launchpad/discovery_server.py'
      - 'ha_infrastructure_launchpad/deploy-discovery-nodeb.sh'
      - 'ha_infrastructure_launchpad/discovery.request'

permissions:
  contents: read

concurrency:
  group: jns-infrastructure-discovery-nodeb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy discovery service to Node B
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ha_infrastructure_launchpad/deploy-discovery-nodeb.sh
          bash ha_infrastructure_launchpad/deploy-discovery-nodeb.sh
