name: JNS HA Security Matter and ESPHome Dependency Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-vm906-matter-dependency-20261026.yml'
      - 'gateway/solar/vm906_matter_resource_dependency_audit_20261026.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HA-Security add-on memory and Matter config entry counts without modification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/vm906_matter_resource_dependency_audit_20261026.py
          python3 gateway/solar/vm906_matter_resource_dependency_audit_20261026.py
