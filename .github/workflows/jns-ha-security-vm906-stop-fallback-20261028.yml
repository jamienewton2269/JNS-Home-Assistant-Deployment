name: JNS HA-Security VM906 Controlled Force Stop After Timeout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-security-vm906-stop-fallback-20261028.yml'
      - 'gateway/solar/ha_security_vm906_stop_fallback_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-security-single-owner-cutover
  cancel-in-progress: false
jobs:
  stop:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/solar/ha_security_vm906_stop_fallback_20261028.py
      - run: python3 gateway/solar/ha_security_vm906_stop_fallback_20261028.py
