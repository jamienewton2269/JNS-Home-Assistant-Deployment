name: CT272 activate playground writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-playground-activate-writes.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-playground-activate-writes-latest.txt
          set +e
          bash -euo pipefail -c '
            remote() { ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb "$@"; }
            remote '"'"'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground'"'"'
            remote '"'"'pct exec 272 -- sh -ec "umask 077; mkdir -p /root/bsc-write-backup; runuser -u postgres -- pg_dump -Fc club_manager > /root/bsc-write-backup/current.dump.tmp; pg_restore -l /root/bsc-write-backup/current.dump.tmp >/dev/null; mv /root/bsc-write-backup/current.dump.tmp /root/bsc-write-backup/current.dump; cp -p /opt/beta/server.py /root/bsc-write-backup/server.pre-write.py"'"'"'
            echo backup_verified=archive_readable
            remote '"'"'pct exec 272 -- python3 -'"'"' < club-manager/recovery/patch-playground-write.py
            if ! remote '"'"'pct exec 272 -- systemctl restart club-playground.service && pct exec 272 -- systemctl is-active club-playground.service'"'"'; then
              remote '"'"'pct exec 272 -- cp -p /root/bsc-write-backup/server.pre-write.py /opt/beta/server.py && pct exec 272 -- systemctl restart club-playground.service'"'"'
              exit 1
            fi
            if ! remote '"'"'pct exec 272 -- python3 -c "import urllib.request,time; time.sleep(2); print(urllib.request.urlopen(\"http://127.0.0.1:8766/healthz\",timeout=5).status)"'"'"'; then
              remote '"'"'pct exec 272 -- cp -p /root/bsc-write-backup/server.pre-write.py /opt/beta/server.py && pct exec 272 -- systemctl restart club-playground.service'"'"'
              exit 1
            fi
            echo server_patch=active
          ' > "$report" 2>&1
          rc=$?
          set -e
          echo "deployment_exit=$rc" >> "$report"
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record playground write endpoint activation"
          git push origin HEAD:main
          exit "$rc"
