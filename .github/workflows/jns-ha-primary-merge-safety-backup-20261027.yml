name: JNS HA-Primary Guarded Pre-Merge Safety Backup 2026-10-27
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-primary-merge-safety-backup-20261027.yml'
      - 'gateway/solar/vm902_safety_backup_before_consolidation_20261027.py'
      - 'gateway/solar/requests/vm902-backup-20261027.request'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-primary-consolidation-safety-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded VM902 backup script
        run: python3 -m py_compile gateway/solar/vm902_safety_backup_before_consolidation_20261027.py
      - name: Run only when explicit stage request exists
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f gateway/solar/requests/vm902-backup-20261027.request ]]; then
            echo 'JNS_VM902_BACKUP_NOT_REQUESTED=yes'
            exit 0
          fi
          python3 gateway/solar/vm902_safety_backup_before_consolidation_20261027.py
