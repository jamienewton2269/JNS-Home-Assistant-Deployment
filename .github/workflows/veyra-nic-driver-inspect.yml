name: Inspect Veyra NIC Driver Contents
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-nic-driver-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Inspect installer initrd contents
        shell: bash
        run: |
          set -u
          REL=/srv/veyra-pxe/http/veyra/v0.9.2
          echo "=== TOOLS ==="
          command -v lsinitramfs || true
          command -v unmkinitramfs || true
          echo "=== CD INITRD NIC HINTS ==="
          if command -v lsinitramfs >/dev/null 2>&1; then
            lsinitramfs "$REL/initrd-cd.gz" | grep -Ei 'r8169|r8168|realtek|e1000e|igb|igc|alx|atl1|tg3|bnx|nic-modules|ethernet' | head -300 || true
          fi
          echo "=== NETBOOT INITRD NIC HINTS ==="
          if command -v lsinitramfs >/dev/null 2>&1; then
            lsinitramfs "$REL/initrd.gz" | grep -Ei 'r8169|r8168|realtek|e1000e|igb|igc|alx|atl1|tg3|bnx|nic-modules|ethernet' | head -300 || true
          fi
          echo "=== INITRD TOP LEVEL ==="
          if command -v lsinitramfs >/dev/null 2>&1; then
            echo "--- cd ---"; lsinitramfs "$REL/initrd-cd.gz" | head -120 || true
            echo "--- net ---"; lsinitramfs "$REL/initrd.gz" | head -120 || true
          fi
          echo VEYRA_NIC_DRIVER_INSPECT_COMPLETE
