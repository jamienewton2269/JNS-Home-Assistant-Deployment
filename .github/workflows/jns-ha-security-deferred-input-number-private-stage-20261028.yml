name: JNS HA Security Deferred Helper Inert Private Stage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-security-deferred-input-number-private-stage-20261028.yml'
      - 'gateway/solar/ha_security_deferred_input_number_private_stage_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-security-deferred-helper-inert-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate private helper staging code
        run: python3 -m py_compile gateway/solar/ha_security_deferred_input_number_private_stage_20261028.py
      - name: Stage collision-free source helper without loading into VM905
        run: python3 gateway/solar/ha_security_deferred_input_number_private_stage_20261028.py
