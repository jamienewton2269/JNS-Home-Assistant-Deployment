name: JNS graph card live inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jns-statistics-graph-inventory.yml']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inventory dashboard graph types without configuration changes
        run: |
          python3 - <<'PY'
          import sys,base64,json,time
          sys.path.insert(0,"gateway/arrival_lighting")
          from readiness_probe import ssh_host
          source="import pathlib,json;R=pathlib.Path('/config');print(json.dumps({'config_exists':R.is_dir(),'hacs_present':(R/'custom_components/hacs').is_dir()}))"
          for vm,node in [(905,"nodeb")]:
           try:
            status=ssh_host(node,["qm","status",str(vm)])
            if "running" not in status:
             print("GRAPH_INVENTORY",vm,"not_running",flush=True);continue
            cmd="exec(__import__('base64').b64decode('"+base64.b64encode(source.encode()).decode()+"'))"
            r=json.loads(ssh_host(node,["qm","guest","exec",str(vm),"--","docker","exec","homeassistant","python3","-c",cmd]))
            print("GUEST_RESPONSE_SHAPE",list(r),flush=True)
            for _ in range(40):
             if r.get("exited") or "exitcode" in r:break
             if "pid" not in r:
              print("GUEST_ROUTE_ERROR",r,flush=True);break
             time.sleep(1);r=json.loads(ssh_host(node,["qm","guest","exec-status",str(vm),str(r["pid"])]))
            print("GRAPH_INVENTORY",vm,r.get("exitcode"),r.get("out-data",""),flush=True)
           except Exception as e:print("GRAPH_INVENTORY",vm,"blocked",str(e),flush=True)
          
          PY
