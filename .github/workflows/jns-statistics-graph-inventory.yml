name: JNS graph card live inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jns-statistics-graph-inventory.yml']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inventory dashboard graph types without configuration changes
        run: |
          python3 - <<'PY'
          import sys,base64,json,time
          sys.path.insert(0,"gateway/arrival_lighting")
          from readiness_probe import ssh_host
          source="import json,pathlib,collections,yaml\nR=pathlib.Path(\"/config\")\ndef scan(x,counts):\n if isinstance(x,dict):\n  t=x.get(\"type\")\n  if isinstance(t,str) and (\"graph\" in t or \"chart\" in t):counts[t]+=1\n  for v in x.values():scan(v,counts)\n elif isinstance(x,list):\n  for v in x:scan(v,counts)\nfiles=[]\nfor p in list(R.rglob(\"*.yaml\"))+list((R/\".storage\").glob(\"lovelace*\")):\n if any(z.startswith(\".\") for z in p.relative_to(R).parts[:-1]) and p.parent!=R/\".storage\":continue\n if p.is_symlink():continue\n try:\n  obj=json.loads(p.read_text()) if p.parent==R/\".storage\" else yaml.safe_load(p.read_text())\n  c=collections.Counter();scan(obj,c)\n  if c:files.append({\"path\":str(p.relative_to(R)),\"cards\":dict(c)})\n except Exception:pass\nprint(json.dumps({\"graph_files\":files,\"hacs_present\":(R/\"custom_components/hacs\").exists(),\"card_js\":[str(p.relative_to(R)) for p in (R/\"www\").rglob(\"*statistics*\") if p.is_file()]}))\n"
          for vm,node in [(905,"nodeb"),(903,"nodea"),(902,"nodea")]:
           try:
            status=ssh_host(node,["qm","status",str(vm)])
            if "running" not in status:
             print("GRAPH_INVENTORY",vm,"not_running",flush=True);continue
            cmd="exec(__import__('base64').b64decode('"+base64.b64encode(source.encode()).decode()+"'))"
            r=json.loads(ssh_host(node,["qm","guest","exec",str(vm),"--","docker","exec","homeassistant","python3","-c",cmd]))
            for _ in range(40):
             if r.get("exited") or "exitcode" in r:break
             time.sleep(1);r=json.loads(ssh_host(node,["qm","guest","exec-status",str(vm),str(r["pid"])]))
            print("GRAPH_INVENTORY",vm,r.get("exitcode"),r.get("out-data",""),flush=True)
           except Exception as e:print("GRAPH_INVENTORY",vm,"blocked",str(e),flush=True)
          
          PY
