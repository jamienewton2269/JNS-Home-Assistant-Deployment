name: Restore DHCP DNS using fixed Proxmox host IPs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kea4-recover-direct-ip.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -u
          for spec in 'nodea 10.10.110.11 247' 'nodeb 10.10.110.12 248'; do
            set -- $spec
            echo "=== $1 CT$3 ==="
            ssh -o HostName="$2" -o BatchMode=yes -o ConnectTimeout=8 "$1" "pct exec $3 -- bash -s" <<'REMOTE'
          set -u
          systemctl stop kea-dhcp4-server || true
          systemctl disable kea-dhcp4-server >/dev/null 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/dnsmasq.conf')
          s=p.read_text()
          s='\n'.join(line.replace('# kea4 cutover disabled: ','',1) if line.startswith('# kea4 cutover disabled: ') else line for line in s.splitlines())+'\n'
          p.write_text(s)
          PY
          dnsmasq --test -C /etc/dnsmasq.conf
          systemctl restart jns-dns
          sleep 1
          systemctl status jns-dns --no-pager -l | head -20
          ss -lunp | grep -E ':(53|67) ' || true
          grep -E '^dhcp-range=' /etc/dnsmasq.conf || true
          REMOTE
          done
