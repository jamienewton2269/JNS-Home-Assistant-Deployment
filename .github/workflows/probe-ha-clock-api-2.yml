name: Probe HA internal Westminster API
on:
  push:
    branches: [main]
    paths: ['house_audio_b/api-probe-2.request']
permissions: {contents: read}
jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    steps:
      - run: |
          ssh root@nodeb.home.arpa 'bash -s' <<'REMOTE'
          qm guest exec 905 -- docker exec homeassistant python3 -c 'import os; print("SUPERVISOR_TOKEN_PRESENT="+str(bool(os.getenv("SUPERVISOR_TOKEN"))))'
          qm guest exec 905 -- docker exec homeassistant python3 -c 'import urllib.request; print("HA_HTTP_STATUS="+str(urllib.request.urlopen("http://127.0.0.1:8123/",timeout=10).status))'
          REMOTE
