name: JNS Heating v0.3.6 Live Source Preflight
on:
  push:
    branches:
      - 'dev/heating-thermal-learning-v035-20261024'
    paths:
      - 'gateway/heating/v0.3.5/bathroom-v036-preflight.request'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read-only exact VM905 heating baseline
        run: python3 gateway/heating/v0.3.5/bathroom_v036_current_preflight.py
      - name: Check protected JNS root gateway capabilities without writes
        run: python3 gateway/heating/v0.3.5/bathroom_deploy_readiness.py
