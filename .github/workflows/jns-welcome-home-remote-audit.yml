name: JNS Welcome Home Remote Integration Audit
on:
  push:
    branches: [main]
    paths:
      - 'gateway/arrival_lighting/remote.request'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/arrival_lighting/remote_audit.py
