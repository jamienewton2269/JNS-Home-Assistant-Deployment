name: JNS House Audio B MPD live stream diagnostic
on:
  push:
    branches: [main]
    paths: ['house_audio_b/clock_live_stream_test.request']
permissions: {contents: read}
jobs:
  test:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Play one original Westminster half chime and inspect live output
        run: |
          ssh -o BatchMode=yes root@nodeb.home.arpa 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(pct config 221 | sed -n 's/^hostname: //p')" = house-audio-b
          pct exec 221 -- systemctl is-active --quiet mpd
          echo 'JNS_TEST_BEFORE_PLAY'
          pct exec 221 -- sh -c 'ss -lntp | grep -E ":(6600|8000) " || true; mpc status'
          pct exec 221 -- mpc clear >/dev/null
          pct exec 221 -- mpc load jns_westminster_half >/dev/null
          pct exec 221 -- mpc play >/dev/null
          sleep 2
          echo 'JNS_TEST_DURING_PLAY'
          pct exec 221 -- sh -c 'mpc status; ss -lntp | grep -E ":(6600|8000) " || true'
          curl -I -s --max-time 3 "http://house-audio-b.home.arpa:8000/" | head -3 || true
          sleep 4
          echo 'JNS_TEST_RECEIVER'
          systemctl show jns-audio-receiver -p ActiveState -p SubState -p NRestarts --no-pager
          journalctl -u jns-audio-receiver --since '-2 minutes' --no-pager | grep -Ei 'ogg123|Could not|Failed|error|Prepared|Starting IO' | tail -14 || true
          echo 'JNS_TEST_AFTER_PLAY'
          pct exec 221 -- sh -c 'mpc status; ss -lntp | grep -E ":(6600|8000) " || true'
          echo JNS_CLOCK_STREAM_PLAY_TEST_COMPLETE
          REMOTE
