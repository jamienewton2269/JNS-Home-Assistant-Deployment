name: HA DNS Resolution Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ha-dns-resolution-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Inspect HA network configuration without checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o HostName=10.10.10.235 nodeb '
            set -Eeuo pipefail
            for vm in 902 905; do
              echo "=== VM$vm NETWORK ==="
              qm guest exec "$vm" -- /bin/bash -lc '"'"'
                echo "--- ha network info ---"
                ha network info || true
                echo "--- nmcli connections ---"
                nmcli -t -f NAME,UUID,TYPE,DEVICE connection show 2>/dev/null || true
                echo "--- active dns ---"
                nmcli dev show 2>/dev/null | grep -E "GENERAL.DEVICE|IP4.DNS|IP4.DOMAIN|IP6.DNS|IP6.DOMAIN" || true
              '"'"'
            done
          '
