name: HA DNS Resolution Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ha-dns-resolution-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Check HA node DNS without checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o HostName=10.10.10.235 nodeb '
            set -Eeuo pipefail
            for vm in 902 905; do
              echo "=== VM$vm ==="
              qm status "$vm"
              qm guest exec "$vm" -- /bin/bash -lc '"'"'
                echo "--- resolv.conf ---"
                cat /etc/resolv.conf 2>/dev/null || true
                echo "--- JNS-288328.home.arpa ---"
                (getent ahostsv4 JNS-288328.home.arpa 2>/dev/null || nslookup JNS-288328.home.arpa 2>/dev/null || true)
                echo "--- bare JNS-288328 ---"
                (getent ahostsv4 JNS-288328 2>/dev/null || nslookup JNS-288328 2>/dev/null || true)
              '"'"'
            done
          '
