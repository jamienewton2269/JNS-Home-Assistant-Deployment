name: HA DNS Resolution Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ha-dns-resolution-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Inspect HA network update CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o HostName=10.10.10.235 nodeb '
            qm guest exec 905 -- /bin/bash -lc "ha network update --help || ha network --help"
          '
