name: Verify Veyra Realtek Netboot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-realtek-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n gateway/trusted/veyra-pxe-v092.sh
          W="$(mktemp -d)"
          trap 'rm -rf "$W"' EXIT
          BASE='https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64'
          wget -q -O "$W/linux" "$BASE/linux"
          wget -q -O "$W/initrd.gz" "$BASE/initrd.gz"
          wget -q -O "$W/Packages.xz" 'https://deb.debian.org/debian/dists/trixie/non-free-firmware/binary-amd64/Packages.xz'
          xzcat "$W/Packages.xz" | awk 'BEGIN{RS="";ORS="\n\n"} $1=="Package:" && $2=="firmware-realtek" {print; exit}' > "$W/fw.block"
          FW_PATH="$(sed -n 's/^Filename: //p' "$W/fw.block")"
          FW_SHA="$(sed -n 's/^SHA256: //p' "$W/fw.block")"
          test -n "$FW_PATH"
          test -n "$FW_SHA"
          wget -q -O "$W/fw.deb" "https://deb.debian.org/debian/$FW_PATH"
          echo "$FW_SHA  $W/fw.deb" | sha256sum -c -
          mkdir -p "$W/fw"
          dpkg-deb -x "$W/fw.deb" "$W/fw"
          lsinitramfs "$W/initrd.gz" > "$W/initrd.list"
          grep -Fq 'drivers/net/ethernet/realtek/r8169.ko' "$W/initrd.list"
          test -n "$(find "$W/fw/usr/lib/firmware/rtl_nic" -type f -print -quit)"
          echo "rtl_nic_files=$(find "$W/fw/usr/lib/firmware/rtl_nic" -type f | wc -l)"
          echo "kernel_sha=$(sha256sum "$W/linux" | awk '{print $1}')"
          echo "generic_initrd_sha=$(sha256sum "$W/initrd.gz" | awk '{print $1}')"
          echo "firmware=$FW_PATH"
          echo VEYRA_REALTEK_NETBOOT_VALID
