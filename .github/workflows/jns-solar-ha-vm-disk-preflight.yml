name: JNS Solar HA VMs Disk Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-ha-vm-disk-preflight.yml'
      - 'gateway/solar/vm903_905_zfs_readonly_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Audit HA-General and Plant Manager VM disk dependencies and duplicate IDs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/vm903_905_zfs_readonly_v1.py
          python3 gateway/solar/vm903_905_zfs_readonly_v1.py
