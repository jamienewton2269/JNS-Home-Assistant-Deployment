name: JNS Heating v0.3.5 HAOS Recovery Route Audit
on:
  push:
    branches: ['dev/heating-thermal-learning-v035-20261024']
    paths:
      - 'gateway/heating/v0.3.5/haos-recovery.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect VM905 host-level recovery capability (read-only)
        run: python3 gateway/heating/v0.3.5/haos_recovery_audit.py
