name: JNS Heating Zones Read-only Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'gateway/heating/readonly.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect VM905 heating forecast and learning (no writes)
        run: python3 gateway/heating/readonly_audit.py
