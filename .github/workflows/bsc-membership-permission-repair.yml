name: CT272 membership permission repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-membership-permission-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-membership-permission-repair-latest.txt
          rc=0
          {
            echo "run_id=$GITHUB_RUN_ID"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb 'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground && pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' < club-manager/migrations/031_restore_membership_permission_catalog.sql || rc=$?
            echo "repair_exit=$rc"
            if [ "$rc" -eq 0 ]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' < club-manager/recovery/test-membership-review.sql || rc=$?
            fi
            echo "test_exit=$rc"
          } > "$report" 2>&1
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record permission repair and membership regression"
          git push origin HEAD:main
          exit "$rc"
