name: JNS HA905 ESPHome Handover No-Secret Runtime Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-esphome-handover-app-no-secret-smoke-20261028.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha905-security-preparation-only
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing credentials, original source ownership and installed app startup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha905_esphome_handover_app_no_secret_smoke_20261028.py
          python3 gateway/solar/ha905_esphome_handover_app_no_secret_smoke_20261028.py
