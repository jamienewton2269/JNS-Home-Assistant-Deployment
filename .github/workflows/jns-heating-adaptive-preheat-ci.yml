name: JNS Heating adaptive 10am offline tests
on:
  pull_request:
    paths:
      - 'gateway/heating_presence/**'
      - '.github/workflows/jns-heating-adaptive-preheat-ci.yml'
  workflow_dispatch:
jobs:
  no-live-side-effects:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local parsing requirements
        run: python -m pip install PyYAML==6.0.3 Jinja2==3.1.6
      - name: Validate proposed schedule structure and Jinja syntax
        run: python -m unittest discover -s gateway/heating_presence -p 'test_adaptive_warmup.py' -v
