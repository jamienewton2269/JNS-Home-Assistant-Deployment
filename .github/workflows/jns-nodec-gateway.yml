name: JNS Node C Gateway Queue

on:
  push:
    branches: [main]
    paths:
      - 'gateway/request.sh'
      - 'gateway/queue/**.json'

permissions:
  contents: write

concurrency:
  group: jns-nodec-gateway-queue
  cancel-in-progress: false

jobs:
  nodec:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ingest legacy request
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p gateway/queue gateway/results gateway/status
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'gateway/request.sh'; then
            stamp="$(TZ=UTC date -d "$(git show -s --format=%cI "$GITHUB_SHA")" +%Y%m%dT%H%M%SZ)"
            job="gateway/queue/${stamp}-legacy-${GITHUB_SHA:0:12}.sh"
            if [[ ! -e "$job" ]]; then
              cp gateway/request.sh "$job"
              chmod +x "$job"
              echo "legacy_job=$job"
            fi
          fi

      - name: Dispatch queued jobs
        shell: bash
        run: |
          set -Eeuo pipefail
          bash gateway/dispatcher.sh gateway

      - name: Return queue state and per-job results
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "jns-nodec-gateway"
          git config user.email "jns-nodec-gateway@users.noreply.github.com"

          rebuild_index() {
            python3 - <<'PY'
          import glob,json
          rows=[]
          for p in sorted(glob.glob("gateway/status/*.json")):
              try:
                  with open(p,encoding="utf-8") as fh:
                      d=json.load(fh)
              except Exception:
                  continue
              rows.append((d.get("job_id",""),d.get("state",""),d.get("exit_code"),
                           d.get("started") or "",d.get("finished") or ""))
          with open("gateway/index.tsv","w",encoding="utf-8") as fh:
              fh.write("job_id\\tstate\\texit_code\\tstarted\\tfinished\\n")
              for row in rows:
                  fh.write("\\t".join("" if x is None else str(x) for x in row)+"\\n")
          PY
          }

          rebuild_index
          git add gateway/queue gateway/results gateway/status gateway/index.tsv
          if git diff --cached --quiet; then
            echo "No gateway result changes to publish."
            exit 0
          fi

          git commit -m "gateway: record queued Node C job results"
          result_commit="$(git rev-parse HEAD)"

          mapfile -t result_paths < <(
            git diff-tree --no-commit-id --name-only -r "$result_commit" |
            grep -E '^gateway/(queue|results|status)/' || true
          )

          if [[ "${#result_paths[@]}" -eq 0 ]]; then
            echo "No immutable gateway result paths found in result commit." >&2
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main

            # Start from the latest remote state so unrelated concurrent
            # commits are never rebased through or overwritten by this job.
            git reset --hard origin/main

            # Restore only files produced by this gateway run. Queue filenames
            # and result/status filenames are immutable and job-unique.
            for path in "${result_paths[@]}"; do
              git checkout "$result_commit" -- "$path"
            done

            # index.tsv is derived state: rebuild it from the latest remote
            # statuses plus the restored statuses rather than restoring a stale
            # copy from the result commit.
            rebuild_index

            git add gateway/queue gateway/results gateway/status gateway/index.tsv
            if git diff --cached --quiet; then
              echo "Gateway results are already present on origin/main."
              exit 0
            fi

            git commit -m "gateway: record queued Node C job results (publish retry $attempt)"

            if git push origin HEAD:main; then
              echo "Gateway results published successfully."
              exit 0
            fi

            echo "Remote advanced during push; retrying from fresh origin/main."
            sleep 2
          done

          echo "Unable to publish gateway results after 5 collision-safe attempts" >&2
          exit 1
