name: JNS Heating Bathroom Signal Validation
on:
  push:
    branches:
      - 'dev/heating-thermal-learning-v035-20261024'
    paths:
      - 'gateway/heating/v0.3.5/bathroom-precision.request'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check indoor sensor precision and room-specific temperature swings
        run: python3 gateway/heating/v0.3.5/bathroom_learning_audit.py
