name: JNS Current Doorbell Chain Audit
on:
  push:
    branches: [main]
    paths: ['gateway/doorbell/current-chain.request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/doorbell/current_chain_audit.py
