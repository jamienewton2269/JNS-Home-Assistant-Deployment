name: JNS Sharp Printer DNS and DHCP Read Only
on:
  push:
    branches: [diagnostics/sharp-printer-dns-20261028]
    paths:
      - .github/workflows/jns-sharp-printer-dns-readonly-20261028.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - name: Extract actual registered DHCP leases from active JNS DNS service
        shell: bash
        run: |
          set -u
          echo "=== LIVE JNS DHCP LEASE DATA $(date -u -Is) ==="
          for node in nodea nodeb; do
            echo "=== NODE $node ==="
            ssh -o BatchMode=yes -o ConnectTimeout=6 -o StrictHostKeyChecking=accept-new "$node" 'bash -s' <<'REMOTE' || true
          ct=247
          [ "$(hostname)" = nodeb ] && ct=248
          pct exec "$ct" -- sh -c '
            echo "=== $(hostname) CT DHCP LEASE FILE ==="
            f=/var/lib/jnsdns/leases
            if [ -r "$f" ]; then
              echo "LEASE_ROW_COUNT=$(wc -l < "$f")"
              awk "NF>=4 {print \$3,\$4,\$2}" "$f" | head -250
              echo "=== SHARP RELATED LEASES ==="
              grep -inEi "sharp|print|copier|mfp|mx-|bp-|ar-" "$f" || true
            else
              echo "DHCP LEASE FILE UNREADABLE"
            fi
            echo "=== SHARP RELATED JNS DNS CONFIG DATA ==="
            grep -RihnEi "sharp|print|copier|mfp|mx-|bp-|ar-" /etc/jnsdns /etc/dnsmasq.d /var/lib/jnsdns 2>/dev/null | head -35 || true
          ' || true
          REMOTE
          done
          echo "=== END READ ONLY ==="
