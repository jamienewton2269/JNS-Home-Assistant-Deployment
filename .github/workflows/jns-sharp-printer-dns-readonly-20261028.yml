name: JNS Sharp Printer Reachability and Lease Diagnostic Read Only
on:
  push:
    branches: [diagnostics/sharp-printer-dns-20261028]
    paths: [.github/workflows/jns-sharp-printer-dns-readonly-20261028.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Read-only Sharp lease freshness, route, neighbour and printer services
        shell: bash
        run: |
          set -u
          target=10.10.101.198
          mac=bc:b1:81:ee:ca:60
          echo "=== NODE C SHARP DIAGNOSTIC $(date -u -Is) ==="
          echo "=== Node C route ==="
          ip -4 route get "$target" || true
          echo "=== Node C ICMP ping ==="
          ping -n -c 2 -W 1 "$target" 2>&1 | tail -6 || true
          echo "=== Node C neighbour ==="
          ip -4 neigh show to "$target" || true
          echo "=== Node C TCP printer services ==="
          for port in 80 443 515 631 9100; do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/$1/$2' _ "$target" "$port" 2>/dev/null; then echo "PORT $port OPEN"; else echo "PORT $port NO_CONNECT"; fi
          done
          for host in nodea nodeb; do
            echo "=== PROXMOX $host ==="
            ssh -o BatchMode=yes -o ConnectTimeout=6 -o StrictHostKeyChecking=accept-new "$host" 'bash -s' <<'REMOTE' || true
          target=10.10.101.198
          mac=bc:b1:81:ee:ca:60
          echo "--- host $(hostname) routing, ICMP and neighbour ---"
          ip -4 route get "$target" || true
          ping -n -c 2 -W 1 "$target" 2>&1 | tail -6 || true
          ip -4 neigh show to "$target" || true
          ct=247
          [ "$(hostname)" = nodeb ] && ct=248
          echo "--- CT$ct raw DHCP lease (single device) and live service ---"
          pct exec "$ct" -- sh -c '
            echo "UTC_NOW=$(date -u -Is) EPOCH_NOW=$(date +%s)"
            systemctl is-active jns-dns || true
            grep -Fi "bc:b1:81:ee:ca:60" /var/lib/jnsdns/leases 2>/dev/null || true
            echo "=== CT IP and route ==="
            ip -4 route get 10.10.101.198 || true
            echo "=== CT ping ==="
            ping -n -c 2 -W 1 10.10.101.198 2>&1 | tail -6 || true
            echo "=== CT neighbour ==="
            ip -4 neigh show to 10.10.101.198 || true
          ' || true
          REMOTE
          done
          echo "=== DIAGNOSTIC COMPLETE (NO CHANGES) ==="
