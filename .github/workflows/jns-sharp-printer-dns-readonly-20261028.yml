name: JNS Sharp Printer DHCP Registration Read Only
on:
  push:
    branches: [diagnostics/sharp-printer-dns-20261028]
    paths: [.github/workflows/jns-sharp-printer-dns-readonly-20261028.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Inspect DHCP registration, server logs and L2 evidence
        shell: bash
        run: |
          set -u
          echo "=== PRINTER DHCP REGISTRATION AUDIT $(date -u -Is) ==="
          echo "=== Node C L2 observations ==="
          ip neigh show | grep -iE 'bc:b1:81:ee:ca:60|10\.10\.101\.198' || true
          bridge fdb show 2>/dev/null | grep -i 'bc:b1:81:ee:ca:60' || true
          echo "=== DNS master registrations ==="
          for dir in /mnt/jns-dns-master/jns-dns /mnt/jns-dns-master; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 4 -type f -size -8M \( -name '*.tsv' -o -name '*.csv' -o -name '*hosts*' -o -name '*lease*' -o -name '*.conf' \) -print0 2>/dev/null |
              xargs -0 -r grep -inEi 'bc:b1:81:ee:ca:60|jns-eeca60|10\.10\.101\.198' 2>/dev/null | head -50 || true
          done
          echo "=== Proxmox hosts and DHCP/DNS servers ==="
          for host in nodea nodeb; do
            echo "--- $host ---"
            ssh -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new "$host" 'bash -s' <<'REMOTE' || true
          echo "NODE $(hostname) $(date -u -Is)"
          echo "=== host neighbour and FDB ==="
          ip neigh show | grep -iE "bc:b1:81:ee:ca:60|10\.10\.101\.198" || true
          bridge fdb show 2>/dev/null | grep -i "bc:b1:81:ee:ca:60" || true
          ct=247
          [ "$(hostname)" = nodeb ] && ct=248
          pct exec "$ct" -- sh -c '
            echo "=== CT DHCP active service ==="
            systemctl show -p MainPID -p ActiveState jns-dns 2>/dev/null || true
            echo "=== DHCP leases: all matched records ==="
            grep -iE "bc:b1:81:ee:ca:60|jns-eeca60|10\.10\.101\.198" /var/lib/jnsdns/leases 2>/dev/null || true
            echo "=== configuration containing mapping ==="
            grep -RinEi "bc:b1:81:ee:ca:60|jns-eeca60|10\.10\.101\.198" /etc/jnsdns /etc/dnsmasq.conf /etc/dnsmasq.d /etc/hosts /var/lib/jnsdns 2>/dev/null | head -40 || true
            echo "=== recent DHCP logs for target ==="
            journalctl -u jns-dns --since "7 days ago" --no-pager 2>/dev/null | grep -iE "bc:b1:81:ee:ca:60|jns-eeca60|10\.10\.101\.198" | tail -25 || true
            echo "=== recent DHCP events available ==="
            journalctl -u jns-dns --since "2 hours ago" --no-pager 2>/dev/null | grep -iE "DHCP(DISCOVER|OFFER|REQUEST|ACK|NAK)|dhcp" | tail -12 || true
          ' || true
          REMOTE
          done
          echo "=== AUDIT COMPLETED, NO NETWORK CHANGES ==="
