name: JNS Sharp Printer DNS and TCP Port Verification Read Only
on:
  push:
    branches: [diagnostics/sharp-printer-dns-20261028]
    paths:
      - .github/workflows/jns-sharp-printer-dns-readonly-20261028.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Verify actual Sharp FQDN DNS A/PTR on both replicas and RAW 9100
        shell: bash
        run: |
          set -u
          echo "=== Sharp printer DNS and TCP verification $(date -u -Is) ==="
          echo "=== DNS forward and PTR ==="
          for server in 10.10.110.247 10.10.110.248; do
            echo "--- DNS $server ---"
            dig @"$server" jns-eeca60.home.arpa A +short +time=2 +tries=1 || true
            dig @"$server" -x 10.10.101.198 +short +time=2 +tries=1 || true
          done
          echo "=== Node C resolver ==="
          getent ahostsv4 jns-eeca60.home.arpa | head -3 || true
          echo "=== RAW TCP printing port ==="
          if timeout 4 bash -c 'exec 3<>/dev/tcp/10.10.101.198/9100' 2>/dev/null; then
            echo "TCP_9100=OPEN"
          else
            echo "TCP_9100=NOT_REACHABLE"
          fi
          echo "=== Web interface TCP port ==="
          if timeout 4 bash -c 'exec 3<>/dev/tcp/10.10.101.198/80' 2>/dev/null; then
            echo "TCP_80=OPEN"
          else
            echo "TCP_80=NOT_REACHABLE"
          fi
          echo "=== END READ ONLY ==="
