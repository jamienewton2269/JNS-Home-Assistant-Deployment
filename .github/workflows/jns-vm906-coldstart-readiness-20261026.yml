name: JNS VM906 Guest Agent Cold Start Readiness Read Only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-vm906-coldstart-readiness-20261026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Node A capacity, current HA-Security service and guest agent without outage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/vm906_qga_coldstart_readiness_readonly_20261026.py
          python3 gateway/solar/vm906_qga_coldstart_readiness_readonly_20261026.py
