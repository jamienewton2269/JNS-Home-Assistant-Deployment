name: JNS mail server configure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jns-mail-configure.yml']
permissions:
  contents: read
concurrency:
  group: jns-mail-ct250
  cancel-in-progress: false
jobs:
  configure:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash mail_server/configure.sh
