name: JNS HA905 Local App Python Base Source Guarded Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-python-base-source-patch-guarded.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha905-one-time-api-probe
  cancel-in-progress: false
jobs:
  patch:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline verify Python-base application
        run: |
          python3 -m py_compile gateway/solar/ha905_api_app_source_patch_guarded_20261028.py
          python3 gateway/solar/ha905_core_api_bridge_app/test_probe.py -v
      - name: Update only retained local-app Dockerfile; no app installation
        run: python3 gateway/solar/ha905_api_app_source_patch_guarded_20261028.py
