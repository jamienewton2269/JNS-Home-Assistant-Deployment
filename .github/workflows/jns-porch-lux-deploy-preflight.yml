name: JNS Porch Lux Safe-Deploy Preflight
on:
  push:
    branches: [main]
    paths:
      - 'gateway/doorbell/porch-lux-deploy-preflight.request'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/doorbell/porch-lux-deploy-preflight.py
