name: JNS VM906 Cutover Full Preflight Readonly Long Core Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-vm906-long-core-preflight-only-20261028.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha-security-single-owner-cutover
  cancel-in-progress: false
jobs:
  read_only:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Static validate strict long Core-check guest execution and simulator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_security_vm906_guarded_stop_20261028.py
          python3 -m py_compile gateway/solar/ha906_nodec_auto_failback_20261028.py
          python3 gateway/solar/test_ha906_nodec_auto_failback_20261028.py -v
      - name: Exercise exact VM906 stop preflight only without arming or isolating
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 gateway/solar/ha_security_vm906_guarded_stop_20261028.py --preflight
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea qm status 906)" = "status: running"
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodeb qm status 905)" = "status: running"
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea systemctl is-active jns-ha906-recovery-20261028.timer)" != "active"
          echo JNS_READONLY_CUTOVER_PREFLIGHT_STATUS=source_alive_target_alive_no_recovery_timer
