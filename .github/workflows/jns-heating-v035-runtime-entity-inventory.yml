name: JNS Heating v0.3.5 Live Entity ID Read-only Inventory
on:
  push:
    branches: ['dev/heating-thermal-learning-v035-20261024']
    paths:
      - 'gateway/heating/v0.3.5/runtime-entity-inventory.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare registered and active heating entity identifiers read-only
        run: python3 gateway/heating/v0.3.5/runtime_entity_inventory.py
