name: Node C Veyra PXE Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-veyra-pxe-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Inspect installed PXE components
        shell: bash
        run: |
          set -u
          echo "=== BINARIES ==="
          command -v in.tftpd || true
          command -v tftpd || true
          command -v dnsmasq || true
          command -v xorriso || true
          command -v python3 || true
          echo "=== IPXE FILES ==="
          find /usr/lib /usr/share -maxdepth 4 -type f 2>/dev/null | grep -E '/(snponly\.efi|undionly\.kpxe|ipxe\.efi)$' | sort | head -100 || true
          echo "=== PORTS 69/8097/8098 ==="
          ss -lntup | grep -E ':(69|8097|8098)\b' || true
          echo "VEYRA_PXE_COMPONENT_AUDIT_COMPLETE"
