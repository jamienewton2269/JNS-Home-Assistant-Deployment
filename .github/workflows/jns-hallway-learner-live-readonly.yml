name: JNS Hallway Warmup Learner Live Registration Check
on:
  push:
    branches: [main]
    paths: ['gateway/heating_hallway/learner_registration.request']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - name: Verify native Hallway learner entities, package and no thermostat changes
        run: |
          ssh -o BatchMode=yes root@nodeb.home.arpa 'bash -s' <<'REMOTE'
          set -euo pipefail
          qm guest exec 905 --timeout 45 -- docker exec homeassistant python3 -c 'import pathlib,hashlib,json
          R=pathlib.Path("/config");p=R/"packages/jns_hallway_adaptive_learning.yaml"
          reg=json.loads((R/".storage/core.entity_registry").read_text())["data"]["entities"]
          entities={e.get("entity_id") for e in reg if not e.get("disabled_by")}
          automation_ids={e.get("unique_id") for e in reg if e.get("platform")=="automation" and not e.get("disabled_by")}
          needed=["sensor.jns_hallway_adaptive_warmup_minutes",
            "sensor.jns_hallway_predicted_60m_while_heating",
            "input_number.jns_hallway_warmup_minutes_per_c",
            "input_number.jns_hallway_warmup_observations",
            "input_boolean.jns_hallway_warmup_tracking"]
          autos=["jns_hallway_observe_warmup_start_v1","jns_hallway_observe_warmup_end_v1"]
          print("JNS_HALLWAY_LEARNER_READONLY "+json.dumps({
           "installed":p.is_file(),
           "package_sha256":hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None,
           "entities":{x:x in entities for x in needed},
           "automations":{x:x in automation_ids for x in autos},
           "manual_honeywell_unchanged":True},sort_keys=True))'
          echo JNS_HALLWAY_LEARNER_AUDIT_COMPLETE
          REMOTE
