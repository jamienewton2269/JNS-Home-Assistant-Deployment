name: JNS Tuya Freedom Local Repair Checklist
on:
  push:
    branches: [main]
    paths:
      - 'gateway/tuya_freedom/local_repair_checklist.py'
      - '.github/workflows/jns-tuya-local-repair-checklist.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-tuya-local-repair-checklist
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Write private local device repair steps using trusted host discovery
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/tuya_freedom/local_repair_checklist.py
          python3 gateway/tuya_freedom/local_repair_checklist.py
