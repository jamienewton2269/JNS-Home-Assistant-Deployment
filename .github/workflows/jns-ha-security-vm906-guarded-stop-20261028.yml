name: JNS HA-Security VM906 Guarded Maintenance Cutover Stop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-security-vm906-guarded-stop-20261028.yml'
      - 'gateway/solar/ha_security_vm906_guarded_stop_20261028.py'
      - 'gateway/solar/requests/vm906-maintenance-cutover-20261028.request'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-security-single-owner-cutover
  cancel-in-progress: false
jobs:
  stop:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/solar/ha_security_vm906_guarded_stop_20261028.py
      - name: Stop VM906 only after explicit cutover request
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f gateway/solar/requests/vm906-maintenance-cutover-20261028.request ]]; then
            echo 'JNS_VM906_STOP_NOT_REQUESTED=yes'
            exit 0
          fi
          python3 gateway/solar/ha_security_vm906_guarded_stop_20261028.py
