name: JNS HA-Security VM906 Guarded Maintenance Cutover Stop
on:
  # NEVER stop the active alarm controller as a side effect of a Git push.
  workflow_dispatch:
    inputs:
      onsite_operator_confirmed:
        description: "On-site operator present for security outage and physical checks"
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: jns-ha-security-single-owner-cutover
  cancel-in-progress: false
jobs:
  stop:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/solar/ha_security_vm906_guarded_stop_20261028.py
      - name: Stop VM906 only after fresh on-site confirmation and explicit cutover request
        if: inputs.onsite_operator_confirmed == true
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f gateway/solar/requests/vm906-maintenance-cutover-20261028.request ]]; then
            echo 'JNS_VM906_STOP_NOT_REQUESTED=yes'
            exit 0
          fi
          python3 gateway/solar/ha_security_vm906_guarded_stop_20261028.py
