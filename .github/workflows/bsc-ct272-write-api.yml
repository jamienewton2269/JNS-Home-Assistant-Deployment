name: CT272 authenticated write migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-ct272-write-api.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-ct272-write-api-latest.txt
          rc=0
          {
            echo "run_id=$GITHUB_RUN_ID"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb 'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground && pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d bsc_synthetic_fulltest_20261121' < club-manager/migrations/025_authenticated_seniority_writes.sql || rc=$?
            echo "migration_exit=$rc"
            if [ "$rc" = 0 ]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d bsc_synthetic_fulltest_20261121' <<'SQL' || rc=$?
          DO $$
          BEGIN
            BEGIN
              PERFORM club.api_seniority_write('invalid','policy','{"months":12}'::jsonb);
              RAISE EXCEPTION 'Unauthenticated write accepted';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PASS: unauthenticated write rejected';
            END;
            IF has_function_privilege('clubmgr','club.api_seniority_write(text,text,jsonb)','EXECUTE') THEN
              RAISE EXCEPTION 'Legacy role can execute write API';
            END IF;
            RAISE NOTICE 'PASS: legacy role denied';
          END $$;
          SQL
            fi
            echo "test_exit=$rc"
          } > "$report" 2>&1
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record CT272 authenticated write migration"
          git push origin HEAD:main
          exit "$rc"
