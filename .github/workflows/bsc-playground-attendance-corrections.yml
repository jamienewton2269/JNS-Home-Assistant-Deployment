name: CT272 attendance corrections
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-playground-attendance-corrections.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-playground-attendance-corrections-latest.txt
          set +e
          bash -euo pipefail > "$report" 2>&1 <<'DEPLOY'
          remote() { ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb "$@"; }
          remote 'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground'
          remote 'pct exec 272 -- sh -ec "umask 077; mkdir -p /root/bsc-attendance-backup; runuser -u postgres -- pg_dump -Fc club_manager > /root/bsc-attendance-backup/db.dump; pg_restore -l /root/bsc-attendance-backup/db.dump >/dev/null"'
          echo backup_verified
          remote 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' < club-manager/migrations/026_seniority_read_projection.sql
          remote 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' < club-manager/migrations/027_attendance_corrections.sql
          remote 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' <<'SQL'
          GRANT EXECUTE ON FUNCTION club.api_seniority_for_officer(text) TO clubbeta;
          SELECT column_name FROM information_schema.columns WHERE table_schema='club' AND table_name='seniority_write_audit' AND column_name IN ('previous_status','new_status');
          DO $$ BEGIN
            BEGIN
              PERFORM club.api_seniority_write('invalid','attendance','{}'::jsonb);
              RAISE EXCEPTION 'Unauthorised write accepted';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PASS: unauthorised attendance correction rejected';
            END;
          END $$;
          SQL
          remote 'pct exec 272 -- python3 -' <<'PY'
          import urllib.request, urllib.error
          base="http://127.0.0.1:8766"
          headers={"Host":"club-manager-playground.home.arpa"}
          with urllib.request.urlopen(base+"/healthz",timeout=5) as r:
              assert r.status==200
          with urllib.request.urlopen(urllib.request.Request(base+"/assets/browser.js",headers=headers),timeout=5) as r:
              assert b"partyOptions" in r.read()
          try:
              urllib.request.urlopen(urllib.request.Request(base+"/api/v1/seniority",headers=headers),timeout=5)
          except urllib.error.HTTPError as e:
              assert e.code==401,e.code
          else:
              raise RuntimeError("Unauthenticated read accepted")
          print("PASS: live health, dropdown asset and read authentication")
          PY
          DEPLOY
          rc=$?
          set -e
          echo "deployment_exit=$rc" >> "$report"
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record attendance correction deployment"
          git push origin HEAD:main
          exit "$rc"
