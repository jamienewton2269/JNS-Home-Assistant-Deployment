name: JNS Garden and Back Door Read-only Audit
on:
  push:
    branches: [main]
    paths:
      - 'gateway/garden_features/audit.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/garden_features/audit.py
