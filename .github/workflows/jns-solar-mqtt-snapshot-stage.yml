name: JNS Solar MQTT Offline Backup Staging
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-mqtt-snapshot-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-solar-mqtt-snapshot-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Stage source CT212 snapshot copy under Node A root-only storage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/mqtt_ct212_stage_backup_nodea_v1.py
          python3 gateway/solar/mqtt_ct212_stage_backup_nodea_v1.py
