name: JNS HA-General Passive Security Activation Readonly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-general-security-activation-readonly-20261027.yml'
      - 'gateway/solar/ha_general_security_activation_readonly_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit HA-General helper definitions and Core startup without changes
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_general_security_activation_readonly_20261027.py
          python3 gateway/solar/ha_general_security_activation_readonly_20261027.py
