name: JNS EMERGENCY HA905 Handback v2 Stop-App Inventory Verified
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-urgent-recover-ha905-services-v2-20261028.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha-security-single-owner-cutover
  cancel-in-progress: false
jobs:
  handback:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed Python and recovery simulation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha906_emergency_restore_ha905_services_20261028.py
          python3 -m py_compile gateway/solar/ha906_nodec_auto_failback_20261028.py
          python3 gateway/solar/test_ha906_nodec_auto_failback_20261028.py -v
      - name: Permit one-time handback only from original exclusive state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = nodec
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea qm status 906)" = "status: running"
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodeb qm status 905)" = "status: paused"
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea systemctl is-active jns-ha906-recovery-20261028.timer)" = "active"
          test -f "$HOME/.local/share/jns-security-failback-20261028/state.json"
          test ! -e "$HOME/.local/share/jns-security-failback-20261028/handback-attempted-v2"
          echo JNS_HAND_BACK_V2_GATE=verified
      - name: Controlled handback; poll Supervisor app uninstall before restoring source
        shell: bash
        run: |
          set -Eeuo pipefail
          touch "$HOME/.local/share/jns-security-failback-20261028/handback-attempted-v2"
          python3 gateway/solar/ha906_emergency_restore_ha905_services_20261028.py
