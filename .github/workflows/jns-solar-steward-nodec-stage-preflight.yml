name: JNS Solar Steward Node C Stage Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-steward-nodec-stage-preflight.yml'
      - 'gateway/solar/steward_nodec_stage_preflight_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-solar-steward-nodec-stage-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate private export size and current runner privileges
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/steward_nodec_stage_preflight_v1.py
          python3 gateway/solar/steward_nodec_stage_preflight_v1.py
