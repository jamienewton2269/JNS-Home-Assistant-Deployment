name: Validate Veyra Netboot Payload Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-netboot-payload-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate netboot payload helper
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n gateway/trusted/veyra-pxe-v092.sh

          grep -Fq 'SOURCE_PAYLOAD=/root/veyra-v0.9/source071/veyra' gateway/trusted/veyra-pxe-v092.sh
          grep -Fq 'veyra-payload.tar.gz' gateway/trusted/veyra-pxe-v092.sh
          grep -Fq 'preseed-iso.cfg' gateway/trusted/veyra-pxe-v092.sh
          grep -Fq '10.10.10.236' gateway/trusted/veyra-pxe-v092.sh
          grep -Fq 'line.replace("10.10.10.236", host)' gateway/trusted/veyra-pxe-v092.sh
          grep -Fq 'goto bootfail' gateway/trusted/veyra-pxe-v092.sh
          grep -Fq 'Veyra installer handoff FAILED' gateway/trusted/veyra-pxe-v092.sh

          cp /srv/veyra-pxe/http/veyra/v0.9.2/preseed.cfg /tmp/preseed-netboot-test.cfg
          python3 - /tmp/preseed-netboot-test.cfg 10.10.110.13 8098 <<'PY'
from pathlib import Path
import sys
p=Path(sys.argv[1])
host=sys.argv[2]
port=sys.argv[3]
lines=p.read_text(encoding="utf-8").splitlines()
out=[]
late=(
    "d-i preseed/late_command string "
    f"in-target /usr/bin/curl -fsSL http://{host}:{port}/veyra/v0.9.2/veyra-payload.tar.gz -o /root/veyra-payload.tar.gz; "
    "in-target /bin/tar -xzf /root/veyra-payload.tar.gz -C /root; "
    "in-target /bin/bash -c 'cd /root/veyra && chmod +x scripts/*.sh && ./scripts/install-debian.sh'; "
    "in-target grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=Veyra --removable --no-nvram --recheck; "
    "in-target update-grub; "
    "in-target rm -rf /root/veyra /root/veyra-payload.tar.gz"
)
for line in lines:
    if line.startswith("d-i preseed/late_command string "):
        out.append(late)
    else:
        out.append(line.replace("10.10.10.236", host))
p.write_text("\n".join(out)+"\n", encoding="utf-8")
PY
          grep -Fq 'http://10.10.110.13:8098/veyra/v0.9.2/veyra-payload.tar.gz' /tmp/preseed-netboot-test.cfg
          ! grep -Fq '/cdrom/veyra' /tmp/preseed-netboot-test.cfg
          ! grep -Fq '10.10.10.236' /tmp/preseed-netboot-test.cfg

          echo VEYRA_NETBOOT_PAYLOAD_FIX_VALID
