name: JNS HA905 Installed App Start Once Source Lint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-once-start-uninstall-lint.yml'
      - 'gateway/solar/ha905_api_probe_start_once_uninstall_20261028.py'
permissions:
  contents: read
jobs:
  lint:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/solar/ha905_api_probe_start_once_uninstall_20261028.py
      - run: python3 gateway/solar/ha905_core_api_bridge_app/test_probe.py -v
      - run: echo JNS_HA905_ONE_SHOT_SOURCE_ONLY=yes
