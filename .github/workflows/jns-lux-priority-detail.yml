name: JNS Lux Priority Readonly Detail
on:
  push:
    branches: [main]
    paths: ['gateway/lux_priority/detail.request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile gateway/lux_priority/detail.py
          python3 gateway/lux_priority/detail.py
