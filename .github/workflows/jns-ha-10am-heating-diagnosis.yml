name: JNS HA-General 10am Heating Root Cause (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-10am-heating-diagnosis.yml'
      - 'gateway/heating_hallway/diagnose_10am_live.py'
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/heating_hallway/diagnose_10am_live.py
      - run: python3 gateway/heating_hallway/diagnose_10am_live.py
