name: JNS VM906 Home Assistant Observer Diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-vm906-observer-diagnosis.yml'
      - 'gateway/solar/vm906_observer_readonly_diagnostic_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read HAOS observer/supervisor connectivity categories privately
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/vm906_observer_readonly_diagnostic_v1.py
          python3 gateway/solar/vm906_observer_readonly_diagnostic_v1.py
