name: CT272 write prerequisites inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-ct272-write-prerequisites.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-ct272-write-prerequisites-latest.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb 'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground && pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d bsc_synthetic_fulltest_20261121' <<'SQL'
          SELECT rolname,rolcanlogin FROM pg_roles WHERE rolname LIKE 'club%' ORDER BY rolname;
          SELECT n.nspname,p.proname,pg_get_function_identity_arguments(p.oid) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='club' AND p.proname IN ('officer_session_authorized','has_privileged_access','issue_officer_api_session','complete_verified_webauthn_login');
          SELECT table_name FROM information_schema.tables WHERE table_schema='club' AND (table_name LIKE 'officer_%' OR table_name LIKE 'committee_%' OR table_name LIKE 'security_%') ORDER BY table_name;
          SQL
          } > "$report" 2>&1
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record CT272 missing write security prerequisites"
          git push origin HEAD:main
