name: JNS Front Doorbell Read-only Audit
on:
  push:
    branches: [main]
    paths:
      - 'gateway/doorbell/diagnose.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read only front doorbell path diagnostics
        run: python3 gateway/doorbell/diagnose_readonly.py
      - name: Read-only ESPHome file inventory
        run: python3 gateway/doorbell/esp32-file-inventory.py

      - name: Inspect HA-General local doorbell automation
        run: python3 gateway/doorbell/audit_vm905_automation.py

      - name: Inspect legacy doorbell GPIO logic lines
        run: python3 gateway/doorbell/esp32-logic-grep.py

      - name: Inspect HA900 historical automation mapping
        run: python3 gateway/doorbell/legacy-automation-grep.py
