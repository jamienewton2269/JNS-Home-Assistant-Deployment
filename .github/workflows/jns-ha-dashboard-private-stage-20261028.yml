name: JNS HA Dashboard Private Inert Consolidation Stage 2026-10-28
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-dashboard-private-stage-20261028.yml'
      - 'gateway/solar/ha_dashboard_private_stage_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-dashboard-private-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate private staging script without accessing secrets
        run: python3 -m py_compile gateway/solar/ha_dashboard_private_stage_20261028.py
      - name: Stage only missing source Lovelace definitions privately on Node B
        run: python3 gateway/solar/ha_dashboard_private_stage_20261028.py
