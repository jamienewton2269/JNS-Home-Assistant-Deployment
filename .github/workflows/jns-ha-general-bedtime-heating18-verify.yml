name: JNS HA-General Bedtime Heating18 Postcheck
on:
  push:
    branches: [main]
    paths: ['gateway/bedtime/heating18-verify.request']
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify HA905 Core and thermostat bedtime automation without modifications
        run: |
          set -euo pipefail
          python3 -m py_compile gateway/bedtime/heating18_verify.py
          python3 gateway/bedtime/heating18_verify.py
