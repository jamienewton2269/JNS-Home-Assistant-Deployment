name: Node C DNS Importer Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-dns-importer-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install latest importer
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/jns-gateway-exec "$GITHUB_WORKSPACE/gateway/queue/20261008T062000Z-dns-reservation-importer-final-06.json"

      - name: Reversible A PTR test
        shell: bash
        run: |
          set -Eeuo pipefail
          record='[{"mac":"02:00:00:00:00:01","ip":"192.0.2.123","name":"jns-dns-importer-test","fqdn":"jns-dns-importer-test.home.arpa"}]'

          cleanup() {
            /usr/local/sbin/jns-dns-static-apply apply '[]' || true
          }
          trap cleanup EXIT

          /usr/local/sbin/jns-dns-static-apply preview "$record"
          /usr/local/sbin/jns-dns-static-apply apply "$record"

          python3 - <<'PY'
          import socket,struct,time
          server="10.10.10.247"

          def enc(name):
              return b"".join(bytes([len(p)])+p.encode() for p in name.rstrip(".").split("."))+b"\0"

          def read_name(data,off):
              labels=[]; end=None; seen=set()
              while True:
                  if off in seen: raise RuntimeError("compression loop")
                  seen.add(off); n=data[off]
                  if n==0:
                      off+=1
                      return ".".join(labels), off if end is None else end
                  if n & 0xC0 == 0xC0:
                      ptr=((n & 0x3F)<<8)|data[off+1]
                      if end is None: end=off+2
                      off=ptr; continue
                  off+=1; labels.append(data[off:off+n].decode()); off+=n

          def query(name,qtype):
              pkt=struct.pack("!HHHHHH",0x4A51,0x0100,1,0,0,0)+enc(name)+struct.pack("!HH",qtype,1)
              last=None
              for _ in range(10):
                  s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(1)
                  try:
                      s.sendto(pkt,(server,53)); data,_=s.recvfrom(4096)
                      _,flags,qd,an,_,_=struct.unpack("!HHHHHH",data[:12])
                      off=12; out=[]
                      for _ in range(qd):
                          _,off=read_name(data,off); off+=4
                      for _ in range(an):
                          _,off=read_name(data,off)
                          typ,cls,ttl,rdlen=struct.unpack("!HHIH",data[off:off+10]); off+=10; rs=off
                          if typ==1 and rdlen==4: out.append(socket.inet_ntoa(data[rs:rs+4]))
                          elif typ==12:
                              v,_=read_name(data,rs); out.append(v.rstrip("."))
                          off=rs+rdlen
                      return out
                  except Exception as e:
                      last=e; time.sleep(0.5)
                  finally:
                      s.close()
              raise RuntimeError(last)

          a=query("jns-dns-importer-test.home.arpa",1)
          ptr=query("123.2.0.192.in-addr.arpa",12)
          print("A:",a)
          print("PTR:",ptr)
          assert "192.0.2.123" in a
          assert "jns-dns-importer-test.home.arpa" in ptr
          print("EXTERNAL_DNS_VALIDATION_OK")
          PY

          cleanup
          trap - EXIT
          echo "DNS_IMPORTER_SMOKE_OK"
