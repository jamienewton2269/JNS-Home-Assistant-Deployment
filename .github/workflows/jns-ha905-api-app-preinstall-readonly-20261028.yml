name: JNS HA905 API App Preinstall Readonly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-api-app-preinstall-readonly-20261028.yml'
      - 'gateway/solar/ha905_app_install_preflight_readonly_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha905-api-app-preinstall
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/solar/ha905_app_install_preflight_readonly_20261028.py
      - name: Read-only VM905 and VM906 application installation guard
        run: python3 gateway/solar/ha905_app_install_preflight_readonly_20261028.py
