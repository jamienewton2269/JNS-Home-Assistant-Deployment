name: Verify Served Veyra UEFI Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-uefi-live-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Verify served iPXE handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS http://127.0.0.1:8098/autoexec.ipxe | tee /tmp/veyra-live.ipxe
          grep -Fq 'imgfree autoexec.ipxe ||' /tmp/veyra-live.ipxe
          grep -Fq 'initrd=initrd.magic' /tmp/veyra-live.ipxe
          grep -Fq 'initrd --name initrd.gz' /tmp/veyra-live.ipxe
          grep -Fq 'goto bootfail' /tmp/veyra-live.ipxe
          grep -Fq 'Veyra installer handoff FAILED' /tmp/veyra-live.ipxe
          echo VEYRA_UEFI_LIVE_HANDOFF_VALID
