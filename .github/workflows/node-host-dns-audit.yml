name: Node Host DNS Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/node-host-dns-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on:
      - self-hosted
      - linux
      - x64
      - nodec
    timeout-minutes: 6
    steps:
      - name: Audit Node C
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "===== NODE C ====="
          hostname
          echo "--- resolv.conf ---"
          cat /etc/resolv.conf || true
          echo "--- default lookup ---"
          getent ahostsv4 JNS-288328.home.arpa || true
          echo "--- direct .247 ---"
          nslookup JNS-288328.home.arpa 10.10.10.247 || true
          echo "--- direct .248 ---"
          nslookup JNS-288328.home.arpa 10.10.10.248 || true
          echo "--- node hostname resolution ---"
          getent hosts nodea || true
          getent hosts nodeb || true

      - name: Audit Node A
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new nodea "hostname; echo ---resolv.conf---; cat /etc/resolv.conf; echo ---default---; getent ahostsv4 JNS-288328.home.arpa || true; echo ---primary---; nslookup JNS-288328.home.arpa 10.10.10.247 || true; echo ---secondary---; nslookup JNS-288328.home.arpa 10.10.10.248 || true"

      - name: Audit Node B
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new nodeb "hostname; echo ---resolv.conf---; cat /etc/resolv.conf; echo ---default---; getent ahostsv4 JNS-288328.home.arpa || true; echo ---primary---; nslookup JNS-288328.home.arpa 10.10.10.247 || true; echo ---secondary---; nslookup JNS-288328.home.arpa 10.10.10.248 || true"
