name: Node Host DNS Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/node-host-dns-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - name: Audit Node A B C DNS without checkout
        shell: bash
        run: |
          set -Eeuo pipefail

          show_dns() {
            label="$1"
            echo "===== $label ====="
            echo "--- hostname ---"
            hostname -f 2>/dev/null || hostname
            echo "--- resolv.conf ---"
            cat /etc/resolv.conf 2>/dev/null || true
            echo "--- resolvectl ---"
            resolvectl status 2>/dev/null | sed -n '1,140p' || true
            echo "--- nmcli DNS ---"
            nmcli dev show 2>/dev/null | grep -E 'GENERAL.DEVICE|IP4.DNS|IP4.DOMAIN|IP6.DNS|IP6.DOMAIN' || true
            echo "--- JNS FQDN lookup ---"
            if command -v dig >/dev/null 2>&1; then
              dig JNS-288328.home.arpa A +short +time=3 +tries=1 || true
              echo "--- direct primary ---"
              dig @10.10.10.247 JNS-288328.home.arpa A +short +time=3 +tries=1 || true
              echo "--- direct secondary ---"
              dig @10.10.10.248 JNS-288328.home.arpa A +short +time=3 +tries=1 || true
            else
              getent ahostsv4 JNS-288328.home.arpa 2>/dev/null || nslookup JNS-288328.home.arpa 2>/dev/null || true
            fi
            echo
          }

          echo "=== Node C local ==="
          show_dns "NODE C"

          echo "=== SSH name resolution from Node C ==="
          getent ahostsv4 nodea 2>/dev/null || true
          getent ahostsv4 nodeb 2>/dev/null || true
          getent ahostsv4 nodea.home.arpa 2>/dev/null || true
          getent ahostsv4 nodeb.home.arpa 2>/dev/null || true

          for host in nodea nodeb; do
            echo "=== $host remote ==="
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$host" 'bash -s' <<'REMOTE'
set -Eeuo pipefail
echo "--- hostname ---"
hostname -f 2>/dev/null || hostname
echo "--- resolv.conf ---"
cat /etc/resolv.conf 2>/dev/null || true
echo "--- resolvectl ---"
resolvectl status 2>/dev/null | sed -n '1,140p' || true
echo "--- nmcli DNS ---"
nmcli dev show 2>/dev/null | grep -E 'GENERAL.DEVICE|IP4.DNS|IP4.DOMAIN|IP6.DNS|IP6.DOMAIN' || true
echo "--- JNS FQDN lookup ---"
if command -v dig >/dev/null 2>&1; then
  dig JNS-288328.home.arpa A +short +time=3 +tries=1 || true
  echo "--- direct primary ---"
  dig @10.10.10.247 JNS-288328.home.arpa A +short +time=3 +tries=1 || true
  echo "--- direct secondary ---"
  dig @10.10.10.248 JNS-288328.home.arpa A +short +time=3 +tries=1 || true
else
  getent ahostsv4 JNS-288328.home.arpa 2>/dev/null || nslookup JNS-288328.home.arpa 2>/dev/null || true
fi
REMOTE
          done
