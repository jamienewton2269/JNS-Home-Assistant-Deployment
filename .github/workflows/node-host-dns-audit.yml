name: Node Host DNS Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/node-host-dns-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on:
      - self-hosted
      - linux
      - x64
      - nodec
    timeout-minutes: 5
    steps:
      - name: Read Node A and B DNS via Proxmox cluster API
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o HostName=10.10.10.235 nodeb             "echo '=== NODE A DNS API ==='; pvesh get /nodes/nodea/dns --output-format json-pretty; echo '=== NODE B DNS API ==='; pvesh get /nodes/nodeb/dns --output-format json-pretty"
