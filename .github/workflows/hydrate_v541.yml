name: Hydrate JNS v5.4.1 deployment source

on:
  push:
    branches:
      - feature/hacs-bootstrap-v5.4.1
    paths:
      - .github/jns/deployment.py.gz.b64

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/hacs-bootstrap-v5.4.1
      - name: Hydrate verified deployment.py
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/jns/deployment.py.gz.b64
          if [ ! -f "$payload" ]; then
            echo "Hydration payload already removed; nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('.github/jns/deployment.py.gz.b64').read_text(encoding='ascii').strip()
          data = gzip.decompress(base64.b64decode(payload, validate=True))
          Path('custom_components/jns_deployment/deployment.py').write_bytes(data)
          PY
          actual=$(git hash-object custom_components/jns_deployment/deployment.py)
          expected=c76c2c3a123860c903ebeaf23716e2826586d133
          test "$actual" = "$expected" || { echo "deployment.py blob mismatch: $actual"; exit 1; }
          rm -f "$payload"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/jns_deployment/deployment.py "$payload"
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Hydrate JNS v5.1.2 deployment engine"
          git push origin HEAD:feature/hacs-bootstrap-v5.4.1
