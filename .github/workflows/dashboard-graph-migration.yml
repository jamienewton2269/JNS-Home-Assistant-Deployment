name: Dashboard graph migration
on:
  push:
    branches: [main]
    paths: ['gateway/dashboard_graphs/run.request']
permissions: {contents: read}
concurrency:
  group: dashboard-graph-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate graph conversion semantics
        run: python3 -m unittest discover -s gateway/dashboard_graphs -p test_convert_graphs.py
      - name: Stage and validate chart migration without live changes
        run: python3 gateway/dashboard_graphs/deploy_offline.py
