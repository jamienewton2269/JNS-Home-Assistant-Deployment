name: JNS Hallway Adaptive Learner Offline CI
on:
  push:
    branches: [main]
    paths: ['gateway/heating_hallway/learner_ci.request']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s gateway/heating_hallway -p 'test_adaptive_native.py' -v
