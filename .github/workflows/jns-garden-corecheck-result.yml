name: JNS Garden Existing Core Check Result
on:
  push:
    branches: [main]
    paths:
      - 'gateway/garden_features/corecheck-result.request'
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Read only - poll pre-deployment Home Assistant check
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 root@nodeb.home.arpa \
            'test "$(hostname -s)" = nodeb && qm guest exec-status 905 778979'
