name: Club Manager - upstream WebAuthn PostgreSQL bridge
on:
  push:
    paths:
      - club-manager/migrations/019_webauthn_store_bridge.sql
      - club-manager/auth/pg_webauthn_store.py
      - .github/workflows/club-manager-webauthn-store-test.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-manager-ct101
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy one-use credential store and verify default denial
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = nodec
          python3 -m py_compile club-manager/auth/pg_webauthn_store.py
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'umask 077; cat > /tmp/club-019.sql' < club-manager/migrations/019_webauthn_store_bridge.sql
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(hostname -s)" = nodea
          test "$(pct config 101 | sed -n "s/^hostname: //p")" = club-manager-dev
          pct push 101 /tmp/club-019.sql /tmp/club-019.sql
          pct exec 101 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager -f /tmp/club-019.sql
          pct exec 101 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager <<'SQL'
          BEGIN;
          DO $$
          DECLARE officer uuid:=gen_random_uuid();
                  other uuid:=gen_random_uuid();
                  nonce bytea:=decode(repeat('aa',32),'hex');
                  nonce_id uuid;
                  claimed bytea;
                  n integer;
          BEGIN
            INSERT INTO club.committee_accounts(id,display_name,email,created_by,account_state)
            VALUES(officer,'Synthetic Passkey Bridge','passkey-bridge@example.invalid','test','active'),
                  (other,'Synthetic Other Bridge','passkey-other-bridge@example.invalid','test','active');
            IF club.can_enrol_officer_webauthn(officer) THEN
              RAISE EXCEPTION 'Unapproved enrolment permitted'; END IF;
            BEGIN
              PERFORM club.start_webauthn_challenge(officer,'register',nonce);
              RAISE EXCEPTION 'Unapproved registration challenge permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            IF club.register_verified_webauthn_credential(
                officer,convert_to('credential-id-valid-123456','UTF8'),
                convert_to(repeat('public-key-placeholder',3),'UTF8'),0) THEN
              RAISE EXCEPTION 'Unapproved credential inserted'; END IF;
            nonce_id:=club.start_webauthn_challenge(officer,'authenticate',nonce);
            IF club.claim_webauthn_challenge(nonce_id,other,'authenticate') IS NOT NULL
              OR club.claim_webauthn_challenge(nonce_id,officer,'register') IS NOT NULL
             THEN RAISE EXCEPTION 'Wrong identity/purpose read challenge'; END IF;
            claimed:=club.claim_webauthn_challenge(nonce_id,officer,'authenticate');
            IF claimed IS NULL OR claimed<>nonce THEN
              RAISE EXCEPTION 'Valid nonce not returned'; END IF;
            IF club.claim_webauthn_challenge(nonce_id,officer,'authenticate') IS NOT NULL
             THEN RAISE EXCEPTION 'Challenge reused'; END IF;
            SELECT count(*) INTO n FROM club.officer_webauthn_credentials
             WHERE account_id=officer;
            IF n<>0 THEN RAISE EXCEPTION 'Credential unexpected'; END IF;
            RAISE NOTICE 'PASS: unapproved registration blocked, nonce bound, one-time use';
          END $$;
          ROLLBACK;
          DO $$ BEGIN
            IF has_function_privilege('clubmgr','club.start_webauthn_challenge(uuid,text,bytea)','EXECUTE')
             OR has_function_privilege('clubmgr','club.claim_webauthn_challenge(uuid,uuid,text)','EXECUTE')
             OR has_function_privilege('clubmgr','club.can_enrol_officer_webauthn(uuid)','EXECUTE')
             OR has_function_privilege('club_api_service','club.register_verified_webauthn_credential(uuid,bytea,bytea,bigint)','EXECUTE')
             OR NOT has_function_privilege('club_authn_service','club.start_webauthn_challenge(uuid,text,bytea)','EXECUTE')
            THEN RAISE EXCEPTION 'Enrolment permissions are not isolated'; END IF;
          END $$;
          SQL
          pct exec 101 -- curl -fsS --max-time 5 http://127.0.0.1:8765/healthz
          pct exec 101 -- rm -f /tmp/club-019.sql
          rm -f /tmp/club-019.sql
          echo 'PASS: CT101 WebAuthn bridge, no officer enrolment enabled'
          REMOTE
