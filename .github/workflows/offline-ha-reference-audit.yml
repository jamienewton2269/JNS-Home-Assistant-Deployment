name: JNS Offline HA Reference Audit

on:
  push:
    branches: [main]
    paths:
      - 'gateway/reference-audit-trigger/**'

permissions:
  contents: write

concurrency:
  group: jns-offline-ha-reference-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect offline VM900
        shell: bash
        run: bash gateway/reference_audit_vm900.sh
      - name: Publish audit result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "jns-nodec-reference-audit"
          git config user.email "jns-nodec-reference-audit@users.noreply.github.com"
          git add gateway/results/offline-vm900-snug-sofa-led-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: record offline VM900 Snug sofa LED inventory"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
