name: JNS Heating v0.3.5 Local API Authorisation Read-only Routes
on:
  push:
    branches: ['dev/heating-thermal-learning-v035-20261024']
    paths:
      - 'gateway/heating/v0.3.5/local-api-routes.request'
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare fixed read-only HAOS client API permissions
        run: python3 gateway/heating/v0.3.5/local_api_routes.py
