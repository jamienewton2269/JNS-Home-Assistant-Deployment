name: JNS HA-General Manual Target Native State Audit
on:
  push:
    branches: [main]
    paths: ['gateway/heating_manual_boost/runtime_states.request']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile gateway/heating_manual_boost/runtime_states.py
          python3 gateway/heating_manual_boost/runtime_states.py
