name: Kea Node A startup error capture
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kea4-ca-error-capture.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, nodec]
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          for spec in 'nodea 10.10.110.11 247' 'nodeb 10.10.110.12 248'; do
            set -- $spec
            echo "=== $1 ==="
            ssh -o HostName="$2" -o HostKeyAlias="$1.home.arpa" -o BatchMode=yes "$1" "pct exec $3 -- bash -s" <<'REMOTE'
          journalctl -u kea-ctrl-agent -n 32 --no-pager -o cat | tail -32
          systemctl is-active kea-ctrl-agent || true
          ss -ltnp | grep ':8000 ' || true
          ls -ld /run/kea /etc/kea/kea-api-password
          REMOTE
          done
