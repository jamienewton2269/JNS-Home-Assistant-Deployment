name: JNS Solar Node C HA900 Evidence Staging
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-nodec-ha900-evidence.yml'
      - 'gateway/solar/nodec_ha900_manifest_transfer_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-solar-ha900-evidence-transfer
  cancel-in-progress: false
jobs:
  secure-stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Copy pinned private metadata into isolated Node C staging; no deletions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/nodec_ha900_manifest_transfer_v1.py
          python3 gateway/solar/nodec_ha900_manifest_transfer_v1.py
