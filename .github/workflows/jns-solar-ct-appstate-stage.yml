name: JNS Solar MQTT Z2M Application Staging
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-ct-appstate-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-solar-ct-appstate-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Transfer checksum-verified, private CT state archives, no service cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ct_appstate_stage_nodea_v1.py
          python3 gateway/solar/ct_appstate_stage_nodea_v1.py
