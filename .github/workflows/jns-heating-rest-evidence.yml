name: JNS Heating REST Evidence (read-only, root token protected)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-heating-rest-evidence.yml'
      - 'gateway/heating_hallway/diagnose_ha_api_via_runner.py'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile gateway/heating_hallway/diagnose_ha_api_via_runner.py
      - name: Retrieve live evidence with existing protected token
        run: sudo -n python3 gateway/heating_hallway/diagnose_ha_api_via_runner.py
