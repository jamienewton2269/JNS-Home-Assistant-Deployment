name: JNS HA900 Node C Archive Readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha900-nodec-archive-readiness.yml'
      - 'gateway/solar/ha900_nodec_archive_readiness_20261025.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HA900 state, Node C VM909 and NFS staging capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha900_nodec_archive_readiness_20261025.py
          python3 gateway/solar/ha900_nodec_archive_readiness_20261025.py
