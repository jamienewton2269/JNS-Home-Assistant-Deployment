name: JNS Native Intercom Backup Recovery Preflight
on:
  push:
    branches: [main]
    paths:
      - 'gateway/doorbell/native-two-way-backup-preflight.request'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/doorbell/native-two-way-backup-preflight.py
      - run: python3 gateway/doorbell/native-two-way-backup-preflight.py
