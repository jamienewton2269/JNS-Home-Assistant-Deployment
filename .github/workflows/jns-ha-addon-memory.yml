name: JNS HA Addon Memory Footprint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-addon-memory.yml'
      - 'gateway/solar/ha_primary_general_addon_usage_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Categorise read-only Docker add-on RAM by HA guest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_primary_general_addon_usage_v1.py
          python3 gateway/solar/ha_primary_general_addon_usage_v1.py
