name: Fix Kea DHCP6 LXC service dependencies and start
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kea-dhcp6-fix-and-start.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - name: Fix lock directory dependency and config permissions on both nodes
        shell: bash
        run: |
          set -Eeuo pipefail
          for target in 'nodea 247' 'nodeb 248'; do
            set -- $target
            echo "=== $1 CT$2 ==="
            ssh -o BatchMode=yes -o ConnectTimeout=8 "$1" "pct exec $2 -- bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test -f /etc/kea/kea-dhcp6.conf
          kea-dhcp6 -t /etc/kea/kea-dhcp6.conf >/dev/null
          install -d -m 0755 /etc/systemd/system/kea-dhcp6-server.service.d
          cat > /etc/systemd/system/kea-dhcp6-server.service.d/10-lxc-lockdir.conf <<'EOF'
          [Service]
          Environment="KEA_LOCKFILE_DIR=/run/kea"
          RuntimeDirectory=
          RuntimeDirectory=kea
          EOF
          chown root:_kea /etc/kea/kea-dhcp6.conf
          chmod 0640 /etc/kea/kea-dhcp6.conf
          chmod 0750 /etc/kea
          chgrp _kea /etc/kea
          systemctl daemon-reload
          systemctl reset-failed kea-dhcp6-server.service || true
          if ! systemctl start kea-dhcp6-server; then
            systemctl status kea-dhcp6-server --no-pager -l || true
            journalctl -u kea-dhcp6-server -n 25 --no-pager || true
            exit 1
          fi
          sleep 2
          if ! systemctl is-active --quiet kea-dhcp6-server; then
            journalctl -u kea-dhcp6-server -n 25 --no-pager || true
            exit 1
          fi
          ss -lunp | grep ':547' || true
          systemctl enable kea-dhcp6-server >/dev/null
          echo 'KEA_DHCP6_RUNNING'
          systemctl is-active jns-dns radvd
          REMOTE
          done
