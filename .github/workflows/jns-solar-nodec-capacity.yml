name: JNS Solar Node C Storage Capacity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-nodec-capacity.yml'
      - 'gateway/solar/nodec_storage_capacity_readonly_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-solar-nodec-capacity
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Node C local storage only, without write operations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/nodec_storage_capacity_readonly_v1.py
          python3 gateway/solar/nodec_storage_capacity_readonly_v1.py
