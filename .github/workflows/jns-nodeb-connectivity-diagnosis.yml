name: JNS Node C to Node B Connectivity Diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-nodeb-connectivity-diagnosis.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Verify reachable Node B management address against trusted SSH host key
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=nodeb.home.arpa -o ConnectTimeout=5 root@10.10.110.12 'test "$(hostname -s)" = "nodeb" && echo NODEB_IDENTITY_VERIFIED'
