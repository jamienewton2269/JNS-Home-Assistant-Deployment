name: Repair HA-General clock MPD empty-password login
on:
  push:
    branches: [main]
    paths: ['house_audio_b/mpd_password_repair.request']
permissions:
  contents: read
concurrency:
  group: jns-ha905-mpd-auth-config-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Correct empty MPD password, preserve configuration and restart HA Core
        run: |
          set -euo pipefail
          bash -n house_audio_b/mpd_password_repair.sh
          bash house_audio_b/mpd_password_repair.sh