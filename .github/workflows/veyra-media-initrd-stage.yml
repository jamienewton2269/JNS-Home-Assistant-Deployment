name: Stage Veyra Media Recovery Initrd
on:
  push:
    branches: [main]
    paths:
      - 'gateway/trusted/veyra-media-initrd-stage-v092.sh'
      - '.github/workflows/veyra-media-initrd-stage.yml'
permissions: {contents: read}
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild candidate only, assert live PXE untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n gateway/trusted/veyra-media-initrd-stage-v092.sh
          R=/srv/veyra-pxe/http/veyra/v0.9.2
          before="$(sha256sum "$R/vmlinuz" "$R/initrd.gz" /srv/veyra-pxe/http/autoexec.ipxe)"
          DEST=$(mktemp -d /tmp/veyra-media-stage-XXXXXXXX)
          trap 'rm -rf "$DEST"' EXIT
          bash gateway/trusted/veyra-media-initrd-stage-v092.sh "$DEST"
          test -s "$DEST/initrd.gz"
          gzip -dc "$DEST/overlay.gz" | cpio -it 2>/dev/null > "$DEST/list"
          grep -Fq 'usr/lib/debian-installer-startup.d/S29veyra-media' "$DEST/list"
          grep -Eq 'modules/6.12.107\+deb13-amd64/kernel/drivers/net/ethernet/realtek/r8169.ko.xz' "$DEST/list"
          grep -Fxq 'preseed.cfg' "$DEST/list" || grep -Fxq './preseed.cfg' "$DEST/list"
          after="$(sha256sum "$R/vmlinuz" "$R/initrd.gz" /srv/veyra-pxe/http/autoexec.ipxe)"
          test "$before" = "$after"
          echo VEYRA_MEDIA_STAGE_VALIDATED_LIVE_BOOT_UNCHANGED
