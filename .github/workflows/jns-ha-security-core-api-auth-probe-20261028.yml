name: JNS Security Core API Authentication Route Readonly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-security-core-api-auth-probe-20261028.yml'
      - 'gateway/solar/ha_security_core_api_auth_probe_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/solar/ha_security_core_api_auth_probe_20261028.py
      - run: python3 gateway/solar/ha_security_core_api_auth_probe_20261028.py
