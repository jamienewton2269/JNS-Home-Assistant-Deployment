name: Verify Veyra Netboot Live Final2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-netboot-live-final2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Verify live generated netboot assets
        shell: bash
        run: |
          set -Eeuo pipefail
          REL=/srv/veyra-pxe/http/veyra/v0.9.2

          test -s "$REL/preseed.cfg"
          test -s "$REL/preseed-iso.cfg"
          test -s "$REL/veyra-payload.tar.gz"
          test -s "$REL/vmlinuz"
          test -s "$REL/initrd.gz"

          grep -Fq 'http://10.10.110.13:8098/veyra/v0.9.2/veyra-payload.tar.gz' "$REL/preseed.cfg"
          ! grep -Fq '/cdrom/veyra' "$REL/preseed.cfg"
          ! grep -Fq '10.10.10.236' "$REL/preseed.cfg"
          grep -Fq '/cdrom/veyra' "$REL/preseed-iso.cfg"

          tar -tzf "$REL/veyra-payload.tar.gz" > /tmp/veyra-payload.list
          grep -Fq 'veyra/scripts/install-debian.sh' /tmp/veyra-payload.list
          grep -Fq 'veyra/veyra/app.py' /tmp/veyra-payload.list
          grep -Fq 'veyra/browser-extension/manifest.json' /tmp/veyra-payload.list

          curl -fsSI http://127.0.0.1:8098/veyra/v0.9.2/veyra-payload.tar.gz >/dev/null
          curl -fsS http://127.0.0.1:8098/veyra/v0.9.2/preseed.cfg | grep -Fq 'veyra-payload.tar.gz'

          curl -fsS http://127.0.0.1:8098/autoexec.ipxe > /tmp/autoexec-final.ipxe
          grep -Fq 'goto bootfail' /tmp/autoexec-final.ipxe
          grep -Fq 'Veyra installer handoff FAILED' /tmp/autoexec-final.ipxe
          grep -Fq 'imgstat' /tmp/autoexec-final.ipxe
          grep -Fq 'choose --default shell --timeout 10000' /tmp/autoexec-final.ipxe
          ! grep -Fq 'sanboot --no-describe' /tmp/autoexec-final.ipxe

          ss -lun | grep -q ':67 '
          ss -lun | grep -q ':69 '
          ss -lun | grep -q ':4011 '
          ss -lnt | grep -q ':8098 '

          echo VEYRA_NETBOOT_LIVE_FINAL_VALID
