name: JNS Lux Repair Runtime Verify
on:
  push:
    branches: [main]
    paths: ['gateway/lux_repair/verify.request']
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/lux_repair/verify_runtime.py
