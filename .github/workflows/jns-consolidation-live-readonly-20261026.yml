name: JNS Consolidation Live Read-Only Preflight 2026-10-26
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-consolidation-live-readonly-20261026.yml'
      - 'gateway/solar/consolidation_live_preflight_20261026.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Audit VM906 agent, stopped Node C tools, VM903 and Guardian without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/consolidation_live_preflight_20261026.py
          python3 gateway/solar/consolidation_live_preflight_20261026.py
