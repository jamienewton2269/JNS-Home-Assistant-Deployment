name: Node C Veyra PXE Final Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-veyra-pxe-final-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Diagnose TFTP and PXE handoff
        shell: bash
        run: |
          set -u
          echo "=== SERVICES ==="
          systemctl is-active tftpd-hpa.service || true
          systemctl is-enabled tftpd-hpa.service || true
          systemctl is-active veyra-pxe-http.service || true
          systemctl is-enabled veyra-pxe-http.service || true
          echo "=== TFTP CONFIG ==="
          cat /etc/default/tftpd-hpa 2>/dev/null || true
          echo "=== TFTP PROCESS ==="
          ps -ef | grep '[i]n.tftpd' || true
          echo "=== TFTP ROOT ==="
          ls -ld /srv/veyra-pxe /srv/veyra-pxe/tftp 2>/dev/null || true
          ls -l /srv/veyra-pxe/tftp 2>/dev/null || true
          echo "=== TFTP JOURNAL ==="
          journalctl -u tftpd-hpa.service --no-pager -n 80 2>/dev/null || true
          echo "=== TFTP RRQ NODE IP ==="
          python3 - <<'PY'
          import socket, struct
          server=('10.10.110.13',69)
          req=struct.pack('!H',1)+b'snponly.efi\0octet\0'
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.settimeout(4)
          s.sendto(req,server)
          try:
              data,addr=s.recvfrom(2048)
              op=struct.unpack('!H',data[:2])[0]
              print(f'opcode={op} peer={addr} bytes={len(data)}')
              if op==3:
                  block=struct.unpack('!H',data[2:4])[0]
                  print(f'TFTP_RRQ_NODEIP_OK block={block} payload={len(data)-4}')
              elif op==5:
                  print('TFTP_ERROR', data[4:-1].decode(errors='replace'))
          except Exception as exc:
              print('TFTP_RRQ_NODEIP_FAIL',repr(exc))
          PY
          echo "=== FIREWALL HINTS ==="
          nft list ruleset 2>/dev/null | grep -Ei '69|tftp|udp' | head -120 || true
          echo "=== DHCP/PXE LOCAL LISTENERS ==="
          ss -lunp 2>/dev/null | grep -E ':(67|69|4011)[[:space:]]' || true
          echo "VEYRA_PXE_DIAGNOSTIC_COMPLETE"
