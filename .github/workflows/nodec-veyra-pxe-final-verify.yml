name: Node C Veyra PXE Final Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-veyra-pxe-final-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Verify live Veyra PXE service
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== SERVICES ==="
          systemctl is-active tftpd-hpa.service
          systemctl is-enabled tftpd-hpa.service
          systemctl is-active veyra-pxe-http.service
          systemctl is-enabled veyra-pxe-http.service
          echo "=== LISTENERS ==="
          ss -lun | grep -E '(^|:)69[[:space:]]'
          ss -lnt | grep -E ':8098[[:space:]]'
          echo "=== HTTP MENU ==="
          curl -fsS http://127.0.0.1:8098/autoexec.ipxe
          echo "=== CHECKSUM ==="
          curl -fsS http://127.0.0.1:8098/veyra/v0.9.2/Veyra-AutoInstall-v0.9.2.sha256
          echo "=== HTTP ISO SIZE ==="
          curl -fsSI http://127.0.0.1:8098/veyra/v0.9.2/Veyra-AutoInstall-v0.9.2.iso | grep -Ei 'HTTP/|Content-Length|Last-Modified'
          echo "=== TFTP RRQ ==="
          python3 - <<'PY'
          import socket, struct
          server=('127.0.0.1',69)
          req=struct.pack('!H',1)+b'snponly.efi\0octet\0'
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.settimeout(3)
          s.sendto(req,server)
          data,addr=s.recvfrom(2048)
          op=struct.unpack('!H',data[:2])[0]
          if op != 3:
              raise SystemExit(f'unexpected TFTP opcode {op}')
          block=struct.unpack('!H',data[2:4])[0]
          if block != 1 or len(data) <= 4:
              raise SystemExit('invalid first TFTP DATA packet')
          print(f'TFTP_RRQ_OK peer={addr[0]}:{addr[1]} first_block_bytes={len(data)-4}')
          PY
          echo "=== DHCP/PXE OWNERSHIP ==="
          ss -lunp 2>/dev/null | grep -E ':(67|4011)[[:space:]]' || echo "NODEC_NO_DHCP_OR_PROXYDHCP_LISTENER"
          echo "VEYRA_PXE_FINAL_SERVER_VERIFY_OK"
