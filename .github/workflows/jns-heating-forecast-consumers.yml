name: JNS Heating Forecast Consumer Read-only
on:
  push:
    branches:
      - 'dev/heating-thermal-learning-v035-20261024'
    paths:
      - 'gateway/heating/v0.3.5/forecast-consumers.request'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/heating/v0.3.5/forecast_consumer_audit.py
