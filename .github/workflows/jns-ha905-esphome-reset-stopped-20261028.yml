name: JNS HA905 ESPHome App Safe Reset After No-Secret Smoke
# Replace stopped cached v0.1.0 with catalog-confirmed v0.1.1; no VM changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-esphome-reset-stopped-20261028.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha905-security-preparation-only
  cancel-in-progress: false
jobs:
  reset:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate reset scripts before touching only temporary app
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha905_esphome_app_reset_after_smoke_20261028.py
          python3 -m py_compile gateway/solar/ha905_security_esphome_install_stopped_guarded_20261028.py
      - name: Uninstall expected-error app and reinstall verified stopped; preserve VM906
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 gateway/solar/ha905_esphome_app_reset_after_smoke_20261028.py
