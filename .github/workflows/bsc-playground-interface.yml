name: BSC playground interface inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-playground-interface.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-playground-interface-latest.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb 'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground && pct exec 272 -- sh -c "find /opt/beta -maxdepth 2 -type f -name \"*.py\" -o -name \"*.html\" -o -name \"*.js\"; systemctl show club-playground.service -p User -p Group; curl -fsS http://127.0.0.1:8766/healthz || true; grep -hE \"^[[:space:]]*(server_name|listen)[[:space:]]\" /etc/nginx/sites-enabled/* 2>/dev/null || true"'
          } > "$report" 2>&1
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record existing playground interface inventory"
          git push origin HEAD:main
