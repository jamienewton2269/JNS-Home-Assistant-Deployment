name: JNS HA Individual Addon RAM
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-individual-addon-ram.yml'
      - 'gateway/solar/ha_addon_individual_memory_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Measure Piper, Samba, SSH container RAM
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_addon_individual_memory_v1.py
          python3 gateway/solar/ha_addon_individual_memory_v1.py
