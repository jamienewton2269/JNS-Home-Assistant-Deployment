name: JNS Garden Post Restart Read-only Verification
on:
  push:
    branches: [main]
    paths:
      - 'gateway/garden_features/postrestart.request'
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - name: Inspect VM905 native restart status and dashboard HTTP
        shell: bash
        run: |
          set -u
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 root@nodeb.home.arpa)
          echo '=== CHECK NODE B ==='
          "${SSH[@]}" 'hostname -s; qm status 905' || true
          echo '=== ORIGINAL HA RESTART PROCESS ==='
          "${SSH[@]}" 'qm guest exec-status 905 779840' || true
          echo '=== HA CORE STATUS ==='
          "${SSH[@]}" 'timeout 40 qm guest exec 905 -- ha core info' || true
          echo '=== HA HTTP RESPONSE ==='
          curl -sS -o /dev/null -L --connect-timeout 5 --max-time 12 -w 'ha_general_http=%{http_code}\n' http://ha-general.home.arpa:8123/ || true
          echo '=== HA CORE CONTAINER ==='
          "${SSH[@]}" 'timeout 20 qm guest exec 905 -- docker ps --filter name=homeassistant --format "{{.Names}} {{.Status}}"' || true
