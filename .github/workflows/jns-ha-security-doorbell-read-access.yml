name: JNS HA-Security Doorbell Read Access Audit
on:
  push:
    branches: [main]
    paths: ['gateway/doorbell/ha-security-read-access.request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect permitted HA-Security guest access without changing state
        run: python3 gateway/doorbell/ha-security-read-access-audit.py
