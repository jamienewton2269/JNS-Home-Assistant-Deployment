name: JNS HA-Primary Native MQTT Area Add Only Activate
on:
  push:
    branches: [main]
    paths: ['gateway/area_presence/activate-areas.request']
permissions:
  contents: read
concurrency:
  group: jns-ha-primary-presence-areas
  cancel-in-progress: false
jobs:
  activate:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile gateway/area_presence/promote_vm902.py gateway/area_presence/activate_areas.py
          python3 gateway/area_presence/activate_areas.py
