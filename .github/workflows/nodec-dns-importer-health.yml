name: Node C DNS Importer Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-dns-importer-health.yml'

permissions:
  contents: read

jobs:
  health:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install through refreshed trusted gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/jns-gateway-exec "$GITHUB_WORKSPACE/gateway/queue/20261008T062000Z-dns-reservation-importer-final-06.json"

      - name: Verify Node C importer and primary DNS
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl is-active jns-dns-reservation-importer
          ss -ltn | grep -E '(^|:)8770[[:space:]]'
          curl -fsS --max-time 5 http://127.0.0.1:8770/health
          echo
          /usr/local/sbin/jns-dns-static-apply preview '[]'

      - name: Reversible AdGuard A and PTR smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          record='[{"mac":"02:00:00:00:00:01","ip":"192.0.2.123","name":"jns-dns-importer-test","fqdn":"jns-dns-importer-test.home.arpa"}]'

          cleanup() {
            echo "--- cleanup managed test rules ---"
            /usr/local/sbin/jns-dns-static-apply apply '[]' || true
          }
          trap cleanup EXIT

          echo "--- preview ---"
          /usr/local/sbin/jns-dns-static-apply preview "$record"

          echo "--- apply temporary test rule ---"
          /usr/local/sbin/jns-dns-static-apply apply "$record"
          sleep 1

          python3 - <<'PY'
          import socket,struct

          SERVER="10.10.10.247"

          def enc(name):
              return b"".join(bytes([len(p)])+p.encode() for p in name.rstrip(".").split("."))+b"\0"

          def read_name(data,off):
              labels=[]
              end=None
              seen=set()
              while True:
                  if off in seen:
                      raise RuntimeError("DNS compression loop")
                  seen.add(off)
                  n=data[off]
                  if n==0:
                      off+=1
                      if end is None: end=off
                      break
                  if n & 0xC0 == 0xC0:
                      ptr=((n & 0x3F)<<8)|data[off+1]
                      if end is None: end=off+2
                      off=ptr
                      continue
                  off+=1
                  labels.append(data[off:off+n].decode())
                  off+=n
              return ".".join(labels),end

          def query(name,qtype):
              pkt=struct.pack("!HHHHHH",0x4A4E,0x0100,1,0,0,0)+enc(name)+struct.pack("!HH",qtype,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
              s.settimeout(3)
              s.sendto(pkt,(SERVER,53))
              data,_=s.recvfrom(4096)
              s.close()
              _,flags,qd,an,_,_=struct.unpack("!HHHHHH",data[:12])
              if flags & 0xF:
                  return []
              off=12
              for _ in range(qd):
                  _,off=read_name(data,off)
                  off+=4
              out=[]
              for _ in range(an):
                  _,off=read_name(data,off)
                  typ,cls,ttl,rdlen=struct.unpack("!HHIH",data[off:off+10])
                  off+=10
                  rstart=off
                  if typ==1 and rdlen==4:
                      out.append(socket.inet_ntoa(data[rstart:rstart+4]))
                  elif typ==12:
                      val,_=read_name(data,rstart)
                      out.append(val.rstrip("."))
                  off=rstart+rdlen
              return out

          a=query("jns-dns-importer-test.home.arpa",1)
          ptr=query("123.2.0.192.in-addr.arpa",12)
          print("A answers:",a)
          print("PTR answers:",ptr)
          assert "192.0.2.123" in a, a
          assert "jns-dns-importer-test.home.arpa" in ptr, ptr
          print("SMOKE_TEST_APPLY_OK")
          PY

          cleanup
          trap - EXIT
          sleep 1

          python3 - <<'PY'
          import socket,struct

          SERVER="10.10.10.247"
          def enc(name):
              return b"".join(bytes([len(p)])+p.encode() for p in name.rstrip(".").split("."))+b"\0"
          def read_name(data,off):
              labels=[]; end=None; seen=set()
              while True:
                  if off in seen: raise RuntimeError("DNS compression loop")
                  seen.add(off); n=data[off]
                  if n==0:
                      off+=1; end=off if end is None else end; break
                  if n & 0xC0 == 0xC0:
                      ptr=((n & 0x3F)<<8)|data[off+1]
                      end=off+2 if end is None else end
                      off=ptr; continue
                  off+=1; labels.append(data[off:off+n].decode()); off+=n
              return ".".join(labels),end
          def answers(name,qtype):
              pkt=struct.pack("!HHHHHH",0x4A4F,0x0100,1,0,0,0)+enc(name)+struct.pack("!HH",qtype,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3)
              s.sendto(pkt,(SERVER,53)); data,_=s.recvfrom(4096); s.close()
              _,flags,qd,an,_,_=struct.unpack("!HHHHHH",data[:12]); off=12; out=[]
              for _ in range(qd):
                  _,off=read_name(data,off); off+=4
              for _ in range(an):
                  _,off=read_name(data,off)
                  typ,cls,ttl,rdlen=struct.unpack("!HHIH",data[off:off+10]); off+=10; rstart=off
                  if typ==1 and rdlen==4: out.append(socket.inet_ntoa(data[rstart:rstart+4]))
                  elif typ==12:
                      val,_=read_name(data,rstart); out.append(val.rstrip("."))
                  off=rstart+rdlen
              return out
          a=answers("jns-dns-importer-test.home.arpa",1)
          ptr=answers("123.2.0.192.in-addr.arpa",12)
          print("A after cleanup:",a)
          print("PTR after cleanup:",ptr)
          assert "192.0.2.123" not in a
          assert "jns-dns-importer-test.home.arpa" not in ptr
          print("SMOKE_TEST_ROLLBACK_OK")
          PY
