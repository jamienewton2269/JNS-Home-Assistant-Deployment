name: JNS Steward Lux V2 Preflight (No Token)
on:
  push:
    branches: [main]
    paths:
      - 'gateway/lux_manual_override/steward-v2-preflight.request'
permissions:
  contents: read
concurrency:
  group: jns-ha905-lux-manual-v2
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check Steward handler and Lux V2 plan, without changes
        run: |
          set -euo pipefail
          python3 -m py_compile natural_automation_steward/ops/ha_general_reload_capability.py gateway/lux_manual_override/patch_v2_vm905.py gateway/lux_manual_override/deploy_v2_steward.py gateway/lux_manual_override/rollback_v2_vm905.py
          python3 gateway/lux_manual_override/runner_v2.py --dry-run
