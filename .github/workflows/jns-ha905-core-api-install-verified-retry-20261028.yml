name: JNS HA905 Guarded Read-Only Core API Verified Retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-core-api-install-verified-retry-20261028.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha905-one-time-api-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compile reviewed installer
        run: python3 -m py_compile gateway/solar/ha905_api_bridge_install_once_guarded_20261028.py
      - name: Verify app with offline fake-token tests
        run: python3 gateway/solar/ha905_core_api_bridge_app/test_probe.py -v
      - name: Guarded one-time read-only VM905 Core API access test
        run: python3 gateway/solar/ha905_api_bridge_install_once_guarded_20261028.py
