name: BSC Joomla PHP syntax validation (isolated)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bsc-joomla-php-lint-isolated.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-source:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Export tracked PHP source only from clean Node C checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = nodec
          cd /opt/bsc-joomla-membership
          test -z "$(git -c safe.directory="$PWD" status --porcelain)"
          mkdir -p "$RUNNER_TEMP/bsc-php-source"
          git -c safe.directory="$PWD" ls-files -z -- krystal plugins tests |
            while IFS= read -r -d '' file; do
              case "$file" in
                *.php|*.json)
                  test -f "$file"
                  mkdir -p "$RUNNER_TEMP/bsc-php-source/$(dirname "$file")"
                  cp -- "$file" "$RUNNER_TEMP/bsc-php-source/$file"
                  ;;
              esac
            done
          count=$(find "$RUNNER_TEMP/bsc-php-source" -name '*.php' -type f | wc -l)
          test "$count" -gt 0
          echo "Tracked PHP files exported: $count"
      - uses: actions/upload-artifact@v4
        with:
          name: bsc-php-source-only
          path: ${{ runner.temp }}/bsc-php-source/
          retention-days: 1
          if-no-files-found: error

  php-lint:
    needs: stage-source
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: bsc-php-source-only
          path: php-source
      - name: Verify PHP source syntax without deployment
        id: lint
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          php -v | head -n 2 > "$RUNNER_TEMP/bsc-php-lint.txt" 2>&1
          count=0
          failures=0
          while IFS= read -r -d '' file; do
            if php -l "$file" >> "$RUNNER_TEMP/bsc-php-lint.txt" 2>&1; then
              count=$((count + 1))
            else
              failures=$((failures + 1))
            fi
          done < <(find php-source -type f -name '*.php' -print0)
          set -e
          {
            echo "PHP_SYNTAX_PASS_COUNT=$count"
            echo "PHP_SYNTAX_FAIL_COUNT=$failures"
            echo "NO_DEPLOYMENT_NO_DATABASE_ACCESS"
          } | tee -a "$RUNNER_TEMP/bsc-php-lint.txt"
          test "$count" -gt 0
          test "$failures" -eq 0
      - name: Diagnose synthetic test prerequisites from source
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "=== Synthetic verifier test source ==="
            sed -n '1,125p' php-source/krystal/test-synthetic-verifier.php
            echo "=== Portal adapter test source ==="
            sed -n '1,125p' php-source/krystal/test-portal-adapter-synthetic.php
            echo "=== Tracked fixture file inventory ==="
            find php-source -type f | sort
          } > "$RUNNER_TEMP/bsc-php-prerequisites.txt"
      - name: Execute isolated PHP synthetic security fixtures
        id: fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          cd php-source/krystal
          : > "$RUNNER_TEMP/bsc-php-fixtures.txt"
          failures=0
          for script in test-synthetic-verifier.php test-member-intake.php; do
            echo "=== $script ===" | tee -a "$RUNNER_TEMP/bsc-php-fixtures.txt"
            args=()
            if test "$script" = test-synthetic-verifier.php; then
              args=(synthetic-unicode-fixture.json)
            fi
            if php "$script" "${args[@]}" >> "$RUNNER_TEMP/bsc-php-fixtures.txt" 2>&1; then
              echo "SCRIPT_EXIT_$script=0" | tee -a "$RUNNER_TEMP/bsc-php-fixtures.txt"
            else
              rc=$?
              echo "SCRIPT_EXIT_$script=$rc" | tee -a "$RUNNER_TEMP/bsc-php-fixtures.txt"
              failures=$((failures + 1))
            fi
          done
          if grep -q 'Synthetic fixture missing' "$RUNNER_TEMP/bsc-php-fixtures.txt"; then
            echo "MISSING_FIXTURE_DETECTED" | tee -a "$RUNNER_TEMP/bsc-php-fixtures.txt"
            failures=$((failures + 1))
          fi
          echo "PORTAL_ADAPTER_TEST=NOT_RUN_REQUIRES_DISPOSABLE_MYSQL" | tee -a "$RUNNER_TEMP/bsc-php-fixtures.txt"
          cat "$RUNNER_TEMP/bsc-php-fixtures.txt"
          echo "PHP_SYNTHETIC_FAILURE_COUNT=$failures" | tee -a "$RUNNER_TEMP/bsc-php-fixtures.txt"
          test "$failures" -eq 0
      - name: Publish PHP syntax receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p gateway/receipts
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "php_lint_step=${{ steps.lint.outcome }}"
            echo "php_fixtures_step=${{ steps.fixtures.outcome }}"
            if test -f "$RUNNER_TEMP/bsc-php-lint.txt"; then
              tail -n 35 "$RUNNER_TEMP/bsc-php-lint.txt"
            else
              echo "PHP_LINT_NOT_EXECUTED"
            fi
            if test -f "$RUNNER_TEMP/bsc-php-prerequisites.txt"; then
              echo "=== Test prerequisites ==="
              head -n 265 "$RUNNER_TEMP/bsc-php-prerequisites.txt"
            fi
            if test -f "$RUNNER_TEMP/bsc-php-fixtures.txt"; then
              echo "=== Synthetic fixture output ==="
              tail -n 45 "$RUNNER_TEMP/bsc-php-fixtures.txt"
            fi
          } > gateway/receipts/bsc-php-lint-latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/receipts/bsc-php-lint-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record isolated BSC PHP syntax results"
            git push origin HEAD:main
          fi
