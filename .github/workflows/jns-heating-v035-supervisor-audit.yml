name: JNS Heating v0.3.5 Local Supervisor Runtime Audit
on:
  push:
    branches: ['dev/heating-thermal-learning-v035-20261024']
    paths:
      - 'gateway/heating/v0.3.5/supervisor-audit.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read essential VM905 thermostat states inside trusted SSH add-on
        run: python3 gateway/heating/v0.3.5/live_supervisor_audit.py
