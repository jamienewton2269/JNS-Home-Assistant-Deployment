name: JNS Hallway predictive source and manual priority CI
on:
  pull_request:
    paths: ['gateway/heating_presence/**','gateway/heating_hallway/test_current_authority.py','.github/workflows/jns-hallway-predictive-source-ci.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML==6.0.3 Jinja2==3.1.6
      - run: python -m unittest discover -s gateway/heating_hallway -p test_current_authority.py -v
      - run: python -m unittest discover -s gateway/heating_manual_boost -p test_manual_priority.py -v
