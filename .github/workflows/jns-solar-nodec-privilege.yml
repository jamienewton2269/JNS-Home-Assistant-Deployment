name: JNS Solar Node C Privilege Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-nodec-privilege.yml'
      - 'gateway/solar/nodec_authorization_readonly_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/nodec_authorization_readonly_v1.py
          python3 gateway/solar/nodec_authorization_readonly_v1.py
