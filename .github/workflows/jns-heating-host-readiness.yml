name: JNS Heating HAOS and Recorder Readiness
on:
  push:
    branches:
      - 'dev/heating-thermal-learning-v035-20261024'
    paths:
      - 'gateway/heating/v0.3.5/host_readiness.request'
permissions:
  contents: read
jobs:
  health:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read-only HA Core and recorder health on VM905
        run: python3 gateway/heating/v0.3.5/host_readiness.py
