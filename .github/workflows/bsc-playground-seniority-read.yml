name: CT272 seniority read interface
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsc-playground-seniority-read.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -eu
          test "$(hostname -s)" = nodec
          mkdir -p gateway/receipts
          report=gateway/receipts/bsc-playground-seniority-read-latest.txt
          set +e
          bash -euo pipefail <<'DEPLOY' > "$report" 2>&1
          remote() { ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodeb "$@"; }
          remote 'test "$(pct config 272 | sed -n "s/^hostname: //p")" = club-manager-playground'
          python3 -m py_compile club-manager/beta/read_api.py
          if command -v node >/dev/null; then node --check club-manager/beta/static/browser.js; fi
          remote 'pct exec 272 -- sh -ec "umask 077; mkdir -p /root/bsc-read-backup; runuser -u postgres -- pg_dump -Fc club_manager > /root/bsc-read-backup/db.dump; pg_restore -l /root/bsc-read-backup/db.dump >/dev/null; cp -p /opt/beta/read_api.py /root/bsc-read-backup/; cp -p /opt/beta/static/browser.js /root/bsc-read-backup/"'
          remote 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' < club-manager/migrations/026_seniority_read_projection.sql
          remote 'pct exec 272 -- runuser -u postgres -- psql -X -v ON_ERROR_STOP=1 -d club_manager' <<'SQL'
          GRANT EXECUTE ON FUNCTION club.api_seniority_for_officer(text) TO clubbeta;
          DO $$ BEGIN
            BEGIN
              PERFORM club.api_seniority_for_officer('invalid');
              RAISE EXCEPTION 'Unauthorised read accepted';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PASS: unauthorised read rejected';
            END;
          END $$;
          SQL
          for file in read_api.py static/browser.js; do
            remote "pct exec 272 -- sh -ec 'cat > /opt/beta/$file.new; chmod 644 /opt/beta/$file.new; mv /opt/beta/$file.new /opt/beta/$file'" < "club-manager/beta/$file"
          done
          if ! remote 'pct exec 272 -- systemctl restart club-playground.service && pct exec 272 -- python3 -c "import time,urllib.request; time.sleep(2); print(urllib.request.urlopen(\"http://127.0.0.1:8766/healthz\",timeout=5).status)"'; then
            remote 'pct exec 272 -- sh -ec "cp -p /root/bsc-read-backup/read_api.py /opt/beta/; cp -p /root/bsc-read-backup/browser.js /opt/beta/static/; systemctl restart club-playground.service"'
            exit 1
          fi
          remote 'pct exec 272 -- python3 -' <<'PY'
          import urllib.request,urllib.error
          req=urllib.request.Request('http://127.0.0.1:8766/api/v1/seniority',headers={'Host':'club-manager-playground.home.arpa'})
          try:
              urllib.request.urlopen(req,timeout=5)
          except urllib.error.HTTPError as e:
              assert e.code==401,e.code
              print('PASS: HTTP read requires officer session')
          else:
              raise RuntimeError('Unauthenticated read accepted')
          PY
          DEPLOY
          rc=$?
          set -e
          echo "deployment_exit=$rc" >> "$report"
          cat "$report"
          git config user.name bsc-nodec-check
          git config user.email bsc-nodec-check@users.noreply.github.com
          git add "$report"
          git commit -m "Record CT272 seniority read deployment"
          git push origin HEAD:main
          exit "$rc"
