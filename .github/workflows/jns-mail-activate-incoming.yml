name: JNS mail activate incoming
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jns-mail-activate-incoming.yml']
permissions:
  contents: read
jobs:
  activate:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 mail_server/activate_jnsystems_mx.py
  external-delivery:
    needs: activate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public MX and deliver test message from the Internet
        run: |
          python3 -u - <<'PY'
          import json,urllib.request,urllib.parse,time,smtplib
          from email.message import EmailMessage
          domain="jnsystems.xyz";target="jnsystems.freeddns.org"
          def mx():
              req=urllib.request.Request("https://cloudflare-dns.com/dns-query?"+urllib.parse.urlencode({"name":domain,"type":"MX"}),headers={"accept":"application/dns-json"})
              data=json.load(urllib.request.urlopen(req,timeout=10))
              return [r["data"] for r in data.get("Answer",[]) if r.get("type")==15]
          answers=[]
          for attempt in range(12):
              answers=mx()
              if answers==["10 "+target+"."]:break
              time.sleep(5)
          print("PUBLIC_MX",answers)
          assert answers==["10 "+target+"."],"Public resolver still has old MX; retry after cache expiry"
          msg=EmailMessage()
          msg["From"]="postmaster@jnsystems.xyz"
          msg["To"]="jamie@jnsystems.xyz"
          msg["Subject"]="JNS incoming mail Internet test"
          msg["Message-ID"]="<jns-mx-activation-20261105@jnsystems.xyz>"
          msg.set_content("Incoming mail commissioning test sent from an independent Internet-hosted runner after the MX change. No reply is needed.")
          with smtplib.SMTP(target,25,timeout=20) as smtp:
              smtp.ehlo("jns-internet-probe.home.arpa")
              refused=smtp.send_message(msg)
              assert not refused
          print("PASS_EXTERNAL_MESSAGE_ACCEPTED <jns-mx-activation-20261105@jnsystems.xyz>")
          PY
  mailbox-confirmation:
    needs: external-delivery
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 2
    steps:
      - name: Confirm Internet test in Jamie mailbox
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 250 -- bash -se' <<'GUEST'
          set -euo pipefail
          for attempt in $(seq 1 15); do
            result="$(doveadm search -u jamie@jnsystems.xyz HEADER Message-ID '<jns-mx-activation-20261105@jnsystems.xyz>')"
            if test -n "$result"; then printf 'PASS_MAILBOX_DELIVERY %s\n' "$result"; exit 0; fi
            sleep 2
          done
          echo 'Mailbox delivery not yet confirmed'; exit 1
          GUEST
