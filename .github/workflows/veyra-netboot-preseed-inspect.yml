name: Inspect Veyra Netboot Preseed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-netboot-preseed-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Inspect served preseed and installer assumptions
        shell: bash
        run: |
          set -u
          echo "=== PRESEED ==="
          cat /srv/veyra-pxe/http/veyra/v0.9.2/preseed.cfg 2>/dev/null || true
          echo "=== MEDIA REFERENCES ==="
          grep -RniE '/cdrom|/veyra|late_command|in-target|wget|curl|http://|mount'             /srv/veyra-pxe/http/veyra/v0.9.2/preseed.cfg             /root/veyra-v0.9/source071/veyra/installer             /root/veyra-v0.9/source071 2>/dev/null | head -500 || true
          echo "VEYRA_NETBOOT_PRESEED_INSPECT_COMPLETE"
