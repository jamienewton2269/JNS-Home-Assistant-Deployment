name: Management Bridge CI

on:
  push:
    branches:
      - management-bridge
    paths:
      - "management_bridge/**"
      - ".github/workflows/management-bridge-ci.yml"
  pull_request:
    paths:
      - "management_bridge/**"
      - ".github/workflows/management-bridge-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile management_bridge/server.py management_bridge/selftest.py
      - name: Shell syntax
        run: bash -n management_bridge/install.sh management_bridge/start_temp_tunnel.sh management_bridge/stop_temp_tunnel.sh
      - name: Functional self-test
        run: python management_bridge/selftest.py
