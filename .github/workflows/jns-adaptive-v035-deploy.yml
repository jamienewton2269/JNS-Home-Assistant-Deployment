name: Adaptive Intelligence v0.3.5 Guarded HA-General Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-adaptive-v035-deploy.yml'
      - 'gateway/adaptive/deploy_adaptive_v035.py'
permissions: {contents: read}
concurrency:
  group: jns-adaptive-intelligence-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile gateway/adaptive/deploy_adaptive_v035.py
      - run: python3 gateway/adaptive/deploy_adaptive_v035.py
