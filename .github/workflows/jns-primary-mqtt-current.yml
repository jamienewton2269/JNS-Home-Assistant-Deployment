name: JNS Primary MQTT Configured Check
on:
  push:
    branches: [main]
    paths: ['gateway/area_presence/confirmed.request']
permissions:
  contents: read
jobs:
  current:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/area_presence/confirmed_check.py
