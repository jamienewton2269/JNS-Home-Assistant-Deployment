name: JNS Welcome Home Existing Authorised API Audit
on:
  push:
    branches: [main]
    paths:
      - 'gateway/arrival_lighting/authcheck.request'
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/arrival_lighting/authcheck.py
