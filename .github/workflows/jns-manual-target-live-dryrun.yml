name: JNS HA-General Manual Target Live Dry-run
on:
  push:
    branches: [main]
    paths: ['gateway/heating_manual_boost/release_preflight.request']
permissions: {contents: read}
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate package parser and production package hash without writes
        run: |
          set -euo pipefail
          python3 -m py_compile gateway/heating_manual_boost/release_vm905.py
          python3 -m py_compile gateway/heating_presence/deploy.py
          python3 gateway/heating_manual_boost/release_vm905.py
