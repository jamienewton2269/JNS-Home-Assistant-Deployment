name: JNS Guardian Retirement Dependency Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-guardian-retirement-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect old Guardian unit consumers without changing services
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/legacy_guardian_retirement_safety_v1.py
          python3 gateway/solar/legacy_guardian_retirement_safety_v1.py
