name: Honeywell manual setpoint precedence CI
on:
  pull_request:
    paths:
      - 'gateway/heating_manual_boost/**'
      - 'gateway/heating_presence/**'
      - '.github/workflows/jns-honeywell-manual-setpoint-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 Jinja2==3.1.6
      - run: python -m unittest discover -s gateway/heating_manual_boost -p 'test_*.py' -v
