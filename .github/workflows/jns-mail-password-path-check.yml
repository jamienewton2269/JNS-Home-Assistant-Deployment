name: JNS mail password command path check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jns-mail-password-path-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 2
    steps:
      - shell: bash
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 250 -- bash -se' <<'GUEST'
          set -euo pipefail
          hostname
          ls -l /usr/local/sbin/jns-mail-password
          /usr/local/sbin/jns-mail-password --help
          echo '=== ROOT LOGIN PATH ==='
          bash -lc 'printf "%s\n" "$PATH"; command -v jns-mail-password || true'
          echo '=== INSTALLED SYSTEM ALIAS ==='
          if test ! -e /usr/bin/jns-mail-password; then ln -s /usr/local/sbin/jns-mail-password /usr/bin/jns-mail-password; fi
          /usr/bin/jns-mail-password --help
          GUEST
