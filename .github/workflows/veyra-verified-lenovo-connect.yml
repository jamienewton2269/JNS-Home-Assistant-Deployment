name: VEYRA verified Lenovo SSH and privilege check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-verified-lenovo-connect.yml'
permissions: {contents: read}
jobs:
  trust-and-read:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - name: Verify known fingerprint before any SSH login
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=veyra.home.arpa
          EXPECT='SHA256:z+E4aqDK9CIFktbLAtHryd6qJAjqhh8uqga5Nkj7ls4'
          work=$(mktemp -d)
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          timeout -k 2s 15s ssh-keyscan -T 5 -t ed25519 "$TARGET" 2>/dev/null > "$work/known_hosts"
          test -s "$work/known_hosts"
          count=$(awk '$2=="ssh-ed25519" {n++} END {print n+0}' "$work/known_hosts")
          test "$count" -eq 1 || { echo "ABORT: ambiguous ED25519 host key"; exit 2; }
          actual=$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '$2 ~ /^SHA256:/ {print $2;exit}')
          echo "Presented host fingerprint: $actual"
          test "$actual" = "$EXPECT" || { echo "ABORT: host fingerprint differs from locally verified Lenovo key"; exit 3; }
          echo "PASS: verified Lenovo host key before SSH"
          chmod 600 "$work/known_hosts"
          for key in "$HOME/.ssh/jns-veyra-nodec-ed25519"; do
            if [[ ! -f "$key" ]]; then echo "IDENTITY_MISSING: $(basename "$key")"; continue; fi
            echo "TEST_IDENTITY: $(basename "$key")"
            if timeout -k 2s 16s ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
              -o ConnectTimeout=6 -o ConnectionAttempts=1 \
              "jnsadmin@$TARGET" 'echo VEYRA_OBS_AV_QUALITY_AUDIT; hostname; date; echo OBS_QA_FILES; namei -l /opt/veyra/obs-backend-v1/av-qa-v11/buffer 2>&1 | tail -12; find /opt/veyra/obs-backend-v1/av-qa-v11/buffer -maxdepth 1 -type f -printf "%f %s bytes\n" 2>&1 | head -8; echo ACCESS_CHECK; for f in /opt/veyra/obs-backend-v1/av-qa-v11/logs/obs-console.log /opt/veyra/obs-backend-v1/av-qa-v11/logs/mpv.log; do if test -r "$f"; then echo "READABLE $f"; else echo "NO_ACCESS $f"; fi; done; echo FFMPEG_AND_X93; ps -eo pid,ppid,user,stat,etime,args | grep -E "[X]vfb :9(2|3)|[o]bs --multi|[m]pv --no-config|[f]fmpeg -hide_banner" | cut -c 1-210 | head -10; echo SERVICE; for s in veyra-kiosk.service veyra-virtual-loopback-v01.service veyra-itvx-vnc-v01.service; do echo "$s=$(systemctl is-active "$s" 2>/dev/null)"; done; echo MARKER; ls -l /run/veyra-obs-av-v11.recovery 2>&1 || true; echo COMPLETE' ; then
              echo "VEYRA_REMOTE_ACCESS_PASS: $(basename "$key")"
              exit 0
            else
              echo "AUTH_NOT_AVAILABLE: $(basename "$key")"
            fi
          done
          echo "VEYRA_REMOTE_ACCESS_NEEDS_AUTHORISED_KEY"
          exit 0
