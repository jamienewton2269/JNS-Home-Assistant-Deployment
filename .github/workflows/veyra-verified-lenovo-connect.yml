name: VEYRA verified Lenovo SSH and privilege check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-verified-lenovo-connect.yml'
permissions: {contents: read}
jobs:
  trust-and-read:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - name: Verify known fingerprint before any SSH login
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=veyra.home.arpa
          EXPECT='SHA256:z+E4aqDK9CIFktbLAtHryd6qJAjqhh8uqga5Nkj7ls4'
          work=$(mktemp -d)
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          timeout -k 2s 15s ssh-keyscan -T 5 -t ed25519 "$TARGET" 2>/dev/null > "$work/known_hosts"
          test -s "$work/known_hosts"
          count=$(awk '$2=="ssh-ed25519" {n++} END {print n+0}' "$work/known_hosts")
          test "$count" -eq 1 || { echo "ABORT: ambiguous ED25519 host key"; exit 2; }
          actual=$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '$2 ~ /^SHA256:/ {print $2;exit}')
          echo "Presented host fingerprint: $actual"
          test "$actual" = "$EXPECT" || { echo "ABORT: host fingerprint differs from locally verified Lenovo key"; exit 3; }
          echo "PASS: verified Lenovo host key before SSH"
          chmod 600 "$work/known_hosts"
          for key in "$HOME/.ssh/jns-veyra-nodec-ed25519"; do
            if [[ ! -f "$key" ]]; then echo "IDENTITY_MISSING: $(basename "$key")"; continue; fi
            echo "TEST_IDENTITY: $(basename "$key")"
            if timeout -k 2s 16s ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
              -o ConnectTimeout=6 -o ConnectionAttempts=1 \
              "jnsadmin@$TARGET" 'echo VEYRA_V078_AUDIT; hostname; date; echo SERVICE_STATES; for u in veyra-kiosk.service veyra-virtual-loopback-v01.service veyra-itvx-vnc-v01.service veyra-tv-v075.service veyra-tv-v076.service veyra-tv-v077.service veyra-tv-v078.service; do echo "$u=$(systemctl is-active "$u" 2>/dev/null || true)"; done; echo ENCODER_LOG; if test -f /opt/veyra/virtual-loopback-v01/tee-test-v078/encoder.log; then tr "\r" "\n" < /opt/veyra/virtual-loopback-v01/tee-test-v078/encoder.log | tail -75 | cut -c 1-220; else echo MISSING_ENCODER_LOG; fi; echo SESSION_LOG; if test -f /opt/veyra/virtual-loopback-v01/tee-test-v078/session.log; then tail -35 /opt/veyra/virtual-loopback-v01/tee-test-v078/session.log | cut -c 1-220; else echo MISSING_SESSION_LOG; fi; echo RECOVERY_MARKER; if test -s /run/veyra-tv-v078/recorder.pid; then echo PENDING_RECOVERY; else echo NO_MARKER; fi; echo RING_LEFTOVERS; find /opt/veyra/virtual-loopback-v01/tee-test-v078/segments -maxdepth 1 -type f -name 'segment???.ts' 2>/dev/null | wc -l; echo ORIGINAL_RECORDER; ps -C ffmpeg -o pid,user,pcpu,stat,etime,args | cut -c 1-195 | head -8; echo LOAD; uptime; echo AUDIT_END' ; then
              echo "VEYRA_REMOTE_ACCESS_PASS: $(basename "$key")"
              exit 0
            else
              echo "AUTH_NOT_AVAILABLE: $(basename "$key")"
            fi
          done
          echo "VEYRA_REMOTE_ACCESS_NEEDS_AUTHORISED_KEY"
          exit 0
