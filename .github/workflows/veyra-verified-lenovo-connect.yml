name: VEYRA verified Lenovo SSH and privilege check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-verified-lenovo-connect.yml'
permissions: {contents: read}
jobs:
  trust-and-read:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - name: Verify known fingerprint before any SSH login
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=veyra.home.arpa
          EXPECT='SHA256:z+E4aqDK9CIFktbLAtHryd6qJAjqhh8uqga5Nkj7ls4'
          work=$(mktemp -d)
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          timeout -k 2s 15s ssh-keyscan -T 5 -t ed25519 "$TARGET" 2>/dev/null > "$work/known_hosts"
          test -s "$work/known_hosts"
          count=$(awk '$2=="ssh-ed25519" {n++} END {print n+0}' "$work/known_hosts")
          test "$count" -eq 1 || { echo "ABORT: ambiguous ED25519 host key"; exit 2; }
          actual=$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '$2 ~ /^SHA256:/ {print $2;exit}')
          echo "Presented host fingerprint: $actual"
          test "$actual" = "$EXPECT" || { echo "ABORT: host fingerprint differs from locally verified Lenovo key"; exit 3; }
          echo "PASS: verified Lenovo host key before SSH"
          chmod 600 "$work/known_hosts"
          for key in "$HOME/.ssh/jns-veyra-nodec-ed25519"; do
            if [[ ! -f "$key" ]]; then echo "IDENTITY_MISSING: $(basename "$key")"; continue; fi
            echo "TEST_IDENTITY: $(basename "$key")"
            if timeout -k 2s 16s ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
              -o ConnectTimeout=6 -o ConnectionAttempts=1 \
              "jnsadmin@$TARGET" 'echo VEYRA_OBS_CAPABILITY_AUDIT; hostname; date; echo OBS_INSTALL_STATE; command -v obs || true; echo PACKAGE_DRY_RUN; apt-get -s install --no-install-recommends obs-studio obs-plugins gstreamer1.0-tools gstreamer1.0-plugins-bad gstreamer1.0-plugins-good 2>&1 | grep -E "^(The following|[0-9]+ upgraded|Inst obs-studio|Inst obs-plugins|Inst gstreamer|Remv|E:)" | head -35; echo DISPLAY_92_STATE; ls -l /tmp/.X11-unix/X92 2>/dev/null; echo GLX_EXTENSIONS; DISPLAY=:92 xdpyinfo -queryExtensions 2>&1 | grep -iE "GLX|MIT-SHM|name of display|unable to open" | head -15; echo GL_RENDERER; if command -v glxinfo >/dev/null; then DISPLAY=:92 glxinfo -B 2>&1 | grep -E "OpenGL renderer|OpenGL core profile version|OpenGL version|Error|error" | head -16; else echo GLXINFO_NOT_INSTALLED; fi; echo SRT_PORT; ss -lnup 2>/dev/null | grep :23600 || true; echo CURRENT_SERVICES; systemctl is-active veyra-kiosk.service veyra-virtual-loopback-v01.service veyra-itvx-vnc-v01.service; echo ORIGINAL_RECORDER; ps -C ffmpeg -o pid,user,stat,pcpu,args | head -5 | cut -c 1-185; echo OBS_AUDIT_END' ; then
              echo "VEYRA_REMOTE_ACCESS_PASS: $(basename "$key")"
              exit 0
            else
              echo "AUTH_NOT_AVAILABLE: $(basename "$key")"
            fi
          done
          echo "VEYRA_REMOTE_ACCESS_NEEDS_AUTHORISED_KEY"
          exit 0
