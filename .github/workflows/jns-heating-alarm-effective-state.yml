name: JNS Heating Effective Alarm State Verification
on:
  push:
    branches: [main]
    paths: ['gateway/heating_presence/effective-state.request']
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile gateway/heating_presence/effective_state.py
          python3 gateway/heating_presence/effective_state.py
