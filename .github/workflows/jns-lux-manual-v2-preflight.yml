name: JNS Lux Manual OFF V2 Guarded Preflight
on:
  push:
    branches: [main]
    paths:
      - 'gateway/lux_manual_override/v2-preflight.request'
permissions:
  contents: read
concurrency:
  group: jns-ha905-lux-manual-v2
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch and read-only VM905 dry run
        run: |
          set -euo pipefail
          python3 -m py_compile gateway/lux_manual_override/patch_v2_vm905.py gateway/lux_manual_override/runner_v2.py
          python3 gateway/lux_manual_override/runner_v2.py --dry-run
