name: JNS mail password helper
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jns-mail-password-helper.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install private interactive password helper
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 250 -- bash -c "umask 077; cat > /usr/local/sbin/jns-mail-password; chmod 700 /usr/local/sbin/jns-mail-password"' < mail_server/change_mail_password.py
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@nodea.home.arpa 'pct exec 250 -- python3 -' <<'PY'
          import pathlib,subprocess
          source=pathlib.Path("/usr/local/sbin/jns-mail-password").read_text()
          compile(source,"jns-mail-password","exec")
          rows=pathlib.Path("/etc/dovecot/jns-users").read_text().splitlines()
          names=[line.split(":",1)[0] for line in rows]
          for user in ["jamie@jnsystems.xyz","jamie@sailing-uk.org"]:
              assert names.count(user)==1
              print("PASS existing mailbox",user)
          subprocess.run(["/usr/local/sbin/jns-mail-password","--help"],check=True)
          print("PASS password helper installed; no password changed")
          PY
