name: JNS HA905 Negative Flow POST Permission Probe 0.1.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha905-negative-flow-post-permission-20261028.yml'
permissions:
  contents: read
concurrency:
  group: jns-ha-security-single-owner-cutover
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed malformed POST and offline nonmutation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha905_core_auth_readonly_once_20261028.py
          python3 gateway/solar/ha905_core_auth_readonly_app/test_probe.py -v
          python3 gateway/solar/test_ha905_core_auth_readonly_once_20261028.py -v
      - name: Prove VM906 remains the sole owner; no active migration
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = nodec
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea qm status 906)" = "status: running"
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodeb qm status 905)" = "status: running"
          test ! -e "$HOME/.local/share/jns-security-failback-20261028/state.json"
          timer="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea systemctl is-active jns-ha906-recovery-20261028.timer || true)"
          test "$timer" != "active"
          echo JNS_AUTH_ONCE_SAFE_GATE=VM906_running_VM905_running_recovery_disarmed
      - name: Install one-time probe, record GETs and rejected schema-invalid POST, uninstall
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 gateway/solar/ha905_core_auth_readonly_once_20261028.py
      - name: Verify neither security VM power state changed
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodea qm status 906)" = "status: running"
          test "$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes nodeb qm status 905)" = "status: running"
          echo JNS_AUTH_ONCE_FINAL_VM_STATUS=both_running
