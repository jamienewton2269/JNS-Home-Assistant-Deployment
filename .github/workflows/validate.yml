name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  production-tests:
    name: Production static and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install crypto test dependency
        run: python -m pip install "cryptography==48.0.1" "PyYAML==6.0.2"
      - name: Verify repository
        run: python tools/verify_repository.py
      - name: Validate app repository YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in (pathlib.Path("repository.yaml"), pathlib.Path("jns_secure_sftp/config.yaml")):
              with path.open(encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              assert isinstance(data, dict)
          PY
      - name: Validate SFTP startup script
        run: bash -n jns_secure_sftp/rootfs/etc/services.d/sshd/run
      - name: Run production security self-test
        run: python tools/production_selftest.py
      - name: Run Home Assistant config-check regression test
        run: python tools/config_check_semantics_selftest.py
