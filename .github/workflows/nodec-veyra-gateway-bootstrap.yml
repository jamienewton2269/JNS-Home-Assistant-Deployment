name: Node C Veyra Gateway Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'gateway/trusted/veyra-gateway-handler-v1.py'
      - 'gateway/trusted/jns-gateway-exec-wrapper-v3.sh'
      - '.github/workflows/nodec-veyra-gateway-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: nodec-veyra-gateway-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Veyra gateway files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/trusted/veyra-gateway-handler-v1.py
          bash -n gateway/trusted/jns-gateway-exec-wrapper-v3.sh

      - name: Inspect existing trusted privilege paths
        shell: bash
        run: |
          set -u
          echo "=== ID ==="
          id
          echo "=== SUDO POLICY ==="
          sudo -n -l 2>&1 || true
          echo "=== TRUSTED WRAPPERS ==="
          for p in             /usr/local/sbin/jns-gateway-exec             /usr/local/sbin/jns-gateway-exec.base             /usr/local/sbin/jns-gateway-refresh             /usr/local/sbin/jns-gateway-install             /usr/local/sbin/jns-gateway-handler-refresh             /usr/local/sbin/jns-management-deploy; do
            if [ -e "$p" ]; then
              ls -l "$p"
            fi
          done
          echo "=== NODE B ROUTE ==="
          ip route get 10.10.10.235 2>&1 || true
          ping -c 1 -W 1 10.10.10.235 2>&1 || true
          echo "VEYRA_BOOTSTRAP_PREFLIGHT_COMPLETE"
