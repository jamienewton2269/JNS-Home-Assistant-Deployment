name: Node C Veyra Gateway Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'gateway/trusted/veyra-gateway-handler-v1.py'
      - 'gateway/trusted/jns-gateway-exec-wrapper-v3.sh'
      - '.github/workflows/nodec-veyra-gateway-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: nodec-veyra-gateway-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install trusted Veyra gateway handler
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -o root -g root -m 0755 /usr/local/libexec

          # Preserve the current root-owned wrapper before upgrading it.
          if [ -x /usr/local/sbin/jns-gateway-exec ]; then
            sudo -n cp -a /usr/local/sbin/jns-gateway-exec /usr/local/sbin/jns-gateway-exec.pre-veyra
          fi

          python3 -m py_compile gateway/trusted/veyra-gateway-handler-v1.py
          bash -n gateway/trusted/jns-gateway-exec-wrapper-v3.sh

          sudo -n install -o root -g root -m 0755             gateway/trusted/veyra-gateway-handler-v1.py             /usr/local/libexec/jns-gateway-veyra
          sudo -n install -o root -g root -m 0755             gateway/trusted/jns-gateway-exec-wrapper-v3.sh             /usr/local/sbin/jns-gateway-exec

          sudo -n test -x /usr/local/libexec/jns-gateway-veyra
          sudo -n test -x /usr/local/sbin/jns-gateway-exec
          echo "VEYRA_GATEWAY_BOOTSTRAP_OK"
