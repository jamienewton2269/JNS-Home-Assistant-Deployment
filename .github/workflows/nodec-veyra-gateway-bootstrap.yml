name: Node C Veyra Gateway Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-veyra-gateway-bootstrap.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Inspect trusted gateway executors
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== CURRENT WRAPPER ==="
          sed -n '1,260p' /usr/local/sbin/jns-gateway-exec
          echo "=== BASE EXECUTOR ==="
          sed -n '1,420p' /usr/local/sbin/jns-gateway-exec.base
          echo "=== END EXECUTOR INSPECTION ==="
