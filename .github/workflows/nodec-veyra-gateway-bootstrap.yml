name: Node C Veyra Gateway Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'gateway/trusted/veyra-gateway-handler-v1.py'
      - 'gateway/trusted/jns-gateway-exec-wrapper-v3.sh'
      - '.github/workflows/nodec-veyra-gateway-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: nodec-veyra-gateway-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Veyra gateway files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/trusted/veyra-gateway-handler-v1.py
          bash -n gateway/trusted/jns-gateway-exec-wrapper-v3.sh

      - name: Bootstrap through existing Node B doorway
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_B="ssh -o BatchMode=yes -o ConnectTimeout=8 nodeb"
          NESTED="ssh -i /root/.ssh/lunar-transfer -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@10.10.10.236"

          cat gateway/trusted/veyra-gateway-handler-v1.py |             $SSH_B "$NESTED 'cat > /tmp/jns-gateway-veyra'"
          cat gateway/trusted/jns-gateway-exec-wrapper-v3.sh |             $SSH_B "$NESTED 'cat > /tmp/jns-gateway-exec-v3'"

          $SSH_B "$NESTED 'set -Eeuo pipefail;
            python3 -m py_compile /tmp/jns-gateway-veyra;
            bash -n /tmp/jns-gateway-exec-v3;
            install -d -o root -g root -m 0755 /usr/local/libexec;
            cp -a /usr/local/sbin/jns-gateway-exec /usr/local/sbin/jns-gateway-exec.pre-veyra;
            install -o root -g root -m 0755 /tmp/jns-gateway-veyra /usr/local/libexec/jns-gateway-veyra;
            install -o root -g root -m 0755 /tmp/jns-gateway-exec-v3 /usr/local/sbin/jns-gateway-exec;
            rm -f /tmp/jns-gateway-veyra /tmp/jns-gateway-exec-v3;
            test -x /usr/local/libexec/jns-gateway-veyra;
            test -x /usr/local/sbin/jns-gateway-exec;
            echo VEYRA_GATEWAY_BOOTSTRAP_OK'"

      - name: Verify GitHub runner can invoke trusted executor
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/local/sbin/jns-gateway-exec
          echo "VEYRA_GATEWAY_READY"
