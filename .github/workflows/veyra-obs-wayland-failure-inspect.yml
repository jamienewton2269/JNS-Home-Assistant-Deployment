name: VEYRA latest Wayland OBS failure inspect
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veyra-obs-wayland-failure-inspect.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 3
    steps:
      - name: Read latest on-host OBS errors with verified SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          target=veyra.home.arpa
          key="$HOME/.ssh/jns-veyra-nodec-ed25519"
          fp='SHA256:z+E4aqDK9CIFktbLAtHryd6qJAjqhh8uqga5Nkj7ls4'
          test -r "$key"
          tmp=$(mktemp -d); chmod 700 "$tmp"; trap 'rm -rf "$tmp"' EXIT
          ssh-keyscan -T 5 -t ed25519 "$target" 2>/dev/null >"$tmp/known_hosts"
          test "$(awk '$2=="ssh-ed25519"{n++}END{print n+0}' "$tmp/known_hosts")" -eq 1
          test "$(ssh-keygen -lf "$tmp/known_hosts" -E sha256 | awk '{print $2;exit}')" = "$fp"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" -o ConnectTimeout=6 "jnsadmin@$target" \
            'sudo -n bash -s' <<'REMOTE'
          set -eu
          root=/opt/veyra/obs-backend-v1/av-qa-v13/runs
          test -d "$root"
          echo "SUDO_ACCESS_OK"
          for svc in veyra-kiosk.service veyra-itvx-vnc-v01.service veyra-virtual-loopback-v01.service; do echo "$svc=$(systemctl is-active "$svc")"; done
          if test -e /run/veyra-obs-v13-paused-recorder; then echo "WARNING_RECOVERY_MARKER_PRESENT"; else echo "ORIGINAL_RECORDER_NOT_PAUSED"; fi
          for d in $(find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%p\n' | sort | tail -3); do
            echo "=== OBS_RUN $(basename "$d") ==="
            for f in "$d/logs/obs-console.log" "$d/logs/verify.log"; do
              if test -f "$f"; then
                echo "--- LOG $(basename "$f") ---"
                grep -Eai 'OpenGL|EGL|Wayland|XSHM|xshm|capture|display|source|renderer|llvmpipe|intel|failed|error|recording|obs-websocket|wlr|QWayland' "$f" | tail -65 | cut -c 1-210 || true
              fi
            done
            echo "--- DEVICE RECORDING COUNT ---"
            find "$d/buffer" -maxdepth 1 -name '*.mkv' -printf '%s %f\n' | head -3
          done
          REMOTE
