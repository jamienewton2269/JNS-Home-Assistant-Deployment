name: JNS Native Two-Way Audio 2026.11 Preflight
on:
  push:
    branches: [main]
    paths:
      - 'gateway/doorbell/native-two-way-2026-11-preflight.request'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate preflight tool syntax
        run: python3 -m py_compile gateway/doorbell/native-two-way-2026-11-preflight.py
      - name: Read-only Home Assistant and backup readiness assessment
        run: python3 gateway/doorbell/native-two-way-2026-11-preflight.py
