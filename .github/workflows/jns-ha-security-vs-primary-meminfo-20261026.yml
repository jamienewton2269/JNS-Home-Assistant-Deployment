name: JNS HA Security Versus Primary Guest RAM and Cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-security-vs-primary-meminfo-20261026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare anonymised HAOS Linux MemAvailable/cache/anon/swap and PSI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_nodea_guest_meminfo_compare_20261026.py
          python3 gateway/solar/ha_nodea_guest_meminfo_compare_20261026.py
