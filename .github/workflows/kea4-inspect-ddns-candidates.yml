name: Kea4 inspect prepared DNS migration candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kea4-inspect-ddns-candidates.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          for spec in 'nodea 10.10.110.11 247' 'nodeb 10.10.110.12 248'; do
            set -- $spec
            echo "=== $1 ==="
            ssh -o HostName="$2" -o HostKeyAlias="$1.home.arpa" -o BatchMode=yes "$1" "pct exec $3 -- bash -s" <<'REMOTE'
          set -u
          python3 - <<'PY'
          import json,os
          for p in ('/root/kea-migration-staging/kea-dhcp4-protected-candidate.conf','/root/kea-migration-staging/kea-dhcp4-ddns-test.conf','/root/kea-migration-staging/kea-dhcp-ddns.conf','/root/kea-migration-staging/kea-dhcp-ddns-tsig-isolated-test.conf'):
           if not os.path.isfile(p):continue
           try:
            d=json.load(open(p))
            v=d.get('Dhcp4',d.get('DhcpDdns',{}))
            print(p,'keys',list(v),'dhcp-ddns',v.get('dhcp-ddns'),'ddns-send-updates',v.get('ddns-send-updates'),'tsig-keys-count',len(v.get('tsig-keys',[])),'domains',len(v.get('forward-ddns',{}).get('ddns-domains',[])))
           except Exception as e:print(p,type(e).__name__,str(e)[:120])
          PY
          echo '--- DNS config builder references'
          grep -nEi 'lease|dhcp|hosts.static|dnsmasq|kea|reload' /usr/local/sbin/jns-dns-build-config | head -65 || true
          echo '--- DNS sync timer/service'
          systemctl cat jns-dns-sync.service jns-dns-sync.timer | head -90
          echo '--- hostname-only reservation'
          grep -n '64:82:14:d7:f9:0e' /var/lib/jnsdns/releases/19/reservations.conf || true
          REMOTE
          done
