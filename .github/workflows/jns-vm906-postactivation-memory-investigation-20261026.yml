name: JNS HA Security Post-Agent Full Memory Diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-vm906-postactivation-memory-investigation-20261026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Profile three Home Assistant roles, read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha_three_roles_offload_audit_v1.py
          python3 -m py_compile gateway/solar/ha_primary_general_addon_usage_v1.py
          python3 -m py_compile gateway/solar/ha_extra_container_role_check_v1.py
          python3 gateway/solar/ha_three_roles_offload_audit_v1.py
          python3 gateway/solar/ha_primary_general_addon_usage_v1.py
          python3 gateway/solar/ha_extra_container_role_check_v1.py
