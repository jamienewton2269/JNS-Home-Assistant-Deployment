name: Node C DNS Importer Live Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-dns-importer-live-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - name: Deploy pinned DNS importer without checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/management_bridge" "$ROOT/gateway/queue"
          curl -fsSL "https://raw.githubusercontent.com/jamienewton2269/JNS-Home-Assistant-Deployment/302cfab24b69fd07f0f16800b772af8d5df67b80/management_bridge/dns_reservation_importer.py" -o "$ROOT/management_bridge/dns_reservation_importer.py"
          curl -fsSL "https://raw.githubusercontent.com/jamienewton2269/JNS-Home-Assistant-Deployment/302cfab24b69fd07f0f16800b772af8d5df67b80/management_bridge/jns-dns-static-apply.py" -o "$ROOT/management_bridge/jns-dns-static-apply.py"
          cat >"$ROOT/gateway/queue/dns-importer-hotfix.json" <<'JSON'
          {"job_id":"dns-importer-hotfix","job_type":"dns_reservation_importer_install","target":"node-c"}
          JSON
          sudo -n /usr/local/sbin/jns-gateway-exec "$ROOT/gateway/queue/dns-importer-hotfix.json"

      - name: Exercise web Apply path and clean smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          systemctl is-active jns-dns-reservation-importer
          echo "=== web API apply ==="
          body='{"records":[{"mac":"00:00:00:00:00:00","ip":"192.0.2.123","name":"jns-dns-importer-test"}]}'
          code="$(curl -sS -o /tmp/jns-dns-api-result.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8770/api/apply)"
          cat /tmp/jns-dns-api-result.json
          echo
          echo "http_status=$code"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/jns-dns-api-result.json'))
          assert d.get('ok') is True, d
          assert d.get('primary_applied') is True, d
          PY
          echo "=== cleanup smoke test ==="
          /usr/local/sbin/jns-dns-static-apply apply '[]'
          echo "=== verify smoke test removed ==="
          if ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new root@10.10.10.247 'grep -q "jns-dns-importer-test.home.arpa" /opt/AdGuardHome/AdGuardHome.yaml'; then
            echo "smoke_test_cleanup=FAILED" >&2
            exit 1
          fi
          echo "smoke_test_cleanup=OK"
          curl -fsS http://127.0.0.1:8770/health
          echo
