name: Verify Veyra ISO HTTP Media Publisher
on:
  push:
    branches: [main]
    paths:
      - gateway/trusted/veyra-publish-iso-media-tree-v092.sh
      - .github/workflows/veyra-iso-http-media-guard.yml
permissions: {contents: read}
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -Eeuo pipefail
          P=gateway/trusted/veyra-publish-iso-media-tree-v092.sh
          bash -n "$P"
          ! grep -Eq 'systemctl |(cp|mv|install|rm) .*autoexec.ipxe|(cp|mv|install|rm) .*vmlinuz|(cp|mv|install|rm) .*initrd.gz' "$P"
          echo '=== MEDIA AND DISK CAPACITY ==='
          df -h /srv/veyra-pxe
          xorriso -indev /srv/veyra-pxe/http/veyra/v0.9.2/Veyra-AutoInstall-v0.9.2.iso -ls /dists/trixie/Release >/dev/null 2>&1
          xorriso -indev /srv/veyra-pxe/http/veyra/v0.9.2/Veyra-AutoInstall-v0.9.2.iso -ls /.disk/info >/dev/null 2>&1
          echo VEYRA_HTTP_MEDIA_PUBLISHER_GUARD_PASS
