name: Node C Runner Worktree Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nodec-runner-worktree-repair.yml'

permissions:
  contents: read

concurrency:
  group: nodec-runner-worktree-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 10
    steps:
      - name: Repair runner worktree without checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_WORKSPACE"
          me="$(id -un)"
          group="$(id -gn)"
          echo "workspace=$repo owner=$me:$group"

          # This is the dedicated self-hosted runner checkout. Earlier
          # root-assisted gateway maintenance left Git objects root-owned,
          # preventing actions/checkout from fetching.
          sudo -n chown -R "$me:$group" "$repo"

          cd "$repo"
          rm -f .git/index.lock .git/shallow.lock .git/HEAD.lock
          rm -rf .git/rebase-apply .git/rebase-merge

          git fetch --prune origin main
          git reset --hard origin/main
          git clean -ffd

          git status --short
          git fsck --no-progress --connectivity-only
          test -w .git/objects
          echo "NODEC_WORKTREE_REPAIR_OK"
