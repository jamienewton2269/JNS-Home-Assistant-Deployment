name: JNS HA-General Hallway Predictive Source Guarded Release
on:
  push:
    branches: [main]
    paths: ['gateway/heating_hallway/hallway_schedule_release.request']
permissions: {contents: read}
concurrency:
  group: jns-ha905-heating-presence-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m py_compile gateway/heating_hallway/release_hallway_schedule_vm905.py
          python3 gateway/heating_hallway/release_hallway_schedule_vm905.py --apply
