name: JNS HA Security Source Dashboard Reference Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-ha-security-source-dashboard-refs-readonly-20261028.yml'
      - 'gateway/solar/ha_security_source_dashboard_refs_readonly_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-ha-security-source-dashboard-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate private read-only source registry comparison
        run: python3 -m py_compile gateway/solar/ha_security_source_dashboard_refs_readonly_20261028.py
      - name: Compare privately staged security dashboard references with VM906 registry
        run: python3 gateway/solar/ha_security_source_dashboard_refs_readonly_20261028.py
