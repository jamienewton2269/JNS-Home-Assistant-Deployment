name: JNS Tuya Freedom Community Tool Tests
on:
  push:
    branches: [feature/jns-tuya-freedom-v01]
    paths:
      - 'community/tuya_freedom/**'
      - '.github/workflows/jns-tuya-freedom-ci.yml'
  pull_request:
    paths:
      - 'community/tuya_freedom/**'
      - '.github/workflows/jns-tuya-freedom-ci.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and transaction tests (no HA credentials)
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile community/tuya_freedom/tuya_freedom.py
          cd community/tuya_freedom
          python -m unittest -v test_tuya_freedom.py
