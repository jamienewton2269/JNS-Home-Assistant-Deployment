name: Verify Isolated Veyra Netboot Candidate
on:
  push:
    branches: [main]
    paths:
      - gateway/trusted/veyra-netboot-candidate-v092.sh
      - .github/workflows/veyra-netboot-candidate-verify.yml
permissions: {contents: read}
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -Eeuo pipefail
          S=gateway/trusted/veyra-netboot-candidate-v092.sh
          bash -n "$S"
          grep -Fq 'VEYRA_NETBOOT_CANDIDATE_PUBLISHED_WITHOUT_LIVE_BOOT_CHANGES' "$S"
          grep -Fq 'priority=low' "$S"
          grep -Fq 'Refusing to overwrite existing candidate' "$S"
          echo '=== OFFICIAL NETBOOT ENDPOINTS ==='
          for file in linux initrd.gz; do
            curl -fLsSI --retry 1 --connect-timeout 10 --max-time 45 "https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/debian-installer/amd64/$file" | grep -i '^HTTP/' | tail -1
          done
          echo '=== ORIGINAL PXE CHECKSUMS ==='
          sha256sum /srv/veyra-pxe/http/autoexec.ipxe /srv/veyra-pxe/http/veyra/v0.9.2/{vmlinuz,initrd.gz}
          echo VEYRA_NETBOOT_CANDIDATE_STATIC_GUARD_PASS
