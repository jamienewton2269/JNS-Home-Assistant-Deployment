name: JNS HA-General Lux Full Runtime Audit
on:
  push:
    branches: [main]
    paths: ['gateway/lux_runtime_audit/request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 gateway/lux_runtime_audit/audit.py
