name: JNS Solar HA900 Backup Capacity Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jns-solar-ha900-backup-capacity.yml'
      - 'gateway/solar/ha900_backup_space_readonly_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jns-solar-ha900-backup-capacity
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check source datastore and off-host backup free space, no writes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile gateway/solar/ha900_backup_space_readonly_v1.py
          python3 gateway/solar/ha900_backup_space_readonly_v1.py
