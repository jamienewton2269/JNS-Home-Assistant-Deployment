name: JNS KC868 MAC Identification Audit
on:
  push:
    branches: [main]
    paths: ['gateway/doorbell/kc868-mac.request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check only KC868 MAC in DHCP and passive traffic
        run: python3 gateway/doorbell/kc868-mac-survey.py
