name: Retire NAS DNS configuration sync safely
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kea4-retire-nas-sync.yml']
permissions:
  contents: read
jobs:
  retire:
    runs-on: [self-hosted, linux, x64, nodec]
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          for spec in 'nodea 10.10.110.11 247' 'nodeb 10.10.110.12 248'; do
            set -- $spec
            echo "=== $1 ==="
            ssh -o HostName="$2" -o HostKeyAlias="$1.home.arpa" -o BatchMode=yes "$1" "pct exec $3 -- bash -s" <<'REMOTE'
          set -Eeuo pipefail
          stamp=20261116-nas-retirement
          backup=/root/kea-migration-backups/$stamp
          install -d -m 0700 "$backup"
          cp -a /var/lib/jnsdns/active "$backup/active-link"
          cp -a /var/lib/jnsdns/releases/19 "$backup/release-19"
          cp -a /usr/local/sbin/jns-dns-sync "$backup/jns-dns-sync"
          cp -a /usr/local/sbin/jns-dns-build-config "$backup/jns-dns-build-config"
          cp -a /etc/jnsdns "$backup/jnsdns"
          cp -a /var/lib/jnsdns/leases "$backup/leases"
          test -s /var/lib/jnsdns/active/dnsmasq.conf
          dnsmasq --test -C /var/lib/jnsdns/active/dnsmasq.conf
          systemctl disable --now jns-dns-sync.timer
          systemctl stop jns-dns-sync.service || true
          systemctl mask jns-dns-sync.timer jns-dns-sync.service
          ! systemctl is-enabled --quiet jns-dns-sync.timer
          systemctl is-active --quiet jns-dns
          systemctl is-active --quiet kea-dhcp6-server
          echo LOCAL_DNS_CONFIG_PRESERVED_NAS_SYNC_RETIRED
          REMOTE
          done
