<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Manager · Approved passkey enrolment</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/browser.js" defer></script></head><body><main><header><span class="brand"><img class="brand-mark" src="/assets/sailing-uk-logo-static.png" alt="" aria-hidden="true"> Club Manager</span><span class="pill">SUPERVISED ENROLMENT</span></header><article><h1>Enrol approved security key</h1><p>This operation is only available after a separate, valid two-officer security approval. No self-registration is permitted.</p><form id="enrol"><label>Assigned officer UUID<input id="officer" required pattern="[a-fA-F0-9-]{36}" autocomplete="off"></label><label>Officer account label<input id="officer-name" maxlength="100" required autocomplete="off"></label><label>Display name<input id="display-name" maxlength="100" required autocomplete="off"></label><button>Enrol security key</button></form><p id="status" role="status"></p><a href="/login">Return to sign in</a></article></main></body></html>
