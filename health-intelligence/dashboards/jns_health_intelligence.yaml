# JNS Health Intelligence v0.1 - standalone YAML Lovelace dashboard
# PLACEHOLDER entities below are intentionally not connected to live data.
# Replace with confirmed Android Companion / Health Connect entity IDs before activation.
title: JNS Health Intelligence
views:
  - title: Overview
    path: overview
    icon: mdi:heart-pulse
    cards:
      - type: markdown
        content: |
          # JNS Health Intelligence
          **Observation dashboard** · Source readings may be delayed.
          
          Not a medical device or emergency monitoring system. No reading should be considered current without its source timestamp.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Person A · Cardiovascular
            show_header_toggle: false
            entities:
              - entity: sensor.jns_health_person_a_heart_rate
                name: Heart rate
                secondary_info: last-updated
              - entity: sensor.jns_health_person_a_resting_heart_rate
                name: Resting heart rate
                secondary_info: last-updated
              - entity: sensor.jns_health_person_a_oxygen_saturation
                name: Blood oxygen
                secondary_info: last-updated
          - type: entities
            title: Person B · Cardiovascular
            show_header_toggle: false
            entities:
              - entity: sensor.jns_health_person_b_heart_rate
                name: Heart rate
                secondary_info: last-updated
              - entity: sensor.jns_health_person_b_resting_heart_rate
                name: Resting heart rate
                secondary_info: last-updated
              - entity: sensor.jns_health_person_b_oxygen_saturation
                name: Blood oxygen
                secondary_info: last-updated
      - type: history-graph
        title: Heart rate · last 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.jns_health_person_a_heart_rate
            name: Person A
          - entity: sensor.jns_health_person_b_heart_rate
            name: Person B
      - type: markdown
        content: |
          ### Acquisition
          Check each sensor's *last updated* timestamp. Home Assistant Companion and watch sync are not continuous.
  - title: Person A
    path: person-a
    icon: mdi:account-heart
    cards:
      - type: entities
        title: Recovery and activity
        entities:
          - entity: sensor.jns_health_person_a_heart_rate
          - entity: sensor.jns_health_person_a_hrv
          - entity: sensor.jns_health_person_a_oxygen_saturation
          - entity: sensor.jns_health_person_a_steps
          - entity: sensor.jns_health_person_a_sleep_duration
      - type: history-graph
        title: Recovery trends · 7 days
        hours_to_show: 168
        entities:
          - sensor.jns_health_person_a_resting_heart_rate
          - sensor.jns_health_person_a_hrv
  - title: Person B
    path: person-b
    icon: mdi:account-heart-outline
    cards:
      - type: entities
        title: Recovery and activity
        entities:
          - entity: sensor.jns_health_person_b_heart_rate
          - entity: sensor.jns_health_person_b_hrv
          - entity: sensor.jns_health_person_b_oxygen_saturation
          - entity: sensor.jns_health_person_b_steps
          - entity: sensor.jns_health_person_b_sleep_duration
      - type: history-graph
        title: Recovery trends · 7 days
        hours_to_show: 168
        entities:
          - sensor.jns_health_person_b_resting_heart_rate
          - sensor.jns_health_person_b_hrv
  - title: History
    path: history
    icon: mdi:chart-timeline-variant
    cards:
      - type: history-graph
        title: Resting heart rate · 7 days
        hours_to_show: 168
        entities:
          - sensor.jns_health_person_a_resting_heart_rate
          - sensor.jns_health_person_b_resting_heart_rate
      - type: history-graph
        title: Sleep duration · 7 days
        hours_to_show: 168
        entities:
          - sensor.jns_health_person_a_sleep_duration
          - sensor.jns_health_person_b_sleep_duration
